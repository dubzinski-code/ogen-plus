function loadSampleData(type) {
  const map = { yesodi: SAMPLE_YESODI, hatava: SAMPLE_HATAVA, tichon: SAMPLE_TICHON };
  const b64 = map[type];
  if (!b64) return;
  try {
    const binary = atob(b64);
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
    const rows = parseExcel(bytes.buffer);
    const students = processOgenData(rows);
    if (students && students.length > 0) {
      appState.students = students;
      render();
    } else {
      alert('לא נמצאו תלמידים בקובץ הדוגמה.');
    }
  } catch(e) {
    console.error('שגיאה בטעינת דוגמה:', e);
    alert('שגיאה בטעינת נתוני הדוגמה.');
  }
}

      // ========== יסודי — Pre-Foundation (Pre-A1) Can-Do Descriptors — כיתות ג-ד ==========
      { title: 'יעדי Reading Readiness — Pre-Foundation (Pre-A1)', description: 'לפי ה-Can-Do Descriptors ברמת Pre-A1 (כיתות ג-ד): בשלב זה התלמיד לומד לזהות אותיות ולקשר בין אות לצליל (Letter-Sound Correspondence), מפתח מודעות פונולוגית (PA) — חרוזים, הברות, צלילי פתיחה וסיום, ורוכש מילות יסוד ראשונות (~200 מילים מ-Pre-Band I) באופן שמיעתי ובע"פ. יעדי Can-Do: I can recognize and name most letters of the English alphabet; I can identify the beginning sound of a word; I can say simple words and phrases about myself.', frequency: 'בכל שיעור', tools: ['Pre-Foundation Can-Do checklist', 'כרטיסי אותיות', 'פעילויות PA'], udlPrinciple: 'ייצוג מרובה', source: 'Pre-Foundation Can-Do Descriptors (Pre-A1)', ageGroup: 'יסודי' },
      { title: 'יעדי Beginning Reading & Writing — Pre-Foundation (Pre-A1)', description: 'לפי ה-Can-Do Descriptors ברמת Pre-A1: התלמיד מתחיל לפענח מילים חד-הברתיות פשוטות (CVC: cat, dog, sit) באמצעות GPCs בסיסיים, מזהה sight words ראשונים (the, is, a, I), ומעתיק ומייצר אותיות ומילים בודדות. יעדי Can-Do: I can read simple CVC words; I can copy and write familiar words; I can understand simple illustrated sentences. הבסיס לשלבים הבאים של מודל SELA — המעבר מ-Visual Cue ל-Phonetic Cue.', frequency: 'בכל שיעור, 10 דקות', tools: ['דפי trace & copy', 'רשימת sight words', 'מילים CVC', 'Pre-Band I word list'], udlPrinciple: 'פעולה וביטוי', source: 'Pre-Foundation Can-Do Descriptors (Pre-A1)', ageGroup: 'יסודי' },
      { title: '10 MUSTS — עקרונות חובה להוראת Pre-Foundation', description: 'עקרונות חובה מתוכנית הלימודים 2020 לרמת Pre-A1: (1) פיתוח שפה דבורה כבסיס לקריאה וכתיבה; (2) חשיפה עשירה לאנגלית מובנת (comprehensible input); (3) הוראת PA (מודעות פונולוגית) שיטתית; (4) הוראת אותיות וצלילים (GPCs) מפורשת ורב-חושית; (5) שילוב L1 כמשאב; (6) חזרה וביסוס (recycling) שיטתי; (7) הקדמת שמיעה ודיבור לפני קריאה וכתיבה; (8) שימוש בסיפורים, שירים ומשחקים מותאמי גיל; (9) הערכה מעצבת שוטפת; (10) בניית ביטחון עצמי והנאה מלמידת אנגלית.', frequency: 'עקרונות מנחים לכל שיעור', tools: ['תוכנית לימודים 2020 — יסודי', 'Pre-Foundation Can-Do Descriptors'], udlPrinciple: 'מעורבות', source: 'תוכנית הלימודים באנגלית 2020 - יסודי', ageGroup: 'יסודי' },
      // ========== יסודי — SELA + תוכנית לימודים 2020 ==========
      { title: 'הוראת פונטיקה שיטתית (Phonics) — לפי מודל SELA', description: 'למדו את הקשר אות-צליל (GPCs) בצורה שיטתית ומפורשת, לפי שלבי מודל SELA (Russak, 2019): (1) בשלב Visual Cue — הכרת אותיות בודדות, PA activities (מודעות פונולוגית: חרוזים, הברות, צלילי פתיחה); (2) בשלב Phonetic Cue — GPCs מרובים (sh, ch, th, ee, oa), דפוסי onset-rime, הברות אורתוגרפיות, הרחבת sight words; (3) בשלב Effortful — GPCs מורכבים, סוגי הברות לפענוח, מילים רב-הברתיות. ההוראה חייבת להיות רב-חושית: ראייה + שמיעה + תנועה + כתיבה.', frequency: 'בכל שיעור, 10-15 דקות', tools: ['כרטיסי GPCs', 'משחקי צלילים', 'אותיות מגנטיות', 'מודל SELA'], udlPrinciple: 'ייצוג מרובה', source: 'מודל SELA - Russak 2019', ageGroup: 'יסודי' },
      { title: 'הוראת אוצר מילים — Pre-Band I ו-Band I', description: 'למדו מילים חדשות מתוך Pre-Band I (כיתה ג, ~200 מילים) ו-Band I (כיתות ד-ו, ~1,200 מילים, רמת A1). כ-90% מהמילים ברמת הפקתית (productive) — התלמיד צריך להשתמש בהן באופן פעיל. הציגו מילים עם תמונות, תנועות גוף וסיפורים. שלבו מִחזוּר שיטתי: חזרה על מילים ישנות בכל שיעור. למדו מילים בהקשר: משפטים, סיפורים קצרים, שירים. שלבו פעילויות קליטתיות (הבנה) והפקתיות (שימוש).', frequency: 'בכל שיעור, 10-15 דקות', tools: ['כרטיסיות תמונה-מילה', 'Pre-Band I / Band I word lists', 'משחקי מילים', 'Quizlet'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית הלימודים באנגלית 2020 - יסודי', ageGroup: 'יסודי' },
      { title: 'בניית שטף קריאה באנגלית (Fluency)', description: 'לפי מודל SELA, המעבר משלב Effortful לשלב Automatic דורש בניית אוטומטיות בזיהוי מילים. תרגלו: (1) קריאה חוזרת (repeated readings) של טקסטים מוכרים — אותו טקסט 3-4 פעמים עד לשטף; (2) הרחבת sight words — מילים שהתלמיד מזהה מיידית ללא פענוח; (3) קריאת טקסטים קצרים (~30 מילים) עם דפוסי משפטים חוזרים ודפוסי מילים מוכרים; (4) קריאת עמיתים — תלמידים קוראים בזוגות ונותנים משוב.', frequency: '3 פעמים בשבוע, 15 דקות', tools: ['טקסטים קצרים מדורגים', 'רשימות sight words', 'כרטיסי מעקב שטף'], udlPrinciple: 'פעולה וביטוי', source: 'מודל SELA - Russak 2019', ageGroup: 'יסודי' },
      { title: 'כתיבה מודרכת ראשונית באנגלית', description: 'לפי מודל SELA, כתיבה מתפתחת בשלבים: (1) Visual Cue — העתקה (trace, match, copy), עיצוב אותיות נכון; (2) Phonetic Cue — כתיבת תגובות של מילה או שתיים; (3) Effortful — תגובה לשאלות WH, משפטים עם מבנים דקדוקיים פשוטים. למדו כתיבת אותיות (letter formation) באופן מפורש, ואז הרחיבו לכתיבת מילים, משפטים פשוטים, ותגובות קצרות. השתמשו בתבניות כתיבה ובפיגומים.', frequency: 'שבועי, 15-20 דקות', tools: ['דפי עבודה לעיצוב אותיות', 'תבניות כתיבה', 'כרטיסי מילים'], udlPrinciple: 'פעולה וביטוי', source: 'מודל SELA - Russak 2019', ageGroup: 'יסודי' },
      { title: 'שפה דבורה כבסיס — Oral Language Development', description: 'לפי עקרונות מודל SELA: "פיתוח שפה דבורה הוא הבסיס עליו נבנים כישורי שפה כתובה." שלבו בכל שיעור: שיחה באנגלית פשוטה (Classroom English), חזרה על ביטויים שימושיים, שירים ומשחקים בע"פ, סיפורים בהקראה (read-aloud) עם דיון, והוראת מילים חדשות דרך שמיעה לפני קריאה. הקדימו תמיד חשיפה שמיעתית לחשיפה כתובה.', frequency: 'בכל שיעור, שזור בהוראה', tools: ['כרטיסי Classroom English', 'שירים', 'סיפורים מוקלטים', 'תמונות לדיון'], udlPrinciple: 'מעורבות', source: 'מודל SELA - Russak 2019', ageGroup: 'יסודי' },
      { title: 'למידה ספיראלית — חזרה ממוקדת ומעמיקה', description: 'לפי עקרון הלמידה הספיראלית של מודל SELA: כל מיומנות חדשה נבנית על מיומנויות קודמות, וחומר שנלמד חוזר בצורה מעמיקה ומורחבת. תכננו את ההוראה כך שמילים, GPCs ומבנים שנלמדו חוזרים באופן מתמשך. שלבו הערכה מעצבת שוטפת: מבדקי שטף קריאה, מבדקי כתיב, והתבוננות — כדי לדעת מה כל תלמיד יודע, יכול לעשות, ועדיין צריך ללמוד. עדכנו את ההוראה בהתאם.', frequency: 'שוטף, שזור בהוראה', tools: ['מבדקי שטף', 'מבדקי כתיב', 'טבלת מעקב אישית'], udlPrinciple: 'פעולה וביטוי', source: 'מודל SELA - Russak 2019', ageGroup: 'יסודי' },
      // ========== יסודי — CurriculumLD: המלצות לפי תחומי תוכנית הלימודים ==========
      { title: 'העשרת אוצר מילים לתלמידים עם צרכים מיוחדים — יסודי', description: 'לפי CurriculumLD: תלמידים עם צרכים מיוחדים מגיעים לרוב עם אוצר מילים מצומצם. המלצות: (1) הביאו לתודעה מילים לועזיות (anglicisms) מהשימוש היומיומי בעברית/ערבית; (2) למדו מילים בהקשר ולא ברשימות מנותקות; (3) השתמשו באמצעים רב-חושיים: חפצים, תמונות, שירים, דקלומים, משחקי מילים; (4) חזרו ותרגלו פעמים רבות באמצעות כרטיסיות הבזק; (5) למדו משפחות מילים באמצעות word maps; (6) למדו תלמידים ליצור אסוציאציות לזכירת מילים. ההמלצות חוצות את כל ארבעת תחומי תוכנית הלימודים.', frequency: 'בכל שיעור, שזור בהוראה', tools: ['כרטיסיות הבזק', 'word maps', 'חפצים ותמונות', 'שירים ודקלומים', 'משחקי מילים'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית לימודים באנגלית - תלמידים עם צרכים מיוחדים', ageGroup: 'יסודי' },
      { title: 'אינטראקציה חברתית באנגלית — תלמידים עם צרכים מיוחדים', description: 'לפי CurriculumLD — תחום אינטראקציה חברתית: (1) צרו אווירה מקבלת ותומכת בכיתה; (2) המורה מדגימ/ה תבניות שפה אינטראקטיביות (שאילת שאלות, הבעת העדפות); (3) תרגלו באמצעות משחקים ומשחקי תפקידים (role-play); (4) עודדו הבעת רגשות ותחושות באמצעות קומיקס, תמונות ודמויות; (5) תרגלו תבניות שאלות בסיסיות בהדרגה; (6) לתלמידים עם אוטיזם — התייעצו עם מומחה הכיתה בנוגע ליצירת קשר עין ואסטרטגיות מותאמות; (7) לתלמידים עם לקות שמיעה — התייעצו עם מומחה בנוגע לשימוש בתקשורת בע\"פ.', frequency: 'בכל שיעור, 10 דקות', tools: ['כרטיסי role-play', 'קומיקס', 'תמונות רגשות', 'תבניות שיחה'], udlPrinciple: 'מעורבות', source: 'תוכנית לימודים באנגלית - תלמידים עם צרכים מיוחדים', ageGroup: 'יסודי' },
      { title: 'גישה לטקסטים כתובים — תלמידים עם צרכים מיוחדים (יסודי)', description: 'לפי CurriculumLD — תחום גישות למידע מטקסטים: (1) העשירו את סביבת הכיתה בכרזות, לוחות זמנים, מפות ועבודות תלמידים באנגלית; (2) לפני הקריאה — אסטרטגיות הכנה: זיהוי סוג הטקסט, קריאת כותרת, ניבוי לפי תמונות, איתור מילים מוכרות; (3) השתמשו בידע דקדוקי ותחבירי כאמצעי עזר להבנה; (4) למדו שימוש במילון: סדר ה-ABC, חלקי הדיבור, שימוש בתחיליות וסיומות (un-, -ness); (5) השתמשו במארגנים גרפיים לרצף, השוואה ומיון מידע; (6) למדו מילות רצף (first, then, after, finally) לתמיכה בהבנת טקסט.', frequency: 'בכל שיעור קריאה', tools: ['כרזות ולוחות באנגלית', 'מארגנים גרפיים', 'כרטיסי אסטרטגיות קריאה', 'מילון מותאם', 'כרטיסי מילות רצף'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית לימודים באנגלית - תלמידים עם צרכים מיוחדים', ageGroup: 'יסודי' },
      { title: 'הצגת מידע ורעיונות — תלמידים עם צרכים מיוחדים (יסודי)', description: 'לפי CurriculumLD — תחום הצגת מידע: (1) נווגו בין סוגי הצגה שונים: קצרים (תיאור, חיבור) וארוכים (פרויקט); (2) ודאו שלתלמיד יש כלים בסיסיים: אוצר מילים מתאים ואמצעי הצגה; (3) לעבודות קצרות — בחרו נושאים מעולם התלמיד (משפחה, ספורט, תחביבים); (4) לעבודות מורכבות — לוו את התלמיד בכל השלבים: בחירת נושא, איסוף חומרים, ארגון וכתיבה; (5) השתמשו בסיעור מוחות (brainstorming), מחסן מילים (word bank), ומפות סמנטיות; (6) לתלמידים עם חרדת הופעה — הציעו עזרים (שקפים, PowerPoint, תמונות, הקלטה), אפשרו תרגול מול המורה לפני הכיתה, ותנו משוב חיובי; (7) לתלמידים עם קשיי דיבור — שקלו כלי תקשורת חלופיים.', frequency: 'שבועי', tools: ['word bank', 'מפות סמנטיות', 'תבניות הצגה', 'PowerPoint', 'כלי הקלטה'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית לימודים באנגלית - תלמידים עם צרכים מיוחדים', ageGroup: 'יסודי' },
      { title: 'ספרות ותרבות באנגלית — תלמידים עם צרכים מיוחדים', description: 'לפי CurriculumLD — תחום הכרת ספרות ותרבות: (1) חשפו תלמידים למגוון סוגות טקסט (text genres); (2) הציגו סרטוני וידאו המתארים תרבויות ומנהגים שונים של דוברי אנגלית; (3) פתחו אמפתיה ורגישות לתרבויות אחרות באמצעות סרטים, חפצים, ראיונות ושיחה; (4) למדו ביטויים אידיומטיים בהקשרים שונים; (5) דונו על השווה והשונה בין התרבות המקומית לתרבויות דוברי אנגלית. הערה: תחום הוקרת הספרות דורש רמות הפשטה גבוהות ומתאים בעיקר לתלמידי בגרות.', frequency: 'שבועי', tools: ['סרטוני תרבות', 'חפצים ותמונות', 'כרטיסי ביטויים אידיומטיים', 'טקסטים מסוגות שונות'], udlPrinciple: 'מעורבות', source: 'תוכנית לימודים באנגלית - תלמידים עם צרכים מיוחדים', ageGroup: 'יסודי' },
      { title: 'גישה מוכוונת-פעולה (Action-Oriented Approach)', description: 'תכננו משימות אותנטיות שבהן התלמידים משתמשים באנגלית לצרכים אמיתיים: כתיבת הודעה לחבר בחו"ל, קריאת מדריך למשחק, צפייה בסרטון והפקת תוצר. הגישה תואמת את תוכנית הלימודים 2020 ואת ה-CEFR — התלמיד כמשתמש בשפה ולא רק לומד שלה.', frequency: 'בכל שיעור', tools: ['משימות אותנטיות', 'Can-do statements', 'תבניות משימה'], udlPrinciple: 'מעורבות', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      { title: 'הוראת אוצר מילים ממוקדת עם מִחזוּר (Vocabulary Recycling)', description: 'למדו 8-10 מילים חדשות בשבוע מתוך Band II (רמת A2) בשילוב חזרה שיטתית על מילים ישנות. שלבו פעילויות מגוונות: קומוניקטיביות ולא-קומוניקטיביות, בהקשר ומנותקות מהקשר, הבנה והפקה. הקדישו 5 דקות בכל שיעור ל-"vocabulary oldies" — חזרה על מילים שנלמדו.', frequency: 'בכל שיעור, 10-15 דקות', tools: ['Lexical Bands - Band II', 'כרטיסי מילים דיגיטליים', 'Quizlet/Kahoot', 'רשימות מילים אישיות'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      { title: 'הוראת דקדוק בהקשר (Grammar in Context)', description: 'למדו מבני שפה דרך חשיפה לטקסטים אותנטיים ולא דרך כללים מופשטים. רצף ההוראה: (1) חשיפה מרובה בהקשר; (2) הבנה קליטתית של המשמעות; (3) שימוש ראשוני כ-chunks; (4) הפקה יצירתית עם שגיאות צפויות. אל תדרשו דיוק מלא — שגיאות הן חלק בריא מתהליך הרכישה.', frequency: 'שבועי, שזור בהוראה', tools: ['טקסטים אותנטיים', 'English Grammar Profile', 'דפי עבודה ממוקדי משמעות'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      { title: 'קריאה נרחבת באנגלית (Extensive Reading)', description: 'הקצו זמן קבוע לקריאה חופשית באנגלית — ספרונים מדורגים (Graded Readers) ברמת A2. התלמידים בוחרים ספר לפי עניין ורמה, קוראים בשקט, ומשתפים בקצרה. הקריאה הנרחבת מעשירה אוצר מילים, משפרת שטף ובונה הרגלי קריאה עצמאית.', frequency: 'פעם בשבוע, 20 דקות', tools: ['ספרונים מדורגים (Graded Readers)', 'פינת קריאה באנגלית', 'יומן קריאה אישי'], udlPrinciple: 'מעורבות', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      { title: 'ייצוג רב-מודלי (Multimodal Input)', description: 'כל נושא חדש מולמד בשילוב ערוצים מרובים: טקסט כתוב + הקשבה (אודיו/סרטון) + תמונות ואינפוגרפיקות + דיון בעל-פה. בהתאם לעקרונות ה-CEFR, שלבו פעילויות קליטה (reception), הפקה (production), אינטראקציה (interaction) ומתווכות (mediation).', frequency: 'בכל שיעור', tools: ['סרטוני YouTube מתומללים', 'פודקאסטים לרמת A2', 'אינפוגרפיקות', 'Google Docs לכתיבה שיתופית'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      { title: 'שקיפות מטרות למידה — Can-do Statements', description: 'שתפו את התלמידים במטרות הלמידה בצורת "I can..." בתחילת כל יחידה. למשל: "I can understand a short story and talk about the characters." התלמידים עוקבים אחרי ההתקדמות שלהם ומעריכים את עצמם. זה מפתח מודעות מטא-קוגניטיבית ואוטונומיה בלמידה.', frequency: 'בתחילת כל יחידה, עדכון שוטף', tools: ['פוסטר Can-do Statements', 'צ\'קליסט אישי', 'טופס הערכה עצמית'], udlPrinciple: 'מעורבות', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      { title: 'שילוב ICT ומדיה דיגיטלית', description: 'שלבו כלים דיגיטליים ללמידת אנגלית: כתיבה שיתופית ב-Google Docs, יצירת מצגות דיגיטליות באנגלית, צפייה בסרטונים עם כתוביות, שימוש בכלי AI לתרגול שיחה ולמשוב על כתיבה. עודדו תקשורת עם קהילות דוברות אנגלית.', frequency: 'שבועי', tools: ['Google Docs', 'Canva', 'כלי AI לתרגול שפה', 'פלטפורמות חילופי תרבות'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      { title: 'למידה שיתופית ואינטראקטיבית', description: 'שלבו עבודה בזוגות ובקבוצות בכל שיעור: דיאלוגים מובנים, משימות Information Gap, דיונים מונחים, ופעילויות מתווכות (mediation) שבהן תלמיד מעביר מידע לעמית שלא נחשף אליו. שפת הכיתה — אנגלית ככל האפשר.', frequency: 'בכל שיעור, 15-20 דקות', tools: ['כרטיסי דיאלוג', 'משימות Information Gap', 'Role-play cards'], udlPrinciple: 'מעורבות', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      { title: 'הערכה מגוונת ומשולבת', description: 'שלבו הערכה מעצבת ומסכמת: משוב שוטף על ביצועי שפה, הערכה עצמית ועמיתים באמצעות רובריקות שקופות, תיקי עבודות (portfolios), ומשימות ביצוע אותנטיות. הפחיתו חרדת מבחנים — הסבירו מבנה מבחן ולמדו אסטרטגיות מבחן.', frequency: 'שוטף + מסכם', tools: ['רובריקות הערכה', 'תיק עבודות דיגיטלי', 'טופסי הערכה עצמית Can-do'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      // ========== תיכון (High School) — Band III ==========
      { title: 'הוראת אוצר מילים אקדמי — Band III', description: 'למדו 10-12 מילים חדשות בשבוע מתוך Band III (Core I לרמת 4 יח"ל, Core II לרמת 5 יח"ל). הבחינו בין ידע קליטתי (Receptive — מילים שהתלמיד צריך לזהות ולהבין) לידע הפקתי (Productive — מילים שהתלמיד צריך להשתמש בהן באופן פעיל). שלבו מִחזוּר שיטתי: כל שיעור פותח ב-5 דקות של "vocabulary oldies" וכולל חשיפה חוזרת דרך טקסטים, משימות כתיבה ודיונים. למדו מילים בהקשר ולא ברשימות מבודדות — שלבו קולוקציות, בני משפחת מילים (word families) ודוגמאות מתוך טקסטים אותנטיים.', frequency: 'בכל שיעור, 10-15 דקות', tools: ['Lexical Band III - Core I & Core II', 'כרטיסי מילים דיגיטליים', 'Quizlet/Kahoot', 'רשימות מילים אישיות', 'AWL/AVL'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית הלימודים באנגלית 2020 - תיכון; Lexical Band III', ageGroup: 'תיכון' },
      { title: 'גישה מוכוונת-פעולה ומשימות אותנטיות (Action-Oriented Approach)', description: 'תכננו משימות אותנטיות ברמת B1-B2 שבהן התלמידים משתמשים באנגלית לצרכים אמיתיים: כתיבת מאמר דעה, ניתוח מקורות מידע מקוונים, ניהול דיון מובנה, יצירת פודקאסט או מצגת בנושא אקטואלי. הגישה תואמת את ה-CEFR ואת הדגש על ה-Action-Oriented Approach של תוכנית 2020 — התלמיד כסוכן חברתי המשתמש בשפה לביצוע פעולות בעלות משמעות.', frequency: 'בכל שיעור', tools: ['משימות אותנטיות ברמת B1-B2', 'Can-do statements', 'רובריקות משימה', 'CEFR Companion Volume'], udlPrinciple: 'מעורבות', source: 'תוכנית הלימודים באנגלית 2020 - תיכון', ageGroup: 'תיכון' },
      { title: 'קריאה אקדמית והבנת טקסטים מורכבים', description: 'חשפו את התלמידים לטקסטים אותנטיים מגוונים ברמת B1-B2: מאמרים מעיתונות, מאמרונים, טקסטים מדעיים-פופולריים, ספרות (prose, poetry, drama). למדו אסטרטגיות קריאה מפורשות: סקירה מקדימה (previewing), חיזוי (predicting), זיהוי רעיון מרכזי, הסקת מסקנות (inferencing), ניתוח מבנה טקסט, זיהוי מילות קישור (discourse markers), והבחנה בין עובדה לדעה. הכינו את התלמידים למשימות ההבנה בבגרות — כולל unseen texts.', frequency: 'בכל שיעור, 20-25 דקות', tools: ['טקסטים אותנטיים ברמת B1-B2', 'דפי אסטרטגיות קריאה', 'מארגנים גרפיים', 'מבחני בגרות לדוגמה'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית הלימודים באנגלית 2020 - תיכון', ageGroup: 'תיכון' },
      { title: 'כתיבה אקדמית ופונקציונלית', description: 'למדו כתיבה מובנית בסוגות הנדרשות בבגרות: מכתב רשמי ובלתי רשמי, מאמר דעה (opinion essay), מאמר משכנע (persuasive essay), דו"ח, ותקציר (summary). הדגישו את תהליך הכתיבה: תכנון (planning), טיוטה (drafting), עריכה (editing), ושכתוב (revising). למדו שימוש במארגנים טקסטואליים (discourse markers): however, furthermore, in addition, on the other hand, consequently. שלבו כתיבה שיתופית ומשוב עמיתים.', frequency: 'שבועי, 30-40 דקות', tools: ['תבניות כתיבה לפי סוגה', 'רובריקות כתיבה', 'רשימות discourse markers', 'Google Docs לכתיבה שיתופית'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - תיכון', ageGroup: 'תיכון' },
      { title: 'הוראת דקדוק מתקדם בהקשר (Grammar in Context — B1-B2)', description: 'למדו מבני שפה מתקדמים הנדרשים ברמת B1-B2 דרך חשיפה לטקסטים אותנטיים: conditional sentences (all types), passive voice, reported speech, relative clauses, modals for speculation, complex tenses. רצף ההוראה: (1) חשיפה בהקשר טקסטואלי; (2) הבנה ויכולת פענוח; (3) שימוש מונחה; (4) הפקה עצמאית. ההוראה מותאמת לרמת היח"ל: ב-4 יח"ל דגש על דיוק במבנים בסיסיים, ב-5 יח"ל — מורכבות והפקה מדויקת.', frequency: 'שבועי, שזור בהוראה', tools: ['English Grammar Profile', 'טקסטים אותנטיים', 'דפי עבודה ממוקדי מבנה', 'תרגילי בגרות'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית הלימודים באנגלית 2020 - תיכון', ageGroup: 'תיכון' },
      { title: 'ספרות — הוראת יצירות חובה (Literature)', description: 'למדו את יצירות הספרות הנכללות בתוכנית הבגרות תוך שילוב כישורי חשיבה מסדר גבוה: ניתוח דמויות, זיהוי נושאים (themes), מוטיבים וסמלים, הבנת סגנון ונקודת מבט, וביקורת טקסטואלית. שלבו דיונים ספרותיים, כתיבה יצירתית בעקבות הטקסט, והשוואה בין יצירות. עבור תלמידי 4 יח"ל — הנגשה באמצעות גרסאות מקוצרות, תמיכה בעברית ומשימות מובנות.', frequency: 'שבועי, שיעור שלם', tools: ['יצירות ספרות מתוכנית הבגרות', 'מדריכי ניתוח ספרותי', 'דפי עבודה', 'סרטוני רקע'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית הלימודים באנגלית 2020 - תיכון', ageGroup: 'תיכון' },
      { title: 'שיח אקדמי ודיון מובנה (Academic Speaking & Discussion)', description: 'פתחו יכולות דיבור ברמת B1-B2: דיון מובנה (structured debate), מצגות בנושאים אקטואליים, תגובות מנומקות לטקסטים, וניהול שיחה אקדמית. למדו ביטויי שיח (discourse phrases): "In my opinion...", "On the other hand...", "I\'d like to add that...", "Could you elaborate?". דגש על שטף, קוהרנטיות וביסוס טיעונים — לא רק על דיוק דקדוקי.', frequency: 'שבועי, 20 דקות', tools: ['כרטיסי נושאי דיון', 'רשימת ביטויי שיח', 'רובריקת הערכת מצגת', 'Role-play cards'], udlPrinciple: 'מעורבות', source: 'תוכנית הלימודים באנגלית 2020 - תיכון', ageGroup: 'תיכון' },
      { title: 'הכנה ממוקדת לבגרות (Bagrut Preparation)', description: 'שלבו בהוראה השוטפת הכנה מתמשכת למבחן הבגרות: תרגול פורמטים של שאלות (unseen text, cloze, rewrite, composition), הכרת מבנה המבחן, אסטרטגיות ניהול זמן, והתמודדות עם חרדת מבחנים. הבחינו בין מיקוד ל-4 יח"ל (Core I — דגש על הבנה והפקה בסיסית) לבין 5 יח"ל (Core I + Core II — הפקה מורכבת, אוצר מילים אקדמי, כתיבה אנליטית). אל תרכזו את ההכנה לסוף — שזרו אותה לאורך כל השנה.', frequency: 'שבועי, שזור בהוראה', tools: ['מבחני בגרות לדוגמה', 'דפי אסטרטגיות מבחן', 'רשימות Band III Core I & Core II', 'טיפים לניהול זמן'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - תיכון; Lexical Band III', ageGroup: 'תיכון' },
      { title: 'אוריינות דיגיטלית ומדיה באנגלית', description: 'שלבו עבודה עם מקורות דיגיטליים באנגלית: ניתוח אתרי אינטרנט, הערכת מהימנות מידע (evaluating sources), קריאה ביקורתית של מדיה חברתית, כתיבת תגובות מנומקות באנגלית, ויצירת תוכן דיגיטלי (בלוג, פודקאסט, סרטון). שלבו כלי AI כמשאב ללמידה: תרגול שיחה, משוב על כתיבה, ולמידה אישית. עודדו צריכה פעילה של תוכן באנגלית מחוץ לכיתה.', frequency: 'שבועי', tools: ['כלי AI לתרגול שפה', 'פלטפורמות יצירת תוכן', 'רשימת מקורות מהימנים', 'Google Docs/Slides'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - תיכון', ageGroup: 'תיכון' },
      { title: 'הערכה מבוססת ביצוע ומשולבת — תיכון', description: 'שלבו הערכה חלופית לצד הערכה מסורתית: תיקי עבודות (portfolios), משימות ביצוע אותנטיות (project-based), מצגות, דיונים מוערכים, והערכה עצמית באמצעות Can-do statements ברמת B1-B2. הערכה מעצבת שוטפת: משוב על טיוטות כתיבה, הקלטות דיבור ומשוב עמיתים. הכינו את התלמידים למבנה הבגרות עם דגש על הבנת קריטריונים ושקיפות בהערכה.', frequency: 'שוטף + מסכם', tools: ['רובריקות הערכה', 'Can-do statements B1-B2', 'תיק עבודות דיגיטלי', 'טפסי הערכה עצמית', 'דוגמאות כתיבה (exemplars)'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - תיכון', ageGroup: 'תיכון' },
      // ========== חטיבת ביניים — CurriculumLD: המלצות אוניברסליות ==========
      { title: 'העשרת אוצר מילים לתלמידים עם צרכים מיוחדים — חט"ב (אוניברסלי)', description: 'לפי CurriculumLD — המלצות שמועילות לכלל הכיתה: (1) חשפו למילות מפתח הנדרשות להבנת הטקסט לפני הקריאה; (2) אספו מילים מוכרות מהטקסט כעוגנים; (3) למדו מילים בהקשר הטקסט ולא ברשימות מנותקות; (4) למדו שימוש במילון: סדר ה-ABC, חלקי דיבור, תחיליות וסיומות ומשמעותן (un-, re-, -ness, -tion); (5) למדו זיהוי סוגי טקסט (סיפור, מכתב, מאמר); (6) תרגלו מילות רצף (first, then, after, finally) ומארגנים גרפיים להבנה. גישה זו מועילה לכל התלמידים ומספקת מענה מובנה לתלמידים עם צרכים מיוחדים.', frequency: 'בכל שיעור, שזור בהוראה', tools: ['כרטיסי מילות מפתח', 'מילון L1-L2', 'מארגנים גרפיים', 'word maps'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית לימודים באנגלית - תלמידים עם צרכים מיוחדים', ageGroup: 'חטיבת ביניים' },
      { title: 'הצגת מידע מובנית — גישה אוניברסלית (חט"ב)', description: 'לפי CurriculumLD — פרקטיקות הוראה שמועילות לכלל הכיתה: (1) סיעור מוחות ומחסן מילים (word bank) לפני כל משימת כתיבה; (2) למדו בניית פסקה: מיון משפטים לפי רלוונטיות, שימוש במילות רצף, הרכבה לפי מודל; (3) בעבודות מורכבות — לוו בכל השלבים: בחירת נושא, איסוף, ארגון; (4) בדקו: תוכן, דיוק לשוני (אותיות גדולות/קטנות, פיסוק, איות, תחביר); (5) השתמשו במארגנים גרפיים: תרשימי זרימה, טבלאות השוואה; (6) הציגו עבודות, הזמינו קהל, עודדו משוב חיובי. התאמות אלה מספקות פיגומים (scaffolding) שמועילים לכלל הלומדים.', frequency: 'שבועי', tools: ['word bank', 'מארגנים גרפיים', 'תבניות פסקה', 'רובריקת כתיבה', 'PowerPoint'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית לימודים באנגלית - תלמידים עם צרכים מיוחדים', ageGroup: 'חטיבת ביניים' },
      // ========== תיכון — CurriculumLD: המלצות אוניברסליות ==========
      { title: 'העשרת אוצר מילים לתלמידים עם צרכים מיוחדים — תיכון (אוניברסלי)', description: 'לפי CurriculumLD — גישה אוניברסלית שמועילה לכלל הכיתה: (1) חשפו למילות מפתח מרכזיות לפני קריאת טקסט; (2) אספו מילים מוכרות כעוגנים; (3) למדו מילים בהקשר הטקסט; (4) חזקו שימוש במילון: זיהוי חלקי דיבור, תחיליות וסיומות, ובחירת הפירוש המתאים; (5) למדו זיהוי סוגי טקסט אותנטיים (מאמר, דו"ח, מודעה, סיפור); (6) תרגלו שימוש במארגנים גרפיים להבנת מבנה הטקסט. לתלמידי 3 יח"ל — התמקדו באוצר מילים פונקציונלי ו-Band II; לתלמידי 4-5 יח"ל — Band III Core I/II.', frequency: 'בכל שיעור, שזור בהוראה', tools: ['כרטיסי מילות מפתח Band III', 'מילון L1-L2 / L2-L2', 'מארגנים גרפיים', 'word families'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית לימודים באנגלית - תלמידים עם צרכים מיוחדים', ageGroup: 'תיכון' },
      { title: 'הצגת מידע וכתיבה — גישה אוניברסלית (תיכון)', description: 'לפי CurriculumLD — פרקטיקות הוראה שמועילות לכלל הכיתה: (1) בחרו נושאים מעולם התלמיד ומתחומי לימוד מוכרים; (2) לעבודות מורכבות — לוו בכל השלבים כתהליך (process writing); (3) למדו בניית פסקה ורצף טקסט באמצעות מודלים, גזירה והרכבה, ומארגנים גרפיים; (4) בדקו: תוכן, דיוק לשוני; (5) הציגו עבודות והזמינו קהל — לחיזוק ביטחון; (6) עודדו שימוש בעזרים (מצגות, תמונות, הקלטות) ומשוב חיובי ספציפי; (7) שלבו כתיבה בעזרת טכנולוגיה: מחשב, speech-to-text. התאמות אלה מהוות פיגומים שמועילים לכלל התלמידים, בדגש על הכנה לבגרות.', frequency: 'שבועי', tools: ['word bank', 'תבניות כתיבה לבגרות', 'מארגנים גרפיים', 'Google Docs', 'כלי speech-to-text'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית לימודים באנגלית - תלמידים עם צרכים מיוחדים', ageGroup: 'תיכון' },
      { title: 'ספרות ותרבות — גישה אוניברסלית (תיכון)', description: 'לפי CurriculumLD — פרקטיקות אוניברסליות בתחום ספרות ותרבות: (1) חשפו למגוון סוגות טקסט; (2) הציגו סרטוני וידאו על תרבויות דוברי אנגלית; (3) פתחו אמפתיה ורגישות באמצעות סרטים, חפצים, ראיונות ושיחה; (4) למדו ביטויים אידיומטיים בהקשרים מגוונים; (5) דונו על הדמיון וההבדלים בין התרבות המקומית לתרבויות אנגלופוניות. תחום הוקרת הספרות דורש רמות הפשטה גבוהות — הנגישו באמצעות גרסאות מקוצרות, תמיכה ויזואלית ודיון בעברית לתלמידים שזקוקים לכך.', frequency: 'שבועי', tools: ['סרטוני תרבות', 'גרסאות ספרות מונגשות', 'כרטיסי ביטויים', 'דפי עבודה לניתוח תרבותי'], udlPrinciple: 'מעורבות', source: 'תוכנית לימודים באנגלית - תלמידים עם צרכים מיוחדים', ageGroup: 'תיכון' }
    ],
    targeted: [
      { title: 'קבוצת קריאה מודרכת באנגלית', description: 'קבוצה קטנה עם ספרונים מדורגים (Graded Readers) ותרגול פונטיקה.', frequency: '3 פעמים בשבוע, 20 דקות', tools: ['ספרונים מדורגים'], udlPrinciple: 'פעולה וביטוי', ageGroup: 'יסודי' },

      // ========== יסודי — ממוקד — SELA ==========
      { title: 'קבוצת חיזוק phonics — שלב Phonetic Cue', description: 'קבוצה קטנה (4-6 תלמידים) בשלב Phonetic Cue לפי מודל SELA: תרגול GPCs מרובים (digraphs: sh, ch, th, ee, oa), דפוסי onset-rime (cat-hat-mat, make-lake-take), הברות אורתוגרפיות, והרחבת sight words. פעילויות: מיון מילים לפי דפוס, בניית מילים מאותיות, קריאת משפטים פשוטים עם מילים מוכרות, וטקסטים קצרים (~30 מילים) עם דפוסים חוזרים.', frequency: '3 פעמים בשבוע, 20 דקות', tools: ['כרטיסי GPCs', 'אותיות מגנטיות', 'משחקי onset-rime', 'טקסטים מדורגים'], udlPrinciple: 'פעולה וביטוי', source: 'מודל SELA - Russak 2019', ageGroup: 'יסודי' },
      { title: 'קבוצת חיזוק פענוח — שלב Effortful', description: 'קבוצה קטנה (4-6 תלמידים) בשלב Effortful לפי מודל SELA: תרגול morphemes (prefixes: un-, re-; suffixes: -ing, -ed, -tion), דפוסי מילים לא רגילים (irregular patterns), מילים רב-הברתיות, וmilot חריגות (exception words). שילוב קריאה חוזרת (repeated readings) של טקסטים מוכרים (~70 מילים) לבניית שטף, ומשימות כתיבה מודרכות (scaffolded writing tasks).', frequency: '3 פעמים בשבוע, 20 דקות', tools: ['כרטיסי morphemes', 'רשימות exception words', 'טקסטים לקריאה חוזרת', 'תבניות כתיבה'], udlPrinciple: 'פעולה וביטוי', source: 'מודל SELA - Russak 2019', ageGroup: 'יסודי' },
      { title: 'קבוצת חיזוק אוצר מילים — Band I', description: 'קבוצה קטנה (4-6 תלמידים) לתרגול ממוקד של מילים מ-Band I (רמת A1). פעילויות: התאמה תמונה-מילה, משפטי השלמה, כתיבת מילים עם איות נכון, ומשחקי L1-L2. דגש על מעבר מזיהוי (receptive) לשימוש פעיל (productive). שילוב מִחזוּר: חזרה על מילים שנלמדו בשבועות קודמים.', frequency: '3 פעמים בשבוע, 15 דקות', tools: ['כרטיסי מילים Band I', 'משחקי התאמה', 'דפי עבודה'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - יסודי', ageGroup: 'יסודי' },
      { title: 'תרגול כתיב (Spelling) — לפי שלבי SELA', description: 'קבוצה קטנה לתרגול כתיב באנגלית לפי שלבי ההתפתחות: (1) Phonetic Cue — כתיב פונטי, דגש על עיצורים בודדים, מעט ייצוג תנועות; (2) Effortful — כתיב מבוסס ידע אורתוגרפי, דיוק בכתיב מילים חד-הברתיות, ייצוג תנועות בודדות ודיגרפים שכיחים; (3) Automatic — ייצוג מילים רב-הברתיות בדיוק גובר. תרגול: כתיבה מילון, מבדקי כתיב שבועיים, תיקון עצמי.', frequency: '2-3 פעמים בשבוע, 10-15 דקות', tools: ['רשימות כתיב שבועיות', 'דפי תרגול', 'מבדקי כתיב'], udlPrinciple: 'פעולה וביטוי', source: 'מודל SELA - Russak 2019', ageGroup: 'יסודי' },
      { title: 'קבוצת חיזוק אוצר מילים — Band II', description: 'קבוצה קטנה (5-7 תלמידים) לתרגול ממוקד של מילים מ-Band II Core I ו-Core II. פעילויות מגוונות: התאמה מילה-הגדרה, משפטי השלמה, כתיבת משפטים עם מילים חדשות, ומשחקי "מילה-מול-מילה" (L1-L2). דגש על מעבר מידע קליטתי להפקתי.', frequency: '3 פעמים בשבוע, 20 דקות', tools: ['כרטיסי מילים Band II', 'משחקי התאמה', 'דפי עבודה ממוקדי אוצר מילים'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      { title: 'קבוצת קריאה מונחית ברמת A2', description: 'קבוצה קטנה (4-6 תלמידים) לקריאה מודרכת של טקסטים ברמת A2: סיפורים קצרים, קומיקס, מכתבים ומאמרונים. לפני הקריאה — חיבור לידע קודם והנגשת אוצר מילים; תוך כדי — עצירות לשאלות הכוונה; אחרי — דיון ומשימת המשך.', frequency: '3 פעמים בשבוע, 25 דקות', tools: ['ספרונים מדורגים ברמת A2', 'כרטיסי שאלות מנחות', 'יומן קריאה'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      { title: 'תרגול כתיבה מודרך (Guided Writing)', description: 'תרגול כתיבה בקבוצה קטנה עם פיגומים: תבניות משפטים, מארגנים גרפיים, רשימות מילים רלוונטיות ומודלים לחיקוי. התקדמו מכתיבה מבוקרת (controlled) לכתיבה מונחית (guided) ולכתיבה חופשית. סוגי טקסטים: הודעה, מכתב אישי, תיאור, סיפור קצר.', frequency: '2 פעמים בשבוע, 20 דקות', tools: ['תבניות כתיבה', 'מארגנים גרפיים', 'רובריקת כתיבה', 'Google Docs'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      { title: 'תרגול דיבור מובנה (Structured Speaking)', description: 'תרגול שיח בזוגות בקבוצה קטנה: דיאלוגים מובנים עם כרטיסי תפקיד (role-play), משימות תיאור תמונה, ושיחות קצרות על נושאים מוכרים. דגש על שטף ולא על דיוק, עם משוב חיובי ועידוד לקיחת סיכונים לשוניים.', frequency: '2-3 פעמים בשבוע, 15 דקות', tools: ['Role-play cards', 'כרטיסי נושאי שיחה', 'תמונות לתיאור'], udlPrinciple: 'מעורבות', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      { title: 'חיזוק דקדוק ממוקד (Focus on Form)', description: 'קבוצה קטנה לחיזוק מבנים דקדוקיים ספציפיים שנמצאו כקושי: past simple/continuous, comparatives, modals, conditionals. תרגול בהקשר קומוניקטיבי — לא תרגילי מילוי מנותקים אלא משימות שדורשות שימוש במבנה לצורך תקשורת.', frequency: '2 פעמים בשבוע, 15 דקות', tools: ['דפי עבודה ממוקדי מבנה', 'משחקי דקדוק', 'משימות כתיבה ממוקדות'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      { title: 'חונכות עמיתים באנגלית (Peer Tutoring)', description: 'זיווג תלמיד חזק באנגלית עם תלמיד מתקשה. החזק מתרגל עם העמית קריאה, אוצר מילים ושיחה. המורה מכשיר את החונכים מראש: איך לתת משוב חיובי, איך להסביר מילה, איך לנהל שיחה קצרה.', frequency: '2 פעמים בשבוע, 15 דקות', tools: ['כרטיסי הנחיה לחונכים', 'משימות זוגיות מובנות'], udlPrinciple: 'מעורבות', source: 'תוכנית הלימודים באנגלית 2020 - חט"ב', ageGroup: 'חטיבת ביניים' },
      // ========== חטיבת ביניים — CurriculumLD: המלצות לתלמידים עם צרכים מיוחדים ==========
      { title: 'העשרת אוצר מילים לתלמידים עם צרכים מיוחדים — חט"ב', description: 'לפי CurriculumLD: בחטיבת הביניים, התלמיד עם צרכים מיוחדים צריך להרחיב את אוצר המילים מ-Band I ל-Band II תוך התאמות. המלצות: (1) חשפו למילות מפתח הנדרשות להבנת הטקסט לפני הקריאה; (2) אספו מילים מוכרות מהטקסט לפני לימוד חדשות; (3) למדו מילים בהקשר הטקסט המסוים; (4) למדו שימוש במילון: סדר ה-ABC, חלקי דיבור, תחיליות וסיומות ומשמעותן (un-, re-, -ness, -tion); (5) למדו זיהוי סוגי טקסט (סיפור, מכתב, מאמר); (6) תרגלו מילות רצף ומארגנים גרפיים להבנה.', frequency: 'בכל שיעור, שזור בהוראה', tools: ['כרטיסי מילות מפתח', 'מילון L1-L2', 'מארגנים גרפיים', 'word maps'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית לימודים באנגלית - תלמידים עם צרכים מיוחדים', ageGroup: 'חטיבת ביניים' },
      { title: 'הצגת מידע מובנית — תלמידים עם צרכים מיוחדים (חט"ב)', description: 'לפי CurriculumLD — תחום הצגת מידע: (1) בשלב ראשון — סיעור מוחות ומחסן מילים (word bank); (2) למדו בניית פסקה: מיון משפטים לפי רלוונטיות, שימוש במילות רצף (first, then, after, finally), הרכבה לפי מודל; (3) בעבודות מורכבות — לוו את התלמיד בכל השלבים: בחירת נושא, איסוף, ארגון; (4) בדקו: תוכן, דיוק לשוני (אותיות גדולות/קטנות, פיסוק, איות, תחביר); (5) השתמשו במארגנים גרפיים: תרשימי זרימה, טבלאות השוואה; (6) לתלמידים עם דימוי עצמי נמוך — הציעו עזרים (PowerPoint, תמונות, הקלטה), תרגול מול המורה, משוב חיובי; (7) לתלמידים עם קשיי דיבור — שקלו כלי תקשורת חלופיים והתייעצו עם קלינאית תקשורת.', frequency: 'שבועי', tools: ['word bank', 'מארגנים גרפיים', 'תבניות פסקה', 'רובריקת כתיבה', 'PowerPoint'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית לימודים באנגלית - תלמידים עם צרכים מיוחדים', ageGroup: 'חטיבת ביניים' },
      // ========== תיכון (High School) — Band III — ממוקד ==========
      { title: 'קבוצת חיזוק אוצר מילים — Band III Core I', description: 'קבוצה קטנה (5-7 תלמידים) לתרגול ממוקד של מילים מ-Band III Core I (4 יח"ל). פעילויות: התאמה מילה-הגדרה, השלמת משפטים בהקשר, כתיבת פסקאות עם מילים חדשות, תרגול הבחנה Receptive/Productive, ומשחקי מילים דיגיטליים. דגש מיוחד על בני משפחת מילים (word families) — למשל: analyze → analysis, analyst; acquire → acquisition; advance → advanced. חיזוק השימוש בקולוקציות ובביטויים שלמים (formulaic expressions).', frequency: '3 פעמים בשבוע, 20 דקות', tools: ['כרטיסי מילים Band III Core I', 'Quizlet/Kahoot', 'דפי עבודה — word families', 'משחקי התאמה'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - תיכון; Lexical Band III', ageGroup: 'תיכון' },
      { title: 'קבוצת חיזוק אוצר מילים אקדמי — Band III Core II', description: 'קבוצה קטנה (4-6 תלמידים ברמת 5 יח"ל) לתרגול ממוקד של מילות Band III Core II ואוצר מילים אקדמי (AWL/AVL). פעילויות: ניתוח מילים בהקשר אקדמי, כתיבת משפטים עם collocations (למשל: "a sharp rise", "artificial intelligence", "as a result of"), תרגול שימוש ב-discourse markers, ומשחקי מילים ברמה מתקדמת. דגש על מילים הנדרשות לכתיבה אקדמית ולהבנת טקסטים מורכבים.', frequency: '3 פעמים בשבוע, 20 דקות', tools: ['כרטיסי מילים Band III Core II', 'AWL/AVL word lists', 'דפי עבודה אקדמיים', 'Quizlet — academic vocabulary'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - תיכון; Lexical Band III', ageGroup: 'תיכון' },
      { title: 'קבוצת קריאה מונחית ברמת B1-B2', description: 'קבוצה קטנה (4-6 תלמידים) לקריאה מודרכת של טקסטים ברמת B1-B2: מאמרים, טקסטים מדעיים-פופולריים, קטעי ספרות, וטקסטים אקדמיים קצרים. לפני הקריאה — הנגשת אוצר מילים מ-Band III והפעלת ידע קודם; תוך כדי — אסטרטגיות קריאה (inferencing, scanning, skimming); אחרי — דיון, סיכום ומשימת המשך. תרגול שיטתי של פורמט שאלות הבגרות.', frequency: '3 פעמים בשבוע, 25 דקות', tools: ['טקסטים ברמת B1-B2', 'דפי אסטרטגיות קריאה', 'שאלות בפורמט בגרות', 'יומן קריאה'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - תיכון', ageGroup: 'תיכון' },
      { title: 'סדנת כתיבה מובנית — הכנה לבגרות', description: 'קבוצה קטנה (4-6 תלמידים) לתרגול כתיבה ממוקד: כתיבת composition בשלבים — brainstorming, outlining, drafting, editing. תרגול סוגות הכתיבה הנדרשות בבגרות: מכתב רשמי, מאמר דעה, מאמר משכנע. דגש על שימוש ב-discourse markers, פיתוח טיעון, שילוב אוצר מילים מ-Band III, ומשוב ממוקד על היבט אחד בכל טיוטה.', frequency: '2 פעמים בשבוע, 25 דקות', tools: ['תבניות כתיבה לפי סוגה', 'רובריקות כתיבה', 'רשימת discourse markers', 'Google Docs למשוב'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - תיכון', ageGroup: 'תיכון' },
      { title: 'חיזוק דקדוק מתקדם — Focus on Form (B1-B2)', description: 'קבוצה קטנה לחיזוק מבנים דקדוקיים מתקדמים: conditionals (all types), passive voice, reported speech, relative clauses, modals for deduction/speculation. תרגול בהקשר קומוניקטיבי ולא מנותק: כתיבת משפטים בתוך פסקה, תיקון שגיאות בטקסט, ומשימות rewrite בפורמט הבגרות. התאמה לרמת היח"ל — 4 יח"ל: דיוק במבנים בסיסיים; 5 יח"ל: מורכבות ושימוש עצמאי.', frequency: '2 פעמים בשבוע, 20 דקות', tools: ['דפי עבודה ממוקדי מבנה', 'תרגילי rewrite מתוך בגרויות', 'English Grammar Profile'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית הלימודים באנגלית 2020 - תיכון', ageGroup: 'תיכון' },
      { title: 'סדנת ספרות — תמיכה ממוקדת', description: 'קבוצה קטנה לתלמידים המתקשים בהבנת יצירות הספרות: קריאה מודרכת של הטקסט עם עצירות להסבר, שימוש במילון, תמיכה ויזואלית (סרטונים, איורים), תרגום מילות מפתח, ודיון מונחה על דמויות ונושאים. תרגול שיטתי של שאלות ספרות בפורמט הבגרות.', frequency: '2 פעמים בשבוע, 25 דקות', tools: ['גרסאות מותאמות של יצירות', 'סרטוני רקע', 'מילון ספרותי', 'דפי עבודה לניתוח דמויות'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית הלימודים באנגלית 2020 - תיכון', ageGroup: 'תיכון' },
      { title: 'חונכות עמיתים באנגלית — תיכון', description: 'זיווג תלמיד חזק (5 יח"ל) עם תלמיד מתקשה (4 יח"ל או 3 יח"ל). החונך עוזר בתרגול אוצר מילים, קריאה, וכתיבה. הכשרת החונכים: איך לנהל session תרגול, איך להסביר מילה באנגלית (paraphrasing), ואיך לתת משוב בונה. תועלת כפולה — החונך מעמיק את הידע שלו, והמתקשה מקבל תמיכה אישית.', frequency: '2 פעמים בשבוע, 20 דקות', tools: ['כרטיסי הנחיה לחונכים', 'משימות זוגיות מותאמות', 'דפי מעקב'], udlPrinciple: 'מעורבות', source: 'תוכנית הלימודים באנגלית 2020 - תיכון', ageGroup: 'תיכון' },
      // ========== תיכון — CurriculumLD: המלצות לתלמידים עם צרכים מיוחדים ==========
      { title: 'העשרת אוצר מילים לתלמידים עם צרכים מיוחדים — תיכון', description: 'לפי CurriculumLD: בתיכון, תלמידים עם צרכים מיוחדים צריכים לרכוש אוצר מילים מ-Band III תוך התאמות. המלצות: (1) חשפו למילות מפתח מרכזיות לפני קריאת טקסט; (2) אספו מילים מוכרות כעוגנים; (3) למדו מילים בהקשר הטקסט; (4) חזקו שימוש במילון: זיהוי חלקי דיבור, תחיליות וסיומות, ובחירת הפירוש המתאים; (5) למדו זיהוי סוגי טקסט אותנטיים (מאמר, דו"ח, מודעה, סיפור); (6) תרגלו שימוש במארגנים גרפיים להבנת מבנה הטקסט. לתלמידי 3 יח"ל — התמקדו באוצר מילים פונקציונלי ו-Band II; לתלמידי 4-5 יח"ל — Band III Core I/II.', frequency: 'בכל שיעור, שזור בהוראה', tools: ['כרטיסי מילות מפתח Band III', 'מילון L1-L2 / L2-L2', 'מארגנים גרפיים', 'word families'], udlPrinciple: 'ייצוג מרובה', source: 'תוכנית לימודים באנגלית - תלמידים עם צרכים מיוחדים', ageGroup: 'תיכון' },
      { title: 'הצגת מידע וכתיבה — תלמידים עם צרכים מיוחדים (תיכון)', description: 'לפי CurriculumLD — בתיכון, תחום הצגת המידע כולל הכנה לבגרות. המלצות: (1) לעבודות קצרות — בחרו נושאים מעולם התלמיד ומתחומי לימוד מוכרים; (2) לעבודות מורכבות — לוו בכל השלבים כתהליך (process writing); (3) למדו בניית פסקה ורצף טקסט באמצעות מודלים, גזירה והרכבה, ומארגנים גרפיים; (4) בדקו: תוכן, דיוק לשוני (אותיות, פיסוק, איות, תחביר); (5) הציגו עבודות והזמינו קהל (הורים, מורים) — לחיזוק ביטחון; (6) לתלמידים עם דימוי עצמי נמוך — הציעו חוויות הצלחה, תרגול מוקדם, שימוש בעזרים (מצגות, תמונות, הקלטות) ומשוב חיובי ספציפי; (7) שלבו כתיבה בעזרת טכנולוגיה: מחשב, speech-to-text.', frequency: 'שבועי', tools: ['word bank', 'תבניות כתיבה לבגרות', 'מארגנים גרפיים', 'Google Docs', 'כלי speech-to-text'], udlPrinciple: 'פעולה וביטוי', source: 'תוכנית לימודים באנגלית - תלמידים עם צרכים מיוחדים', ageGroup: 'תיכון' },

      { title: 'הוראה פרטנית לתלמיד בשלב Visual Cue', description: 'תלמיד שעדיין בשלב Visual Cue לפי מודל SELA — מזהה מילים לפי צורה ויזואלית בלבד, מכיר אות-שתיים, נעזר בתמונות. התערבות: הוראה מפורשת של אותיות (letters) ו-GPCs בודדים, פעילויות מודעות פונולוגית (PA): חרוזים, זיהוי צלילי פתיחה, פירוק להברות. תרגול מילים חד-הברתיות (CVC: cat, dog, sit) ומילים בסיסיות לא רגילות (the, is, was). כתיבה: trace, match, copy — עיצוב אותיות נכון. התאמות: תמיכה ויזואלית מלאה, שימוש ב-L1, קצב מותאם.', frequency: 'יומי, 20-25 דקות', tools: ['כרטיסי אותיות', 'פעילויות PA', 'מילים CVC', 'דפי trace & copy'], udlPrinciple: 'ייצוג מרובה', source: 'מודל SELA - Russak 2019', ageGroup: 'יסודי' },

function parseCSV(text) {
  const rows = [];
  let currentRow = [];
  let currentField = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const nextChar = text[i + 1];

    if (char === '"' && inQuotes && nextChar === '"') { currentField += '"'; i++; }
    else if (char === '"') { inQuotes = !inQuotes; }
    else if (char === ',' && !inQuotes) { currentRow.push(currentField.trim()); currentField = ''; }
    else if ((char === '\r' || char === '\n') && !inQuotes) {
      if (char === '\r' && nextChar === '\n') i++;
      currentRow.push(currentField.trim());
      if (currentRow.length > 0 && currentRow.some(cell => cell)) rows.push(currentRow);
      currentRow = []; currentField = '';
    } else { currentField += char; }
  }
  if (currentField || currentRow.length > 0) {
    currentRow.push(currentField.trim());
    if (currentRow.some(cell => cell)) rows.push(currentRow);
  }
  return rows;
}

function parseExcel(arrayBuffer) {
  const workbook = XLSX.read(arrayBuffer, { type: 'array' });
  const firstSheetName = workbook.SheetNames[0];
  const worksheet = workbook.Sheets[firstSheetName];
  const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
  return rows.map(row => row.map(cell => cell != null ? String(cell).trim() : ''));
}

function processOgenData(rawRows) {
  if (!rawRows || rawRows.length < 2) return null;
  
  const headerRow = rawRows[0];
  const columnIndices = {};
  
  headerRow.forEach((header, idx) => {
    for (const [pattern, domain] of Object.entries(COLUMN_MAPPINGS)) {
      if (header && header.includes(pattern)) { columnIndices[domain] = idx; break; }
    }
  });
  
  // === זיהוי סוג בית הספר ===
  const headerJoined = headerRow.join(' ');
  if (headerJoined.includes('היבחנות') || headerJoined.includes('בגרות')) {
    appState.schoolType = 'תיכון';
  } else if (columnIndices['שפה_קריאה'] !== undefined && columnIndices['תנועתי'] === undefined) {
    appState.schoolType = 'חטיבת ביניים';
  } else {
    appState.schoolType = 'יסודי';
  }
  
  // === מיזוג עמודות שפה לעל-יסודי ===
  // בעל-יסודי יש 2 עמודות נפרדות (קריאה + כתיבה) - ניקח את הנמוך מביניהם כציון שפה
  if (columnIndices['שפה'] === undefined && columnIndices['שפה_קריאה'] !== undefined) {
    // נסמן שצריך מיזוג - נטפל בזה בלולאת התלמידים
    columnIndices['שפה_merged'] = true;
  }
  
  const students = [];
  let i = 1;
  
  while (i < rawRows.length) {
    const mainRow = rawRows[i];
    if (!mainRow || !mainRow[0]) { i++; continue; }
    
    const studentName = mainRow[0];
    if (!studentName || studentName.includes('תלמידי בי"ס') || studentName.trim() === '') { i++; continue; }
    
    const nextRow = rawRows[i + 1];
    let detailRow = [];
    let skipNext = false;
    
    if (nextRow && (!nextRow[0] || nextRow[0].trim() === '' || nextRow[0].startsWith('-'))) {
      detailRow = nextRow; skipNext = true;
    }
    
    const student = {
      id: 'std-' + (students.length + 1),
      name: studentName,
      scores: {},
      details: {},
      strengths: '',
      specialPopulation: '',
      interventions: {
        // מענים לימודיים קבוצתיים - לפי תחום
        learningGroupedLanguage: false,
        learningGroupedMath: false,
        learningGroupedEnglish: false,
        learningGroupedOther: false,
        // מענים לימודיים אינטנסיביים - לפי תחום
        learningIntensiveLanguage: false,
        learningIntensiveMath: false,
        learningIntensiveEnglish: false,
        // מענים רגשיים/התנהגותיים/חברתיים
        emotionalGrouped: false,
        emotionalIntensive: false,
        
        // === מענים אוניברסליים לימודיים ===
        learningUniversal: {
          evaluationAdaptations: false,      // התאמות כלליות בדרכי הערכה
          environmentAdaptations: false,     // התאמות בסביבת הלמידה
          excellencePrograms: false,         // תוכניות לקידום מצוינות והצטיינות
          studentshipPrograms: false,        // תוכניות לקידום תלמידאות
          other: false                       // אחר
        },
        
        // === מענים אוניברסליים רגשיים ===
        emotionalUniversal: {
          generalAdaptations: false,         // התאמות כלליות בסביבת הלמידה
          climatePrograms: false,            // תוכניות לקידום אקלים וכישורים חברתיים
          executiveFunctions: false          // תוכניות לקידום מיומנויות ניהול וקשב
        },
        
        // === מענים ממוקדים רגשיים ===
        emotionalTargeted: {
          teacherSupport: false,             // תמיכה על ידי מחנך/ת
          professionalSupport: false,        // תמיכה על ידי גורמים מקצועיים
          other: false                       // אחר
        },
        
        // === מענים אינטנסיביים רגשיים ===
        emotionalIntensiveDetails: {
          counselorMeetings: false,          // פגישות פרטניות עם יועצ/ת או פסיכולוגית
          artTherapy: false,                 // טיפול באומנויות
          behaviorIntervention: false,       // התערבות של מנתח/ת התנהגות
          socialSkills: false,               // טיפול במיומנויות חברתיות
          parentGuidance: false,             // הדרכת הורים
          externalServices: false            // מענים חוץ בית ספריים
        }
      },
      // פירוט טקסטואלי של מענים
      interventionDetails: []
    };
    
    const scoreDomains = ['שפה', 'מתמטיקה', 'אנגלית', 'מוטיבציה', 'רגשי', 'התנהגותי', 'חברתי', 'קשב', 'תנועתי'];
    
    for (const domain of scoreDomains) {
      const idx = columnIndices[domain];
      if (idx !== undefined && mainRow[idx]) {
        const value = mainRow[idx];
        if (['מתקדם', 'תקין', 'מתקשה', 'מתקשה מאד', 'מתקשה מאוד'].includes(value)) {
          const normalizedScore = value === 'מתקשה מאוד' ? 'מתקשה מאד' : value;
          student.scores[domain] = normalizedScore;
          if ((normalizedScore === 'מתקשה' || normalizedScore === 'מתקשה מאד') && detailRow[idx]) {
            student.details[domain] = detailRow[idx];
          }
        }
      }
    }
    
    // === מיזוג שפה לעל-יסודי: קריאה + כתיבה + עברית לדוברי ערבית → שפה ===
    if (columnIndices['שפה_merged'] && !student.scores['שפה']) {
      const scoreOrder = { 'מתקשה מאד': 0, 'מתקשה': 1, 'תקין': 2, 'מתקדם': 3 };
      const readIdx = columnIndices['שפה_קריאה'];
      const writeIdx = columnIndices['שפה_כתיבה'];
      const hebArabicIdx = columnIndices['עברית_לדוברי_ערבית'];
      const readVal = readIdx !== undefined ? mainRow[readIdx] : '';
      const writeVal = writeIdx !== undefined ? mainRow[writeIdx] : '';
      const hebArabicVal = hebArabicIdx !== undefined ? mainRow[hebArabicIdx] : '';
      const readNorm = readVal === 'מתקשה מאוד' ? 'מתקשה מאד' : readVal;
      const writeNorm = writeVal === 'מתקשה מאוד' ? 'מתקשה מאד' : writeVal;
      const hebArabicNorm = hebArabicVal === 'מתקשה מאוד' ? 'מתקשה מאד' : hebArabicVal;
      
      // אסוף את כל הציונים התקפים
      const allScores = [readNorm, writeNorm, hebArabicNorm].filter(v => scoreOrder[v] !== undefined);
      
      if (allScores.length > 0) {
        // לוקחים את הציון הנמוך יותר (האתגר הגדול יותר)
        student.scores['שפה'] = allScores.reduce((worst, curr) => 
          scoreOrder[curr] < scoreOrder[worst] ? curr : worst
        );
        
        // שמירת פרטים נפרדים
        let details = [];
        if (readNorm === 'מתקשה' || readNorm === 'מתקשה מאד') {
          let d = 'קריאה והבנת הנקרא: ' + readNorm;
          if (detailRow[readIdx]) d += ' - ' + detailRow[readIdx];
          details.push(d);
        }
        if (writeNorm === 'מתקשה' || writeNorm === 'מתקשה מאד') {
          let d = 'כתיבה והבעה: ' + writeNorm;
          if (detailRow[writeIdx]) d += ' - ' + detailRow[writeIdx];
          details.push(d);
        }
        if (hebArabicNorm === 'מתקשה' || hebArabicNorm === 'מתקשה מאד') {
          let d = 'עברית כשפה שנייה: ' + hebArabicNorm;
          if (hebArabicIdx !== undefined && detailRow[hebArabicIdx]) d += ' - ' + detailRow[hebArabicIdx];
          details.push(d);
        }
        if (details.length > 0) student.details['שפה'] = details.join('; ');
        
        // שמירת ציונים נפרדים
        if (scoreOrder[readNorm] !== undefined) student.scores['שפה_קריאה'] = readNorm;
        if (scoreOrder[writeNorm] !== undefined) student.scores['שפה_כתיבה'] = writeNorm;
        if (scoreOrder[hebArabicNorm] !== undefined) student.scores['עברית_לדוברי_ערבית'] = hebArabicNorm;
      }
    }
    
    // === עברית לדוברי ערבית (יסודי - אם לא טופל במיזוג) ===
    if (!columnIndices['שפה_merged']) {
      const hebrewForArabicIdx = columnIndices['עברית_לדוברי_ערבית'];
      if (hebrewForArabicIdx !== undefined && mainRow[hebrewForArabicIdx]) {
        const val = mainRow[hebrewForArabicIdx];
        if (['מתקדם', 'תקין', 'מתקשה', 'מתקשה מאד', 'מתקשה מאוד'].includes(val)) {
          student.scores['עברית_לדוברי_ערבית'] = val === 'מתקשה מאוד' ? 'מתקשה מאד' : val;
        }
      }
    }
    
    // === עמידה בהיבחנות (תיכון) ===
    const examIdx = columnIndices['היבחנות'];
    if (examIdx !== undefined && mainRow[examIdx]) {
      const val = mainRow[examIdx];
      if (['מתקדם', 'תקין', 'מתקשה', 'מתקשה מאד', 'מתקשה מאוד'].includes(val)) {
        student.scores['היבחנות'] = val === 'מתקשה מאוד' ? 'מתקשה מאד' : val;
      }
    }
    
    // === בדיקת מענים לימודיים אוניברסליים - מעמודת "מענים לימודיים לכלל הכיתה" ===
    const learningUniversalIdx = columnIndices['מעניםלימודייםאוניברסלי'];
    if (learningUniversalIdx !== undefined && mainRow[learningUniversalIdx] === 'כן') {
      const detail = (detailRow[learningUniversalIdx] || '').toLowerCase();
      if (detail.includes('התאמות') && detail.includes('הערכה')) {
        student.interventions.learningUniversal.evaluationAdaptations = true;
        student.interventionDetails.push({ type: 'learningUniversal', name: 'התאמות בדרכי הערכה', detail: detailRow[learningUniversalIdx] });
      }
      if (detail.includes('התאמות') && detail.includes('סביבת')) {
        student.interventions.learningUniversal.environmentAdaptations = true;
        student.interventionDetails.push({ type: 'learningUniversal', name: 'התאמות בסביבת הלמידה', detail: detailRow[learningUniversalIdx] });
      }
      if (detail.includes('מצוינות') || detail.includes('הצטיינות')) {
        student.interventions.learningUniversal.excellencePrograms = true;
        student.interventionDetails.push({ type: 'learningUniversal', name: 'תוכניות לקידום מצוינות', detail: detailRow[learningUniversalIdx] });
      }
      if (detail.includes('תלמידאות')) {
        student.interventions.learningUniversal.studentshipPrograms = true;
        student.interventionDetails.push({ type: 'learningUniversal', name: 'תוכניות לקידום תלמידאות', detail: detailRow[learningUniversalIdx] });
      }
      // אם לא זוהה מענה ספציפי אבל סומן "כן" - סמן כ"אחר"
      const hasAnyUniversal = student.interventions.learningUniversal.evaluationAdaptations ||
        student.interventions.learningUniversal.environmentAdaptations ||
        student.interventions.learningUniversal.excellencePrograms ||
        student.interventions.learningUniversal.studentshipPrograms;
      if (!hasAnyUniversal) {
        student.interventions.learningUniversal.other = true;
        student.interventionDetails.push({ type: 'learningUniversal', name: 'מענה אוניברסלי לימודי', detail: detailRow[learningUniversalIdx] || 'סומן כי יש מענים לימודיים לכלל הכיתה' });
      }
    }
    
    // בדיקת מענים לימודיים קבוצתיים - קריאת הפירוט
    const learningGroupedIdx = columnIndices['מעניםלימודייםקבוצתי'];
    if (learningGroupedIdx !== undefined && mainRow[learningGroupedIdx] === 'כן' && detailRow[learningGroupedIdx]) {
      const detail = detailRow[learningGroupedIdx];
      if (detail.includes('שפה')) student.interventions.learningGroupedLanguage = true;
      if (detail.includes('מתמטיקה')) student.interventions.learningGroupedMath = true;
      if (detail.includes('אנגלית')) student.interventions.learningGroupedEnglish = true;
      if (detail.includes('תחום דעת אחר')) student.interventions.learningGroupedOther = true;
    }
    
    // בדיקת מענים לימודיים אינטנסיביים - קריאת הפירוט
    const learningIntensiveIdx = columnIndices['מעניםלימודייםאינטנסיבי'];
    if (learningIntensiveIdx !== undefined && mainRow[learningIntensiveIdx] === 'כן' && detailRow[learningIntensiveIdx]) {
      const detail = detailRow[learningIntensiveIdx];
      if (detail.includes('שפה')) student.interventions.learningIntensiveLanguage = true;
      if (detail.includes('מתמטיקה')) student.interventions.learningIntensiveMath = true;
      if (detail.includes('אנגלית')) student.interventions.learningIntensiveEnglish = true;
    }
    
    // === fallback לעל-יסודי: "האם יש מענים לימודיים?" = כן, אבל רובדים לא פורטו ===
    // מזהים לפי עמודת שאלת-על "האם יש מענים לימודיים?"
    const hasLearningInterventionsIdx = headerRow.findIndex(h => h && h.includes('האם יש מענים לימודיים'));
    if (hasLearningInterventionsIdx !== -1 && mainRow[hasLearningInterventionsIdx] === 'כן') {
      // בדוק אם כבר זוהו מענים ברובדים
      const hasAnyLearning = student.interventions.learningGroupedLanguage || student.interventions.learningGroupedMath || 
        student.interventions.learningGroupedEnglish || student.interventions.learningIntensiveLanguage || 
        student.interventions.learningIntensiveMath || student.interventions.learningIntensiveEnglish;
      
      if (!hasAnyLearning) {
        // שייך לרובד ממוקד (קבוצתי) לפי תחומי הקושי של התלמיד
        const difficultDomains = [];
        if (student.scores['שפה'] === 'מתקשה' || student.scores['שפה'] === 'מתקשה מאד') difficultDomains.push('שפה');
        if (student.scores['מתמטיקה'] === 'מתקשה' || student.scores['מתמטיקה'] === 'מתקשה מאד') difficultDomains.push('מתמטיקה');
        if (student.scores['אנגלית'] === 'מתקשה' || student.scores['אנגלית'] === 'מתקשה מאד') difficultDomains.push('אנגלית');
        
        if (difficultDomains.length > 0) {
          // שייך לרובד ממוקד אם מתקשה, או אינטנסיבי אם מתקשה מאד
          difficultDomains.forEach(d => {
            const isIntensive = student.scores[d] === 'מתקשה מאד';
            if (d === 'שפה') {
              if (isIntensive) student.interventions.learningIntensiveLanguage = true;
              else student.interventions.learningGroupedLanguage = true;
            }
            if (d === 'מתמטיקה') {
              if (isIntensive) student.interventions.learningIntensiveMath = true;
              else student.interventions.learningGroupedMath = true;
            }
            if (d === 'אנגלית') {
              if (isIntensive) student.interventions.learningIntensiveEnglish = true;
              else student.interventions.learningGroupedEnglish = true;
            }
          });
          student.interventionDetails.push({ type: 'learningInferred', name: 'מענה לימודי (זוהה מנתוני העוגן)', detail: 'מענה לימודי בתחומים: ' + difficultDomains.join(', ') });
        } else {
          // אם אין קשיים ספציפיים אבל סומן שיש מענים - סמן כמענה כללי
          student.interventions.learningGroupedOther = true;
          student.interventionDetails.push({ type: 'learningInferred', name: 'מענה לימודי (זוהה מנתוני העוגן)', detail: 'סומן כי יש מענים לימודיים' });
        }
      }
    }
    
    // === fallback לעל-יסודי: "האם יש מענים רגשיים?" = כן, אבל רובדים לא פורטו ===
    const hasEmotionalInterventionsIdx = headerRow.findIndex(h => h && h.includes('האם יש מענים רגשיים'));
    if (hasEmotionalInterventionsIdx !== -1 && mainRow[hasEmotionalInterventionsIdx] === 'כן') {
      if (!student.interventions.emotionalGrouped && !student.interventions.emotionalIntensive) {
        student.interventions.emotionalGrouped = true;
        student.interventionDetails.push({ type: 'emotionalInferred', name: 'מענה רגשי/חברתי (זוהה מנתוני העוגן)', detail: 'סומן כי יש מענים רגשיים' });
      }
    }
    
    // בדיקת מענים רגשיים/התנהגותיים/חברתיים
    const emotionalGroupedIdx = columnIndices['מעניםרגשייםקבוצתי'];
    if (emotionalGroupedIdx !== undefined && mainRow[emotionalGroupedIdx] === 'כן') {
      student.interventions.emotionalGrouped = true;
    }
    
    const emotionalIntensiveIdx = columnIndices['מעניםרגשייםאינטנסיבי'];
    if (emotionalIntensiveIdx !== undefined && mainRow[emotionalIntensiveIdx] === 'כן') {
      student.interventions.emotionalIntensive = true;
    }
    
    const strengthsIdx = columnIndices['חוזקות'];
    if (strengthsIdx !== undefined) {
      const sVal = mainRow[strengthsIdx];
      if (sVal === 'כן' && detailRow[strengthsIdx]) {
        // פורמט יסודי: "כן" בשורה ראשית, פירוט בשורה שנייה
        student.strengths = detailRow[strengthsIdx];
      } else if (sVal === 'כן' || sVal === 'לא ידוע') {
        // בעל-יסודי, לפעמים הפירוט בשורת הפירוט
        if (detailRow[strengthsIdx]) student.strengths = detailRow[strengthsIdx];
      }
    }
    
    const popIdx = columnIndices['אוכלוסיה'];
    if (popIdx !== undefined) {
      const pVal = mainRow[popIdx];
      if (pVal === 'כן' && detailRow[popIdx]) {
        student.specialPopulation = detailRow[popIdx];
      } else if (pVal === 'כן' || pVal === 'לא ידוע') {
        if (detailRow[popIdx]) student.specialPopulation = detailRow[popIdx];
      }
    }
    
    // === משפחה ===
    const familyIdx = columnIndices['משפחה'];
    if (familyIdx !== undefined) {
      const fVal = mainRow[familyIdx];
      if (fVal === 'כן' && detailRow[familyIdx]) {
        student.familyNotes = detailRow[familyIdx];
      }
    }
    
    // === סריקת כל העמודות לזיהוי מענים מפורטים ===
    for (let colIdx = 0; colIdx < mainRow.length; colIdx++) {
      const cellValue = mainRow[colIdx];
      if (cellValue !== 'כן') continue;
      
      // דילוג על עמודה שכבר טופלה ישירות
      if (colIdx === learningUniversalIdx) continue;
      
      const detailValue = detailRow[colIdx] || '';
      const headerValue = (headerRow[colIdx] || '').toLowerCase();
      const combinedText = (headerValue + ' ' + detailValue).toLowerCase();
      
      // פיצול פירוט לפי מקפים ושורות חדשות
      const detailParts = detailValue.split(/[-\n]/).map(p => p.trim()).filter(p => p);
      
      // === מענים אוניברסליים לימודיים ===
      if (combinedText.includes('התאמות') && combinedText.includes('הערכה')) {
        student.interventions.learningUniversal.evaluationAdaptations = true;
        student.interventionDetails.push({ type: 'learningUniversal', name: 'התאמות בדרכי הערכה', detail: detailValue });
      }
      if (combinedText.includes('התאמות') && combinedText.includes('סביבת')) {
        student.interventions.learningUniversal.environmentAdaptations = true;
        student.interventionDetails.push({ type: 'learningUniversal', name: 'התאמות בסביבת הלמידה', detail: detailValue });
      }
      if (combinedText.includes('מצוינות') || combinedText.includes('הצטיינות')) {
        student.interventions.learningUniversal.excellencePrograms = true;
        student.interventionDetails.push({ type: 'learningUniversal', name: 'תוכניות לקידום מצוינות', detail: detailValue });
      }
      if (combinedText.includes('תלמידאות')) {
        student.interventions.learningUniversal.studentshipPrograms = true;
        student.interventionDetails.push({ type: 'learningUniversal', name: 'תוכניות לקידום תלמידאות', detail: detailValue });
      }
      
      // === מענים אוניברסליים רגשיים ===
      if (combinedText.includes('התאמות') && (combinedText.includes('רגשי') || combinedText.includes('התנהגות') || combinedText.includes('חברתי'))) {
        student.interventions.emotionalUniversal.generalAdaptations = true;
        student.interventionDetails.push({ type: 'emotionalUniversal', name: 'התאמות להיבטים רגשיים/התנהגותיים', detail: detailValue });
      }
      if (combinedText.includes('אקלים') || (combinedText.includes('כישורים חברתיים') && combinedText.includes('כיתתי'))) {
        student.interventions.emotionalUniversal.climatePrograms = true;
        student.interventionDetails.push({ type: 'emotionalUniversal', name: 'תוכניות לקידום אקלים וכישורים חברתיים', detail: detailValue });
      }
      if (combinedText.includes('תפקודים ניהוליים') || (combinedText.includes('ניהול') && combinedText.includes('קשב'))) {
        student.interventions.emotionalUniversal.executiveFunctions = true;
        student.interventionDetails.push({ type: 'emotionalUniversal', name: 'תוכניות לקידום מיומנויות ניהול וקשב', detail: detailValue });
      }
      
      // === מענים ממוקדים רגשיים ===
      if (combinedText.includes('מחנך') && combinedText.includes('שיחות')) {
        student.interventions.emotionalTargeted.teacherSupport = true;
        student.interventionDetails.push({ type: 'emotionalTargeted', name: 'תמיכה על ידי מחנך/ת', detail: detailValue });
      }
      if (combinedText.includes('גורמים מקצועיים') || (combinedText.includes('תמיכה') && combinedText.includes('מקצועי'))) {
        student.interventions.emotionalTargeted.professionalSupport = true;
        student.interventionDetails.push({ type: 'emotionalTargeted', name: 'תמיכה על ידי גורמים מקצועיים', detail: detailValue });
      }
      
      // === מענים אינטנסיביים רגשיים ===
      if (combinedText.includes('יועצ') || combinedText.includes('פסיכולוג')) {
        student.interventions.emotionalIntensiveDetails.counselorMeetings = true;
        student.interventionDetails.push({ type: 'emotionalIntensive', name: 'פגישות עם יועצ/ת או פסיכולוגית', detail: detailValue });
      }
      if (combinedText.includes('טיפול באומנ') || combinedText.includes('תנועה') || combinedText.includes('מוזיקה') || combinedText.includes('אומנות פלסטית')) {
        student.interventions.emotionalIntensiveDetails.artTherapy = true;
        student.interventionDetails.push({ type: 'emotionalIntensive', name: 'טיפול באומנויות', detail: detailValue });
      }
      if (combinedText.includes('מנתח התנהגות') || combinedText.includes('תוכנית התנהגותית')) {
        student.interventions.emotionalIntensiveDetails.behaviorIntervention = true;
        student.interventionDetails.push({ type: 'emotionalIntensive', name: 'התערבות התנהגותית', detail: detailValue });
      }
      if (combinedText.includes('מיומנויות חברתיות') && !combinedText.includes('כיתתי')) {
        student.interventions.emotionalIntensiveDetails.socialSkills = true;
        student.interventionDetails.push({ type: 'emotionalIntensive', name: 'טיפול במיומנויות חברתיות', detail: detailValue });
      }
      if (combinedText.includes('הדרכת הורים')) {
        student.interventions.emotionalIntensiveDetails.parentGuidance = true;
        student.interventionDetails.push({ type: 'emotionalIntensive', name: 'הדרכת הורים', detail: detailValue });
      }
      if (combinedText.includes('חוץ בית ספרי') || combinedText.includes('חוץ ביה"ס') || combinedText.includes('מענים חוץ')) {
        student.interventions.emotionalIntensiveDetails.externalServices = true;
        student.interventionDetails.push({ type: 'emotionalIntensive', name: 'מענים חוץ בית ספריים', detail: detailValue });
      }
      
      // בדיקה לפירוט משולב - פיצול מענים
      detailParts.forEach(part => {
        const partLower = part.toLowerCase();
        if (partLower.includes('מענה מותאם פרט') && partLower.includes('מתמטיקה')) {
          student.interventions.learningIntensiveMath = true;
        }
        if (partLower.includes('מענה מותאם פרט') && partLower.includes('שפה')) {
          student.interventions.learningIntensiveLanguage = true;
        }
        if (partLower.includes('מענה מותאם פרט') && partLower.includes('אנגלית')) {
          student.interventions.learningIntensiveEnglish = true;
        }
        if (partLower.includes('חוץ בית ספרי') || partLower.includes('מענים חוץ')) {
          student.interventions.emotionalIntensiveDetails.externalServices = true;
          if (!student.interventionDetails.find(d => d.name === 'מענים חוץ בית ספריים')) {
            student.interventionDetails.push({ type: 'emotionalIntensive', name: 'מענים חוץ בית ספריים', detail: part });
          }
        }
      });
    }
    
    if (Object.keys(student.scores).length > 0) students.push(student);
    i += skipNext ? 2 : 1;
  }
  
  return students.length > 0 ? students : null;
}

  "שאלות הנחיה להוראת עברית כשפה שנייה": "أسئلة توجيهية لتدريس العبرية كلغة ثانية",

  "פרופיל אורייני": "الملف القرائي",
  "למדי אסטרטגיות קריאה באופן מפורש: שיום האסטרטגיה, הסבר מטרתה, הדגמה, ותרגול מודרך.": "علِّمي استراتيجيات القراءة بشكل صريح: تسمية الاستراتيجية، شرح هدفها، النمذجة، والتدريب الموجَّه.",
  "ניהול כל שיעור שפה בשלושה שלבים: (1) כרטיס כניסה - הפעלת ידע קודם, הנגשה לשונית, עוררות סקרנות. (2) עיקר השיעור. (3) כרטיס יציאה - מה למדתי?": "إدارة كل درس لغوي بثلاث مراحل: (1) بطاقة الدخول - تنشيط المعرفة السابقة، الإتاحة اللغوية، إثارة الفضول. (2) صلب الدرس. (3) بطاقة الخروج - ماذا تعلمت؟",
  "קריאה קולית שיתופית של ספרי ילדים ונוער עם שיח דיאלוגי. הפרקטיקה מקדמת הבנת הסיפור, מרחיבה אוצר מילים ומפתחת חשיבה ביקורתית.": "قراءة جهرية تشاركية لكتب الأطفال والشباب مع حوار نقاشي. تُعزِّز الممارسة فهم القصة، وتوسِّع الثروة اللغوية، وتنمِّي التفكير الناقد.",
  "עודדי קריאה בדרכים מגוונות: הקראה קולית, קריאה עצמית, קריאת עמיתים. צרי הזדמנויות תדירות לקריאה בכמות גדולה של טקסטים מגוונים.": "شجِّعي القراءة بأساليب متنوعة: القراءة الجهرية، القراءة الذاتية، قراءة الأقران. أوجِدي فرصًا متكررة للقراءة بكميات كبيرة من نصوص متنوعة.",
  "שלבי כלי AI לתכנון שיעורים במודל \"מטקסט לשיעור\" (פרומפטים מובנים), להקראה קולית של טקסטים ולמשוב שוטף על הקריאה.": "ادمجي أدوات الذكاء الاصطناعي في تخطيط الدروس بنموذج 'من النص إلى الدرس' (بروميتات منظَّمة)، للقراءة الجهرية وللتغذية الراجعة المستمرة.",
  "משוב ספציפי על הקריאה: \"קראת מדויק X מתוך Y מילים\", \"שמת לב לנקודות בסוף משפט\".": "تغذية راجعة محددة على القراءة: 'قرأت بدقة X من Y كلمة'، 'انتبهت للنقاط في نهاية الجملة'.",
  "הוראה מובנית בקבוצה קטנה לפי מודל \"איתי ולידי\": הוראה מונחית עם המורה + למידה עצמאית/עמיתים.": "تدريس منظَّم في مجموعة صغيرة وفق نموذج 'معي وبجانبي': تدريس موجَّه مع المعلمة + تعلم ذاتي/أقران.",
  "תוכניות ייעודיות לכיתות ב-ו לקידום שטף קריאה: מבדקי שטף, תלקיט טקסטים מסוגים שונים, פעילויות ממוקדות.": "برامج مخصصة للصفوف ב-و لتعزيز طلاقة القراءة: اختبارات الطلاقة، ملف نصوص متنوعة، أنشطة مُركَّزة.",
  "משוב מותאם בשפה פשוטה עם תמיכה ויזואלית, דגש על התקדמות אישית.": "تغذية راجعة مُكيَّفة بلغة بسيطة مع دعم بصري، مع التركيز على التقدم الشخصي.",
  "תוכנית מערכתית לכיתה א לרכישת קריאה וכתיבה עם כלל התלמידים. שלוש זירות משלימות: (1) יישום בכיתה, (2) מענה ממוקד, (3) מענה אינטנסיבי.": "برنامج منهجي للصف الأول لاكتساب القراءة والكتابة مع جميع الطلاب. ثلاثة مجالات تكاملية: (1) التطبيق في الصف، (2) استجابة مُركَّزة، (3) استجابة مكثفة.",
  "הוראה לפי מסמך \"שפת הבית ושפת בית הספר\": הנגשה לשונית, תמיכה ויזואלית, בניית ידע עולם, גישה רב-ממדית.": "تدريس وفق وثيقة 'لغة البيت ولغة المدرسة': إتاحة لغوية، دعم بصري، بناء معرفة العالم، نهج متعدد الأبعاد.",
  "עודדי שיח מתמטי: תלמידים מסבירים את דרך הפתרון שלהם בקול, משווים בין דרכי פתרון שונות, ומנסחים השערות.": "شجِّعي الخطاب الرياضي: الطلاب يشرحون طريقة حلهم بصوت عالٍ، يقارنون بين أساليب حل مختلفة، ويصيغون فرضيات.",
  "שלבי משימות אורייניות כחלק אינטגרלי מההוראה השוטפת: שאלות מילוליות בהקשרים מהעולם האמיתי, ניסוח וביסוס תשובות.": "ادمجي المهام القرائية كجزء لا يتجزأ من التدريس المستمر: أسئلة شفهية في سياقات من العالم الحقيقي، صياغة الإجابات وتعليلها.",
  "שימוש במתמטיקה כדי להבין, לייצג ולפרש מצבים מהעולם האמיתי.": "استخدام الرياضيات لفهم مواقف من العالم الحقيقي وتمثيلها وتفسيرها.",
  "הפנו תלמידים מתקשים לסרטוני הסבר ותרגול בקמפוס הדיגיטלי של הפיקוח על המתמטיקה.": "وجِّهي الطلاب المتعثرين إلى مقاطع الشرح والتدريب في المنصة الرقمية لمشرفية الرياضيات.",
  "לפי CurriculumLD — תחום הצגת מידע: (1) נווגו בין סוגי הצגה שונים: קצרים (תיאור, חיבור) וארוכים (מאמר דעה, עיון).": "وفق CurriculumLD — مجال عرض المعلومات: (1) تنقّلوا بين أنواع العرض المختلفة: قصيرة (وصف، ربط) وطويلة (مقال رأي، بحث).",
  "למדו מבני שפה דרך חשיפה לטקסטים אותנטיים ולא דרך כללים מופשטים.": "تعلَّموا تراكيب اللغة من خلال التعرض لنصوص أصيلة وليس عبر قواعد مجردة.",
  "שלבו הערכה מעצבת ומסכמת: משוב שוטף על ביצועי שפה, הערכה עצמית ועמיתים.": "ادمجوا التقييم التكويني والختامي: تغذية راجعة مستمرة على الأداء اللغوي، والتقييم الذاتي وتقييم الأقران.",
  "למדו 10-12 מילים חדשות בשבוע מתוך Band III.": "تعلَّموا 10-12 كلمة جديدة أسبوعيًا من Band III.",
  "חשפו את התלמידים לטקסטים אותנטיים מגוונים ברמת B1-B2.": "عرِّضوا الطلاب لنصوص أصيلة متنوعة بمستوى B1-B2.",
