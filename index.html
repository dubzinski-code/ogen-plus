function parseCSV(text) {
  const rows = [];
  let currentRow = [];
  let currentField = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const nextChar = text[i + 1];

    if (char === '"' && inQuotes && nextChar === '"') { currentField += '"'; i++; }
    else if (char === '"') { inQuotes = !inQuotes; }
    else if (char === ',' && !inQuotes) { currentRow.push(currentField.trim()); currentField = ''; }
    else if ((char === '\r' || char === '\n') && !inQuotes) {
      if (char === '\r' && nextChar === '\n') i++;
      currentRow.push(currentField.trim());
      if (currentRow.length > 0 && currentRow.some(cell => cell)) rows.push(currentRow);
      currentRow = []; currentField = '';
    } else { currentField += char; }
  }
  if (currentField || currentRow.length > 0) {
    currentRow.push(currentField.trim());
    if (currentRow.some(cell => cell)) rows.push(currentRow);
  }
  return rows;
}

function parseExcel(arrayBuffer) {
  const workbook = XLSX.read(arrayBuffer, { type: 'array' });
  const firstSheetName = workbook.SheetNames[0];
  const worksheet = workbook.Sheets[firstSheetName];
  const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
  return rows.map(row => row.map(cell => cell != null ? String(cell).trim() : ''));
}

function processOgenData(rawRows) {
  if (!rawRows || rawRows.length < 2) return null;

      if (header && header.includes(pattern)) { columnIndices[domain] = idx; break; }
    }
  });
  
  const students = [];

      student.strengths = detailRow[strengthsIdx];
    }
    
    // היבטים אישיים ומשפחתיים
    const familyIdx = columnIndices['משפחה'];
    if (familyIdx !== undefined && mainRow[familyIdx] === 'כן' && detailRow[familyIdx]) {
      student.familyDetails = detailRow[familyIdx];
    }
    
    const popIdx = columnIndices['אוכלוסיה'];
    if (popIdx !== undefined && mainRow[popIdx] === 'כן' && detailRow[popIdx]) {
      student.specialPopulation = detailRow[popIdx];
    }
    
    // מענים ייחודיים לאוכלוסיות מיוחדות
    const specialInterventionsIdx = columnIndices['מעניםייחודיים'];
    if (specialInterventionsIdx !== undefined && mainRow[specialInterventionsIdx] === 'כן' && detailRow[specialInterventionsIdx]) {
      student.specialInterventions = detailRow[specialInterventionsIdx];
    }
    
    // === סריקת כל העמודות לזיהוי מענים מפורטים ===
    for (let colIdx = 0; colIdx < mainRow.length; colIdx++) {
      const cellValue = mainRow[colIdx];
      if (cellValue !== 'כן') continue;
      
      const detailValue = detailRow[colIdx] || '';
      const headerValue = (headerRow[colIdx] || '').toLowerCase();
      const combinedText = (headerValue + ' ' + detailValue).toLowerCase();
      
      // פיצול פירוט לפי מקפים ושורות חדשות
      const detailParts = detailValue.split(/[-\n]/).map(p => p.trim()).filter(p => p);
      
      // === מענים אוניברסליים לימודיים ===
      if (combinedText.includes('התאמות') && combinedText.includes('הערכה')) {
        student.interventions.learningUniversal.evaluationAdaptations = true;
        student.interventionDetails.push({ type: 'learningUniversal', name: 'התאמות בדרכי הערכה', detail: detailValue });
      }
      if (combinedText.includes('התאמות') && combinedText.includes('סביבת')) {
        student.interventions.learningUniversal.environmentAdaptations = true;
        student.interventionDetails.push({ type: 'learningUniversal', name: 'התאמות בסביבת הלמידה', detail: detailValue });
      }
      if (combinedText.includes('מצוינות') || combinedText.includes('הצטיינות')) {
        student.interventions.learningUniversal.excellencePrograms = true;
        student.interventionDetails.push({ type: 'learningUniversal', name: 'תוכניות לקידום מצוינות', detail: detailValue });
      }
      if (combinedText.includes('תלמידאות')) {
        student.interventions.learningUniversal.studentshipPrograms = true;
        student.interventionDetails.push({ type: 'learningUniversal', name: 'תוכניות לקידום תלמידאות', detail: detailValue });
      }
      
      // === מענים אוניברסליים רגשיים ===
      if (combinedText.includes('התאמות') && (combinedText.includes('רגשי') || combinedText.includes('התנהגות') || combinedText.includes('חברתי'))) {
        student.interventions.emotionalUniversal.generalAdaptations = true;
        student.interventionDetails.push({ type: 'emotionalUniversal', name: 'התאמות להיבטים רגשיים/התנהגותיים', detail: detailValue });
      }
      if (combinedText.includes('אקלים') || (combinedText.includes('כישורים חברתיים') && combinedText.includes('כיתתי'))) {
        student.interventions.emotionalUniversal.climatePrograms = true;
        student.interventionDetails.push({ type: 'emotionalUniversal', name: 'תוכניות לקידום אקלים וכישורים חברתיים', detail: detailValue });
      }
      if (combinedText.includes('תפקודים ניהוליים') || combinedText.includes('מיומנויות ניהול') || (combinedText.includes('ניהול') && combinedText.includes('קשב'))) {
        student.interventions.emotionalUniversal.executiveFunctions = true;
        student.interventionDetails.push({ type: 'emotionalUniversal', name: 'תוכניות לקידום מיומנויות ניהול וקשב', detail: detailValue });
      }
      
      // === מענים ממוקדים רגשיים ===
      if (combinedText.includes('מחנך') && combinedText.includes('שיחות')) {
        student.interventions.emotionalTargeted.teacherSupport = true;
        student.interventionDetails.push({ type: 'emotionalTargeted', name: 'תמיכה על ידי מחנך/ת', detail: detailValue });
      }
      if (combinedText.includes('גורמים מקצועיים') || (combinedText.includes('תמיכה') && combinedText.includes('מקצועי'))) {
        student.interventions.emotionalTargeted.professionalSupport = true;
        student.interventionDetails.push({ type: 'emotionalTargeted', name: 'תמיכה על ידי גורמים מקצועיים', detail: detailValue });
      }
      
      // === מענים אינטנסיביים רגשיים ===
      if (combinedText.includes('יועצ') || combinedText.includes('פסיכולוג')) {
        student.interventions.emotionalIntensiveDetails.counselorMeetings = true;
        student.interventionDetails.push({ type: 'emotionalIntensive', name: 'פגישות עם יועצ/ת או פסיכולוגית', detail: detailValue });
      }
      if (combinedText.includes('טיפול באומנ') || combinedText.includes('תנועה') || combinedText.includes('מוזיקה') || combinedText.includes('אומנות פלסטית')) {
        student.interventions.emotionalIntensiveDetails.artTherapy = true;
        student.interventionDetails.push({ type: 'emotionalIntensive', name: 'טיפול באומנויות', detail: detailValue });
      }
      if (combinedText.includes('מנתח התנהגות') || combinedText.includes('תוכנית התנהגותית')) {
        student.interventions.emotionalIntensiveDetails.behaviorIntervention = true;
        student.interventionDetails.push({ type: 'emotionalIntensive', name: 'התערבות התנהגותית', detail: detailValue });
      }
      if (combinedText.includes('טיפול במיומנויות חברתיות') || (combinedText.includes('מיומנויות חברתיות') && headerValue.includes('מומחים'))) {
        student.interventions.emotionalIntensiveDetails.socialSkills = true;
        student.interventionDetails.push({ type: 'emotionalIntensive', name: 'טיפול במיומנויות חברתיות', detail: detailValue });
      }
      if (combinedText.includes('הדרכת הורים')) {
        student.interventions.emotionalIntensiveDetails.parentGuidance = true;
        student.interventionDetails.push({ type: 'emotionalIntensive', name: 'הדרכת הורים', detail: detailValue });
      }
      if (combinedText.includes('חוץ בית ספרי') || combinedText.includes('חוץ ביה"ס') || combinedText.includes('מענים חוץ')) {
        student.interventions.emotionalIntensiveDetails.externalServices = true;
        student.interventionDetails.push({ type: 'emotionalIntensive', name: 'מענים חוץ בית ספריים', detail: detailValue });
      }
      
      // זיהוי מענים חיצוניים ספציפיים (קלינאית תקשורת, מרפאה בעיסוק וכו')
      if (combinedText.includes('קלינאית') || combinedText.includes('קלינאי תקשורת') || combinedText.includes('קלינאות')) {
        student.interventions.emotionalIntensiveDetails.externalServices = true;
        student.interventionDetails.push({ type: 'external', name: 'קלינאות תקשורת', detail: detailValue });
      }
      if (combinedText.includes('מרפאה בעיסוק') || combinedText.includes('מרפאת בעיסוק') || combinedText.includes('ריפוי בעיסוק')) {
        student.interventions.emotionalIntensiveDetails.externalServices = true;
        student.interventionDetails.push({ type: 'external', name: 'מרפאה בעיסוק', detail: detailValue });
      }
      if (combinedText.includes('פיזיותרפ')) {
        student.interventions.emotionalIntensiveDetails.externalServices = true;
        student.interventionDetails.push({ type: 'external', name: 'פיזיותרפיה', detail: detailValue });
      }
      
      // זיהוי תוכניות למחוננים ומצטיינים (מניעת כפילויות)
      if (combinedText.includes('מחונן') || combinedText.includes('מצטיינים')) {
        const alreadyAdded = student.interventionDetails.some(d => d.name === 'תוכניות ייעודיות לתלמידים מחוננים ומצטיינים');
        if (!alreadyAdded) {
          student.interventionDetails.push({ type: 'special', name: 'תוכניות ייעודיות לתלמידים מחוננים ומצטיינים', detail: detailValue });
        }
      }
      
      // זיהוי תוכניות לקשב (מניעת כפילויות)
      if ((combinedText.includes('קשב') || combinedText.includes('ריכוז')) && !combinedText.includes('ניהול')) {
        const alreadyAdded = student.interventionDetails.some(d => d.name === 'תוכניות לקשב וריכוז');
        if (!alreadyAdded) {
          student.interventionDetails.push({ type: 'special', name: 'תוכניות לקשב וריכוז', detail: detailValue });
        }
      }
      
      // בדיקה לפירוט משולב - פיצול מענים
      detailParts.forEach(part => {
        const partLower = part.toLowerCase();
        if (partLower.includes('מענה מותאם פרט') && partLower.includes('מתמטיקה')) {
          student.interventions.learningIntensiveMath = true;
        }
        if (partLower.includes('מענה מותאם פרט') && partLower.includes('שפה')) {
          student.interventions.learningIntensiveLanguage = true;
        }
        if (partLower.includes('מענה מותאם פרט') && partLower.includes('אנגלית')) {
          student.interventions.learningIntensiveEnglish = true;
        }
        if (partLower.includes('חוץ בית ספרי') || partLower.includes('מענים חוץ')) {
          student.interventions.emotionalIntensiveDetails.externalServices = true;
          if (!student.interventionDetails.find(d => d.name === 'מענים חוץ בית ספריים')) {
            student.interventionDetails.push({ type: 'emotionalIntensive', name: 'מענים חוץ בית ספריים', detail: part });
          }
        }
      });
    }
    
    if (Object.keys(student.scores).length > 0) students.push(student);
    i += skipNext ? 2 : 1;
  }
  
  return students.length > 0 ? students : null;
}

  const advancedData = domains.map(d => bar[d]['מתקדם'] || 0);
  const typicalData = domains.map(d => bar[d]['תקין'] || 0);
  const strugglingData = domains.map(d => bar[d]['מתקשה'] || 0);
  const severeData = domains.map(d => bar[d]['מתקשה מאד'] || 0);
  
  // לוג לבדיקה
  console.log('Chart data:', { domains, advancedData, typicalData, strugglingData, severeData });
  console.log('Raw bar data:', bar);
  
  new Chart(barCtx, {
    type: 'bar',
    data: {
      labels: domains,
      datasets: [

          label: 'מתקדם', 
          data: advancedData, 
          backgroundColor: '#10b981',
          borderColor: '#059669',
          borderWidth: 1
        },
        {

          data: typicalData, 
          backgroundColor: '#3b82f6',
          borderColor: '#2563eb',
          borderWidth: 1
        },
        { 
          label: 'מתקשה', 
          data: strugglingData, 
          backgroundColor: '#f59e0b',
          borderColor: '#d97706',
          borderWidth: 1
        },
        {

          backgroundColor: '#ef4444',
          borderColor: '#dc2626',
          borderWidth: 1
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,

        },

          }

    }
  });

function renderClassroomStatus() {
  const students = appState.students;
  
  // תחומים לימודיים ורגשיים
  const academicDomains = ['שפה', 'מתמטיקה', 'אנגלית'];
  const emotionalDomains = ['רגשי', 'התנהגותי', 'חברתי'];
  const allDomains = ['שפה', 'מתמטיקה', 'אנגלית', 'מוטיבציה', 'רגשי', 'התנהגותי', 'חברתי', 'קשב', 'תנועתי'];
  
  // חישוב קטגוריות לגרף עוגה
  let advanced = 0;      // מתקדם בכל התחומים
  let typical = 0;       // תקין ב-6+ תחומים
  let academicOnly = 0;  // מתקשה רק בלימודי
  let emotionalOnly = 0; // מתקשה רק ברגשי-חברתי-התנהגותי
  let both = 0;          // מתקשה בשניהם
  
  students.forEach(s => {
    const scores = Object.entries(s.scores);
    const allAdvanced = scores.every(([d, sc]) => sc === 'מתקדם');
    const typicalCount = scores.filter(([d, sc]) => sc === 'תקין' || sc === 'מתקדם').length;
    
    const hasAcademicDifficulty = academicDomains.some(d => 
      s.scores[d] === 'מתקשה' || s.scores[d] === 'מתקשה מאד'
    );
    const hasEmotionalDifficulty = emotionalDomains.some(d => 
      s.scores[d] === 'מתקשה' || s.scores[d] === 'מתקשה מאד'
    );
    
    if (allAdvanced) {
      advanced++;
    } else if (hasAcademicDifficulty && hasEmotionalDifficulty) {
      both++;
    } else if (hasAcademicDifficulty) {
      academicOnly++;
    } else if (hasEmotionalDifficulty) {
      emotionalOnly++;
    } else if (typicalCount >= 6) {
      typical++;
    } else {
      typical++; // ברירת מחדל לתקינים
    }
  });
  
  // חישוב נתונים לגרף עמודות - פריסה לפי תחום
  const domainStats = {};
  allDomains.forEach(domain => {
    domainStats[domain] = { 'מתקדם': 0, 'תקין': 0, 'מתקשה': 0, 'מתקשה מאד': 0 };
  });
  
  students.forEach(s => {
    Object.entries(s.scores).forEach(([domain, score]) => {
      if (domainStats[domain] && domainStats[domain][score] !== undefined) {
        domainStats[domain][score]++;
      }
    });
  });
  
  // חישוב סטטיסטיקות אחרות
  const challenges = {};
  const strengths = {};
  const specialPops = [];
  
  students.forEach(s => {
    Object.entries(s.scores).forEach(([domain, score]) => {
      if (score === 'מתקשה' || score === 'מתקשה מאד') {
        if (!challenges[domain]) challenges[domain] = { count: 0, students: [], details: {} };
        challenges[domain].count++;
        challenges[domain].students.push(s.name);
        if (s.details[domain]) {
          s.details[domain].split('\n').filter(d => d.trim()).forEach(detail => {
            const clean = detail.replace(/^-\s*/, '').trim();
            if (clean) {
              if (!challenges[domain].details[clean]) {
                challenges[domain].details[clean] = { count: 0, students: [] };
              }
              challenges[domain].details[clean].count++;
              challenges[domain].details[clean].students.push(s.name);
            }
          });
        }
      }
    });
    
    if (s.strengths) {
      s.strengths.split('\n').filter(x => x.trim()).forEach(str => {
        const clean = str.replace(/^-\s*/, '').trim();
        if (clean) {
          if (!strengths[clean]) strengths[clean] = { count: 0, students: [] };
          strengths[clean].count++;
          strengths[clean].students.push(s.name);
        }
      });
    }
    
    if (s.specialPopulation) specialPops.push({ name: s.name, type: s.specialPopulation, source: 'אוכלוסייה' });
    if (s.familyDetails) specialPops.push({ name: s.name, type: s.familyDetails, source: 'משפחה' });
  });

  // יעדים מוצעים
  const goals = Object.entries(challenges)
    .sort((a, b) => b[1].count - a[1].count)
    .slice(0, 3)
    .map(([domain, data]) => {
      const topDetail = Object.entries(data.details).sort((a, b) => b[1].count - a[1].count)[0];
      return topDetail 
        ? `חיזוק ${domain}: ${topDetail[0]} (${data.count} תלמידים)`
        : `שיפור ${domain} (${data.count} תלמידים)`;
    });

  // שמירת נתוני הגרפים בstate
  appState.chartData = {
    pie: { advanced, typical, academicOnly, emotionalOnly, both },
    bar: domainStats
  };
  
  // שמירת נתונים נוספים ל-state לתצוגה מאוחרת
  appState.statusData = { challenges, strengths, specialPops, goals };

  // בניית תוכן לפי הסעיף הנבחר
  let sectionContent = '';
  
  if (appState.selectedStatusSection === 'strengths') {
    sectionContent = `
      <div class="mb-4">
        <button onclick="selectStatusSection(null)" 
          class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition-all flex items-center gap-2">
          <span>→</span> חזרה לתמונת המצב
        </button>
      </div>
      ${Object.keys(strengths).length > 0 ? `
        <div class="bg-gradient-to-br from-emerald-50 to-teal-50 rounded-2xl shadow-lg p-8 border border-emerald-200">
          <h3 class="text-2xl font-bold text-slate-900 mb-6">⭐ חוזקות בולטות</h3>
          <div class="space-y-3">
            ${Object.entries(strengths).sort((a, b) => b[1].count - a[1].count).map(([str, data]) => `
              <div class="bg-white/80 rounded-xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-slate-800 font-medium">${str}</span>
                  <span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-sm font-bold">${data.count} תלמידים</span>
                </div>
                <p class="text-sm text-slate-600">${data.students.join(', ')}</p>
              </div>
            `).join('')}
          </div>
        </div>
      ` : '<div class="bg-white rounded-xl p-8 text-center text-slate-500">לא נמצאו חוזקות בנתונים</div>'}
    `;
  } else if (appState.selectedStatusSection === 'challenges') {
    sectionContent = `
      <div class="mb-4">
        <button onclick="selectStatusSection(null)" 
          class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition-all flex items-center gap-2">
          <span>→</span> חזרה לתמונת המצב
        </button>
      </div>
      <div class="bg-gradient-to-br from-orange-50 to-amber-50 rounded-2xl shadow-lg p-8 border border-orange-200">
        <h3 class="text-2xl font-bold text-slate-900 mb-6">⚠️ אתגרים מרכזיים</h3>
        <div class="space-y-4">
          ${Object.entries(challenges).sort((a, b) => b[1].count - a[1].count).map(([domain, data]) => `
            <div class="bg-white/80 rounded-xl p-5 shadow-sm">
              <div class="flex items-center justify-between mb-3">
                <h4 class="font-bold text-slate-900 text-lg">${domain}</h4>
                <span class="bg-orange-100 text-orange-800 px-3 py-1 rounded-full text-sm font-bold">${data.count} תלמידים</span>
              </div>
              <p class="text-sm text-slate-600 mb-2"><strong>תלמידים:</strong> ${data.students.join(', ')}</p>
              ${Object.keys(data.details).length > 0 ? `
                <div class="text-sm text-slate-700 bg-orange-50 rounded-lg p-3">
                  <strong>קשיים נפוצים:</strong>
                  <ul class="mr-4 mt-1 space-y-1">
                    ${Object.entries(data.details).sort((a, b) => b[1].count - a[1].count).slice(0, 5).map(([d, info]) => `
                      <li class="list-disc">
                        <span class="font-medium">${d}</span> 
                        <span class="text-orange-700">(${info.count})</span>
                        <span class="text-slate-500 text-xs"> - ${info.students.join(', ')}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              ` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else if (appState.selectedStatusSection === 'special') {
    sectionContent = `
      <div class="mb-4">
        <button onclick="selectStatusSection(null)" 
          class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition-all flex items-center gap-2">
          <span>→</span> חזרה לתמונת המצב
        </button>
      </div>
      ${specialPops.length > 0 ? `
        <div class="bg-gradient-to-br from-purple-50 to-violet-50 rounded-2xl shadow-lg p-8 border border-purple-200">
          <h3 class="text-2xl font-bold text-slate-900 mb-6">🎓 אוכלוסיות ייחודיות והיבטים משפחתיים</h3>
          <div class="space-y-2">
            ${(() => {
              // קיבוץ לפי תלמיד
              const byStudent = {};
              specialPops.forEach(p => {
                if (!byStudent[p.name]) byStudent[p.name] = [];
                byStudent[p.name].push({ type: p.type, source: p.source });
              });
              
              return Object.entries(byStudent).map(([name, items]) => `
                <div class="bg-white/80 rounded-xl p-4 shadow-sm">
                  <div class="font-medium text-slate-900 mb-2">${name}</div>
                  <div class="flex flex-wrap gap-2">
                    ${items.map(item => `
                      <span class="${item.source === 'משפחה' ? 'bg-orange-100 text-orange-700' : 'bg-purple-100 text-purple-700'} px-3 py-1 rounded-full text-sm">
                        ${item.type}
                      </span>
                    `).join('')}
                  </div>
                </div>
              `).join('');
            })()}
          </div>
        </div>
      ` : '<div class="bg-white rounded-xl p-8 text-center text-slate-500">לא נמצאו אוכלוסיות ייחודיות בנתונים</div>'}
    `;
  }
  
  // אם נבחר סעיף ספציפי, הצג רק אותו
  if (appState.selectedStatusSection) {
    return `<div class="space-y-6 animate-fadeIn">${sectionContent}</div>`;
  }

  // תצוגה ראשית - גרף, יעדים ולחצנים
  return `
    <div class="space-y-6 animate-fadeIn">
      <div class="bg-white rounded-2xl shadow-lg p-8 border border-slate-200">
        <h2 class="text-3xl font-black text-slate-900 mb-4">👥 סיפור כיתתי</h2>
        <p class="text-slate-700 text-lg">הכיתה מונה <span class="font-bold text-indigo-600">${students.length} תלמידים</span> עם מגוון חוזקות ואתגרים.</p>
      </div>

      <!-- לחצני ניווט לסעיפים נוספים -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <button onclick="selectStatusSection('strengths')"
          class="py-5 px-4 rounded-xl transition-all shadow-sm hover:shadow-lg border-2 bg-gradient-to-br from-emerald-50 to-teal-50 border-emerald-300 hover:border-emerald-400 text-center">
          <div class="text-3xl mb-2">⭐</div>
          <div class="font-bold text-slate-900">חוזקות בולטות</div>
          <div class="text-xs text-emerald-700 mt-1">${Object.keys(strengths).length} חוזקות זוהו</div>
        </button>
        
        <button onclick="selectStatusSection('challenges')"
          class="py-5 px-4 rounded-xl transition-all shadow-sm hover:shadow-lg border-2 bg-gradient-to-br from-orange-50 to-amber-50 border-orange-300 hover:border-orange-400 text-center">
          <div class="text-3xl mb-2">⚠️</div>
          <div class="font-bold text-slate-900">אתגרים מרכזיים</div>
          <div class="text-xs text-orange-700 mt-1">${Object.keys(challenges).length} תחומים עם אתגרים</div>
        </button>
        
        <button onclick="selectStatusSection('special')"
          class="py-5 px-4 rounded-xl transition-all shadow-sm hover:shadow-lg border-2 bg-gradient-to-br from-purple-50 to-violet-50 border-purple-300 hover:border-purple-400 text-center">
          <div class="text-3xl mb-2">🎓</div>
          <div class="font-bold text-slate-900">אוכלוסיות ייחודיות</div>
          <div class="text-xs text-purple-700 mt-1">${specialPops.length} תלמידים</div>
        </button>
      </div>

      <!-- גרף עמודות -->
      <div class="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
        <h3 class="text-xl font-bold text-slate-900 mb-4 text-center">📈 פריסת רמות לפי תחום</h3>
        <div class="relative" style="height: 400px;">
          <canvas id="barChart"></canvas>
        </div>
        <div class="mt-4 flex justify-center gap-6 text-sm">
          <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-emerald-500"></span> מתקדם</div>
          <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-blue-500"></span> תקין</div>
          <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-amber-500"></span> מתקשה</div>
          <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-red-500"></span> מתקשה מאד</div>
        </div>
      </div>

      <!-- יעדים מרכזיים -->
      ${goals.length > 0 ? `
        <div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-2xl shadow-lg p-8 border border-blue-200">
          <h3 class="text-2xl font-bold text-slate-900 mb-6">🎯 יעדים מרכזיים מוצעים</h3>
          <div class="space-y-3">
            ${goals.map((g, i) => `
              <div class="bg-white/80 rounded-xl p-4 flex gap-4 shadow-sm">
                <div class="bg-blue-600 text-white font-bold w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0">${i + 1}</div>
                <p class="text-slate-800 pt-1">${g}</p>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

// פונקציה ליצירת טבלה מסכמת
function renderSummaryTable(domains) {
  const students = appState.students;
  const resourceOptions = ['מחנכת', 'מורת שילוב', 'מורת רוחב', 'שעות פרטניות', 'קלינאית תקשורת', 'פסיכולוגית', 'יועצת', 'מטפלת באומנות', 'אחר'];
  
  // תחומים לא-לימודיים לרובד אוניברסלי
  const nonAcademicDomains = domains.filter(d => d.type === 'emotional');
  
  // תחומים לימודיים
  const academicDomains = domains.filter(d => d.type === 'learning');
  
  // פונקציה לקבלת המלצות לפי תחום ורובד
  const getRecommendations = (domainKey, tier) => {
    const recs = PEDAGOGICAL_RECOMMENDATIONS[domainKey];
    if (!recs || !recs[tier]) return [];
    return recs[tier].slice(0, 3).map(r => r.title);
  };
  
  // פונקציה לקבלת קשיים ותלמידים בתחום - מחולק לפי רובד מהעוגן
  const getDifficultiesByTier = (domain) => {
    const result = {
      universal: { difficulties: [], students: [] },
      targeted: { difficulties: [], students: [] },
      intensive: { difficulties: [], students: [] }
    };
    
    const allDifficulties = new Set();
    
    students.forEach(s => {
      if (s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד') {
        // בדיקה לאיזה רובד התלמיד שייך לפי נתוני העוגן
        let tier = 'universal';
        if (s.interventions) {
          if (s.interventions[domain.intensiveKey]) {
            tier = 'intensive';
          } else if (s.interventions[domain.groupedKey]) {
            tier = 'targeted';
          }
        }
        
        // הוספת התלמיד לרובד המתאים
        if (!result[tier].students.includes(s.name)) {
          result[tier].students.push(s.name);
        }
        
        // הוספת הקשיים של התלמיד
        if (s.details && s.details[domain.scoreKey]) {
          s.details[domain.scoreKey].split('\\n').filter(d => d.trim()).forEach(detail => {
            const clean = detail.replace(/^-\\s*/, '').trim();
            if (clean) {
              allDifficulties.add(clean);
              if (!result[tier].difficulties.includes(clean)) {
                result[tier].difficulties.push(clean);
              }
            }
          });
        }
      }
    });
    
    return result;
  };
  
  // פונקציה ליצירת שורת משאבים עם ערכים מוצגים להדפסה
  const renderResourceCell = (key, existingResource = '') => {
    const saved = appState.resourceInputs[key] || { provider: '', hours: '', otherProvider: '', additionalStudents: '' };
    const displayProvider = saved.provider === 'אחר' ? saved.otherProvider : saved.provider;
    const displayHours = saved.hours;
    
    return `
      <div class="space-y-2 resource-cell" data-key="${key}">
        ${existingResource ? `<div class="text-xs text-slate-500 mb-1">מהעוגן: ${existingResource}</div>` : ''}
        <select onchange="updateResourceInput('${key}', 'provider', this.value); this.nextElementSibling.style.display = this.value === 'אחר' ? 'block' : 'none';" 
          class="resource-select w-full text-xs border border-slate-300 rounded px-2 py-1 bg-white">
          <option value="">בחרי גורם...</option>
          ${resourceOptions.map(opt => `<option value="${opt}" ${saved.provider === opt ? 'selected' : ''}>${opt}</option>`).join('')}
        </select>
        <input type="text" placeholder="פרטי גורם אחר" value="${saved.otherProvider || ''}"
          onchange="updateResourceInput('${key}', 'otherProvider', this.value)"
          class="resource-other w-full text-xs border border-slate-300 rounded px-2 py-1 ${saved.provider === 'אחר' ? '' : 'hidden'}" 
          style="${saved.provider === 'אחר' ? '' : 'display:none'}" />
        <input type="text" placeholder="שעות שבועיות" value="${saved.hours || ''}"
          onchange="updateResourceInput('${key}', 'hours', this.value)"
          class="resource-hours w-full text-xs border border-slate-300 rounded px-2 py-1" />
        <span class="resource-display hidden print-only text-xs">${displayProvider ? displayProvider + (displayHours ? ' - ' + displayHours + ' שעות' : '') : ''}</span>
      </div>
    `;
  };
  
  // פונקציה ליצירת תא תלמידים עם אפשרות להוספה והסרה
  const renderStudentsCell = (key, studentNames) => {
    const saved = appState.resourceInputs[key] || {};
    const additionalStudents = saved.additionalStudents || '';
    const removedStudents = saved.removedStudents || '';
    const removedList = removedStudents.split(',').map(s => s.trim()).filter(s => s);
    
    // סינון תלמידים שהוסרו
    const filteredStudents = studentNames.filter(name => !removedList.includes(name));
    
    // הוספת תלמידים נוספים
    const addedList = additionalStudents.split(',').map(s => s.trim()).filter(s => s);
    const finalStudents = [...filteredStudents, ...addedList];
    
    return `
      <div class="students-cell" data-key="${key}">
        <div class="students-list">${filteredStudents.join(', ')}</div>
        <div class="mt-1 space-y-1">
          <input type="text" placeholder="➕ הוסיפי תלמידים (מופרדים בפסיק)" value="${additionalStudents}"
            onchange="updateResourceInput('${key}', 'additionalStudents', this.value)"
            class="additional-students w-full text-xs border border-green-300 rounded px-2 py-1 bg-green-50" />
          <input type="text" placeholder="➖ הסירי תלמידים (מופרדים בפסיק)" value="${removedStudents}"
            onchange="updateResourceInput('${key}', 'removedStudents', this.value)"
            class="removed-students w-full text-xs border border-red-300 rounded px-2 py-1 bg-red-50" />
        </div>
        <span class="students-display hidden print-only text-xs">${finalStudents.join(', ')}</span>
      </div>
    `;
  };
  
  // פונקציה ליצירת שדה הערות
  const renderNotesField = (key) => {
    const saved = appState.resourceInputs[key] || {};
    const notes = saved.notes || '';
    return `
      <div class="notes-cell mt-4 p-3 bg-slate-50 rounded-lg border border-slate-200" data-key="${key}">
        <label class="text-sm font-medium text-slate-700 block mb-2">📝 הערות:</label>
        <textarea 
          placeholder="הערות נוספות..."
          onchange="updateResourceInput('${key}', 'notes', this.value)"
          class="notes-input w-full text-sm border border-slate-300 rounded px-3 py-2 min-h-[60px]">${notes}</textarea>
        <span class="notes-display hidden print-only text-sm">${notes}</span>
      </div>
    `;
  };
  
  // בניית טבלת תחום לימודי - מחולק לרבדים
  const renderAcademicDomainTable = (domain) => {
    // פונקציה לפיצול קשיים מטקסט
    const parseDifficulties = (text) => {
      if (!text) return [];
      // פיצול לפי שורות חדשות, מקפים או פסיקים
      return text
        .split(/[\n,]/)
        .flatMap(part => part.split(/\s*-\s*/))
        .map(d => d.trim())
        .filter(d => d.length > 0);
    };
    
    // איסוף כל הקשיים הייחודיים (ללא כפילויות) מתלמידים מתקשים
    const allDifficultiesSet = new Set();
    
    students.forEach(s => {
      if (s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד') {
        // איסוף קשיים
        if (s.details && s.details[domain.scoreKey]) {
          parseDifficulties(s.details[domain.scoreKey]).forEach(diff => {
            allDifficultiesSet.add(diff);
          });
        }
      }
    });
    
    // איסוף תלמידים לפי רובד - כמו בתוכנית הכיתתית (לא תלוי בציון)
    const targetedStudents = students.filter(s => 
      s.interventions && s.interventions[domain.groupedKey]
    );
    const intensiveStudents = students.filter(s => 
      s.interventions && s.interventions[domain.intensiveKey]
    );
    
    const allDifficulties = [...allDifficultiesSet];
    
    if (allDifficulties.length === 0 && targetedStudents.length === 0 && intensiveStudents.length === 0) {
      return `
        <div class="bg-emerald-50 rounded-lg p-4 text-center text-emerald-700">
          ✓ אין תלמידים מתקשים בתחום זה
        </div>
      `;
    }
    
    let html = '<div class="space-y-4">';
    
    // איסוף תלמידים מתקשים בתחום
    const strugglingStudents = students.filter(s => 
      s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד'
    );
    
    // רובד אוניברסלי - כל הקשיים ביחד (ללא כפילויות)
    if (allDifficulties.length > 0 || strugglingStudents.length > 0) {
      const uniRecs = getRecommendations(domain.key, 'universal');
      const uniKey = `${domain.key}-universal`;
      html += `
        <div class="bg-blue-50 rounded-lg p-4 border border-blue-200">
          <div class="flex items-center gap-2 mb-3">
            <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-medium">🌐 רובד אוניברסלי</span>
          </div>
          <table class="w-full border-collapse text-sm">
            <thead>
              <tr class="bg-blue-100">
                <th class="border border-blue-200 px-3 py-2 text-right font-bold">קשיים בתחום</th>
                <th class="border border-blue-200 px-3 py-2 text-right font-bold">תלמידים מתקשים</th>
                <th class="border border-blue-200 px-3 py-2 text-right font-bold">המלצות פדגוגיות</th>
                <th class="border border-blue-200 px-3 py-2 text-right font-bold">משאבים</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="border border-blue-200 px-3 py-2 text-xs">${allDifficulties.join(', ') || '-'}</td>
                <td class="border border-blue-200 px-3 py-2 text-sm">${strugglingStudents.map(s => s.name).join(', ') || '-'}</td>
                <td class="border border-blue-200 px-3 py-2 text-xs">${uniRecs.join(', ') || '-'}</td>
                <td class="border border-blue-200 px-3 py-2">${renderResourceCell(uniKey)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }
    
    // רובד ממוקד - כל התלמידים ברובד זה

      const tarRecs = getRecommendations(domain.key, 'targeted');

        // קשיים הקשורים לקריאה
        const readingKeywords = ['קריאה', 'פענוח', 'שטף', 'קצב קריאה', 'דיוק בקריאה'];
        
        // חלוקת תלמידים וקשיים לקבוצות
        const readingGroup = { students: new Set(), difficulties: new Set() };
        const otherGroup = { students: new Set(), difficulties: new Set() };
        
        targetedStudents.forEach(s => {
          if (s.details && s.details[domain.scoreKey]) {
            const studentDiffs = parseDifficulties(s.details[domain.scoreKey]);
            let hasReading = false;
            let hasOther = false;
            
            studentDiffs.forEach(diff => {
              const isReading = readingKeywords.some(kw => diff.includes(kw));
              if (isReading) {
                readingGroup.difficulties.add(diff);
                hasReading = true;
              } else {
                otherGroup.difficulties.add(diff);
                hasOther = true;
              }
            });
            
            if (hasReading) readingGroup.students.add(s.name);
            if (hasOther) otherGroup.students.add(s.name);
            
            // אם אין קשיים ספציפיים, הוסף לקבוצת "אחר"
            if (!hasReading && !hasOther) {
              otherGroup.students.add(s.name);
            }
          } else {
            // תלמיד ללא פירוט קשיים - הוסף לקבוצת "אחר"
            otherGroup.students.add(s.name);

        html += `

                  <th class="border border-amber-200 px-3 py-2 text-right font-bold">המלצות פדגוגיות</th>
                  <th class="border border-amber-200 px-3 py-2 text-right font-bold">משאבים</th>
                </tr>
              </thead>
              <tbody>
                ${readingGroup.students.size > 0 ? `
                  <tr>
                    <td class="border border-amber-200 px-3 py-2 font-medium">📖 קריאה</td>

                    <td class="border border-amber-200 px-3 py-2">${renderStudentsCell('language-targeted-reading', [...readingGroup.students])}</td>
                    <td class="border border-amber-200 px-3 py-2 text-xs">${tarRecs.join(', ') || '-'}</td>
                    <td class="border border-amber-200 px-3 py-2">${renderResourceCell('language-targeted-reading')}</td>
                  </tr>

                  <tr>
                    <td class="border border-amber-200 px-3 py-2 font-medium">✍️ כתיבה ושפה</td>
                    <td class="border border-amber-200 px-3 py-2 text-xs">${[...otherGroup.difficulties].join(', ') || '-'}</td>
                    <td class="border border-amber-200 px-3 py-2">${renderStudentsCell('language-targeted-writing', [...otherGroup.students])}</td>
                    <td class="border border-amber-200 px-3 py-2 text-xs">${tarRecs.join(', ') || '-'}</td>
                    <td class="border border-amber-200 px-3 py-2">${renderResourceCell('language-targeted-writing')}</td>

      } else {

        const tarKey = `${domain.key}-targeted`;
        
        // איסוף קשיים ייחודיים של תלמידי הרובד הממוקד

          if (s.details && s.details[domain.scoreKey]) {
            parseDifficulties(s.details[domain.scoreKey]).forEach(diff => {
              targetedDifficultiesSet.add(diff);
            });

        });
        const targetedDifficulties = [...targetedDifficultiesSet];
        
        html += `

                  <th class="border border-amber-200 px-3 py-2 text-right font-bold">תלמידים</th>
                  <th class="border border-amber-200 px-3 py-2 text-right font-bold">המלצות פדגוגיות</th>

                  <td class="border border-amber-200 px-3 py-2">${renderResourceCell(tarKey)}</td>

              </tbody>
            </table>

    }
    
    // רובד אינטנסיבי - כל התלמידים ברובד זה

    return html;

  // בניית טבלת תחום רגשי/התנהגותי

        <!-- מענים חיצוניים -->
        ${(() => {
          // מילות מפתח למענים חיצוניים
          const externalKeywords = ['חוץ בית ספרי', 'חוץ ביה"ס', 'קלינאית', 'קלינאות', 'קלינאי', 'מרפאה בעיסוק', 'מרפאת בעיסוק', 'ריפוי בעיסוק', 'פיזיותרפ'];
          
          // פונקציה לחילוץ רק החלקים החיצוניים מטקסט
          const extractExternalParts = (text) => {
            if (!text) return [];
            // פיצול לפי מקפים
            const parts = text.split(/\s*-\s*/);
            // סינון רק חלקים שמכילים מילות מפתח חיצוניות
            return parts.filter(part => 
              externalKeywords.some(kw => part.toLowerCase().includes(kw.toLowerCase()))
            );
          };
          
          // פונקציה לבדוק אם טקסט מכיל מילות מפתח חיצוניות
          const hasExternalKeyword = (text) => {
            if (!text) return false;
            return externalKeywords.some(kw => text.toLowerCase().includes(kw.toLowerCase()));
          };
          
          // איסוף תלמידים עם מענים חיצוניים או מענים ייחודיים לאוכלוסיות מיוחדות
          const externalStudents = students.filter(s => 
            s.interventions?.emotionalIntensiveDetails?.externalServices ||
            s.specialInterventions ||
            hasExternalKeyword(s.learningIntensiveDetails) ||
            (s.interventionDetails && s.interventionDetails.some(d => 
              d.type === 'external' || hasExternalKeyword(d.name) || hasExternalKeyword(d.detail)
            ))
          );
          
          if (externalStudents.length === 0) return '';
          
          return `
            <div class="p-6 bg-purple-50">
              <h3 class="text-xl font-bold text-slate-900 mb-4">🏥 מענים חיצוניים ומענים ייחודיים</h3>
              <p class="text-sm text-slate-600 mb-4">תלמידים המקבלים שירותים מגורמים חיצוניים לבית הספר או מענים ייחודיים לאוכלוסיות מיוחדות</p>
              <table class="w-full border-collapse text-sm">
                <thead>
                  <tr class="bg-purple-100">
                    <th class="border border-purple-200 px-3 py-2 text-right font-bold">תלמיד</th>
                    <th class="border border-purple-200 px-3 py-2 text-right font-bold">סוג מענה</th>
                    <th class="border border-purple-200 px-3 py-2 text-right font-bold">הערות</th>
                  </tr>
                </thead>
                <tbody>
                  ${externalStudents.map(s => {
                    // שימוש ב-Set להסרת כפילויות
                    const detailsSet = new Set();
                    
                    // מענים חיצוניים מתוך interventionDetails
                    if (s.interventionDetails) {
                      s.interventionDetails.forEach(d => {
                        // אם זה סוג external, השתמש בשם ישירות
                        if (d.type === 'external') {
                          detailsSet.add(d.name.trim());
                        } else if (hasExternalKeyword(d.name) || hasExternalKeyword(d.detail)) {
                          // אחרת, חלץ רק את החלקים החיצוניים
                          const parts = extractExternalParts(d.detail || d.name);
                          parts.forEach(p => {
                            // נרמול הטקסט - הסרת מקפים מיותרים בהתחלה ורווחים כפולים
                            const normalized = p.trim().replace(/^-\s*/, '').trim();
                            if (normalized) detailsSet.add(normalized);
                          });
                        }
                      });
                    }
                    
                    // מענים חיצוניים מתוך learningIntensiveDetails (קלינאית תקשורת וכו')
                    if (s.learningIntensiveDetails && hasExternalKeyword(s.learningIntensiveDetails)) {
                      const parts = extractExternalParts(s.learningIntensiveDetails);
                      parts.forEach(p => {
                        const normalized = p.trim().replace(/^-\s*/, '').trim();
                        if (normalized) detailsSet.add(normalized);
                      });
                    }
                    
                    // מענים ייחודיים לאוכלוסיות מיוחדות
                    if (s.specialInterventions) {
                      detailsSet.add(s.specialInterventions.trim());
                    }
                    
                    // המרה למערך והסרת ערכים ריקים וכפילויות דומות
                    let detailsList = [...detailsSet].filter(d => d);
                    // הסרת כפילויות שונות רק ברווחים או סימנים
                    const seen = new Set();
                    detailsList = detailsList.filter(d => {
                      const key = d.replace(/\s+/g, ' ').toLowerCase();
                      if (seen.has(key)) return false;
                      seen.add(key);
                      return true;
                    });
                    const details = detailsList.join(', ') || 'מענה חוץ בית ספרי';
                    
                    const key = 'external-' + s.id;
                    return `
                      <tr class="hover:bg-purple-50">
                        <td class="border border-purple-200 px-3 py-2 font-medium">${s.name}</td>
                        <td class="border border-purple-200 px-3 py-2 text-sm">${details}</td>
                        <td class="border border-purple-200 px-3 py-2">
                          <input type="text" placeholder="הערות..." 
                            onchange="updateResourceInput('${key}', 'notes', this.value)"
                            value="${(appState.resourceInputs[key] || {}).notes || ''}"
                            class="w-full text-xs border border-slate-300 rounded px-2 py-1" />
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
              ${renderNotesField('external-services-notes')}
            </div>
          `;
        })()}
      </div>
    </div>
  `;
}

function renderTier(title, tier, recommendations, domainKey, studentsInTier) {
  if (!recommendations || recommendations.length === 0) return '';
  
  const colors = {
    universal: 'from-blue-50 to-cyan-50 border-blue-200',
    targeted: 'from-amber-50 to-yellow-50 border-amber-200',
    intensive: 'from-rose-50 to-red-50 border-rose-200'
  };

  return `
    <div class="bg-gradient-to-br ${colors[tier]} rounded-xl p-5 mb-4 border">
      <h4 class="text-lg font-bold text-slate-900 mb-2">${title}</h4>
      
      ${studentsInTier && studentsInTier.length > 0 ? `
        <div class="bg-white/60 rounded-lg p-3 mb-4 border border-slate-200">
          <p class="text-sm font-medium text-slate-700">
            <span class="font-bold">תלמידים המקבלים מענה ברובד זה (${studentsInTier.length}):</span>
            <span class="text-slate-600 mr-2">${studentsInTier.map(s => s.name).join(', ')}</span>
          </p>
        </div>
      ` : ''}
      
      <div class="space-y-2">
        ${recommendations.map((rec, idx) => {
          const key = `${domainKey}-${tier}-${idx}`;
          const isExpanded = appState.expandedRecs[key];
          const sourceLinks = rec.source && SOURCE_LINKS[rec.source] ? SOURCE_LINKS[rec.source] : null;
          return `
            <div class="bg-white/70 rounded-xl border border-slate-200 overflow-hidden">
              <button onclick="toggleRec('${key}')" class="w-full p-4 flex items-center justify-between hover:bg-slate-50 text-right">
                <div class="flex items-center gap-3">
                  <span>💡</span>
                  <span class="font-bold text-slate-900">${rec.title}</span>
                  ${rec.source ? '<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-xs font-medium">כלים שלובים</span>' : ''}
                </div>
                <span>${isExpanded ? '▲' : '▼'}</span>
              </button>
              ${isExpanded ? `
                <div class="px-4 pb-4 space-y-3">
                  <p class="text-slate-700">${rec.description}</p>
                  <div class="flex flex-wrap gap-2">
                    <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-xs font-medium">${rec.frequency}</span>
                    <span class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-xs font-medium">${rec.udlPrinciple}</span>
                    ${rec.source ? `<span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-xs font-medium">📚 ${rec.source}</span>` : ''}
                  </div>
                  ${rec.tools && rec.tools.length > 0 ? `
                    <div class="bg-slate-50 rounded-lg p-3">
                      <p class="text-xs font-bold text-slate-600 mb-2">כלים:</p>
                      <div class="flex flex-wrap gap-2">
                        ${rec.tools.map(t => `<span class="bg-white text-slate-700 px-2 py-1 rounded text-xs border">${t}</span>`).join('')}
                      </div>
                    </div>
                  ` : ''}
                  ${sourceLinks ? `
                    <div class="bg-emerald-50 rounded-lg p-3 border border-emerald-200">
                      <p class="text-xs font-bold text-emerald-700 mb-2">📥 הורדת הגליון:</p>
                      <div class="flex flex-wrap gap-2">
                        <a href="${sourceLinks.he}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-xs font-medium transition-colors inline-flex items-center gap-1">
                          עברית
                        </a>
                        <a href="${sourceLinks.ar}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-xs font-medium transition-colors inline-flex items-center gap-1">

                        </a>
                      </div>

function formatBotResponse(text) {
  // המרת טקסט מודגש
  let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  // המרת קישורים בפורמט Markdown לקישורי HTML
  formatted = formatted.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="text-emerald-600 hover:text-emerald-700 underline font-medium">$1</a>');
  return formatted;
}

// פונקציה להוספת קישורים לתשובות שמזכירות גליונות כלים שלובים
function addSourceLinksToAnswer(answer) {
  // בדיקה אם התשובה כבר מכילה קישורים
  if (answer.includes('📥 **הורדת הגליון:**') || answer.includes('[עברית]')) {
    return answer;
  }
  
  // חיפוש גליון בתשובה
  const gilayonMatch = answer.match(/גליון (\d)/);
  if (gilayonMatch) {
    const gilayonNum = gilayonMatch[1];
    const sourceKey = `כלים שלובים - גליון ${gilayonNum}`;
    const links = SOURCE_LINKS[sourceKey];
    
    if (links) {
      answer += `\n\n📥 **הורדת הגליון:**\n• [עברית](${links.he})\n• [ערבית](${links.ar})`;
    }
  }
  return answer;
}

// פונקציה שיוצרת שאלות מכל ההמלצות הפדגוגיות
function generateAllRecsQuestions() {
  const questions = [];
  
  const domainNames = {
    language: '📖 שפה ואוריינות',
    math: '🔢 מתמטיקה',
    english: '🔤 אנגלית',
    emotional: '💚 רגשי',
    behavioral: '🎭 התנהגותי',
    social: '🤝 חברתי',
    attention: '⚡ קשב וריכוז',
    motor: '🏃 תנועתי-חושי',
    motivation: '🎯 מוטיבציה'
  };
  
  const tierNames = {
    universal: 'רובד אוניברסלי',
    targeted: 'רובד ממוקד',
    intensive: 'רובד אינטנסיבי'
  };
  
  // הוספת המלצות מ-PEDAGOGICAL_RECOMMENDATIONS
  for (const [domainKey, domain] of Object.entries(PEDAGOGICAL_RECOMMENDATIONS)) {
    for (const tier of ['universal', 'targeted', 'intensive']) {
      const recs = domain[tier] || [];
      for (const rec of recs) {
        let answer = `**${rec.title}**\n\n`;
        answer += `📝 ${rec.description}\n\n`;
        answer += `⏱️ **תדירות:** ${rec.frequency}\n`;
        answer += `🎯 **עקרון UDL:** ${rec.udlPrinciple}\n`;
        
        if (rec.tools && rec.tools.length > 0) {
          answer += `🛠️ **כלים:** ${rec.tools.join(', ')}\n`;
        }
        
        if (rec.source) {
          answer += `📚 **מקור:** ${rec.source}\n`;
          // הוספת קישורים להורדה
          const sourceLinks = SOURCE_LINKS[rec.source];
          if (sourceLinks) {
            answer += `\n📥 **הורדת הגליון:**\n`;
            answer += `• [עברית](${sourceLinks.he})\n`;
            answer += `• [ערבית](${sourceLinks.ar})\n`;
          }
        }
        
        answer += `\n📂 **תחום:** ${domainNames[domainKey] || domain.name} | **${tierNames[tier]}**`;
        
        // יצירת שאלה ללא מרכאות כפולות
        questions.push({
          question: `מה זה ${rec.title}`,
          answer: answer
        });
      }
    }
  }
  
  // הוספת פרקטיקות נוספות מ-ADDITIONAL_PRACTICES
  for (const [key, practice] of Object.entries(ADDITIONAL_PRACTICES)) {
    let answer = `**${practice.title}**\n\n`;
    answer += `📝 ${practice.description}\n\n`;
    answer += practice.details;
    answer += `\n\n📂 **תחום:** ${practice.domain} | **${practice.tier}**`;
    
    questions.push({
      question: `מה זה ${practice.title}`,
      answer: answer
    });
  }
  
  return questions;
}

function generateResponse(lower, originalMessage) {
  const allQ = getAllQuestions();
  const allQuestions = [...allQ.student, ...allQ.parents, ...allQ.team, ...allQ.terms, ...allQ.realtime, ...allQ.practices, ...allQ.allRecs];
  
  // ניקוי השאלה מסימנים מיוחדים (כולל מרכאות מכל הסוגים)
  const cleanMessage = originalMessage.replace(/["""''`?!.,\\\-]/g, '').trim();
  const cleanLower = cleanMessage.toLowerCase();
  
  // חיפוש התאמה מדויקת לשאלה (אחרי ניקוי)
  for (const item of allQuestions) {
    const cleanQ = item.question.replace(/["""''`?!.,\\\-]/g, '').trim();
    if (cleanMessage === cleanQ) {
      return addSourceLinksToAnswer(item.answer);
    }
  }
  
  // חיפוש התאמה לשאלה המקורית
  for (const item of allQuestions) {
    if (originalMessage === item.question) {
      return addSourceLinksToAnswer(item.answer);
    }
  }
  
  // חיפוש לפי כותרת ההמלצה (למשל "מה זה כרטיס ניווט")
  const titleMatch = cleanLower.match(/מה זה (.+)/);
  if (titleMatch) {
    const searchTitle = titleMatch[1].trim();
    
    // חיפוש התאמה מדויקת לכותרת
    for (const item of allQuestions) {
      // מחלץ את הכותרת מהשאלה
      const itemClean = item.question.replace(/["""''`?!.,\\\-]/g, '').trim().toLowerCase();
      const itemTitleMatch = itemClean.match(/מה זה (.+)/);
      if (itemTitleMatch) {
        const itemTitle = itemTitleMatch[1].trim();
        if (itemTitle === searchTitle) {
          return addSourceLinksToAnswer(item.answer);
        }
      }
    }
  }
  
  // חיפוש לפי מילות מפתח - רק אם יש התאמה גבוהה
  let bestMatch = null;
  let bestMatchScore = 0;
  let bestMatchTotalWords = 0;
  
  for (const item of allQuestions) {
    const qWords = item.question.split(/[\s,?.!"'"]+/).filter(w => w.length > 2);
    const inputWords = cleanLower.split(/[\s,?.!"'"]+/).filter(w => w.length > 2);
    
    // מילים לפילטור - מילים כלליות מדי
    const stopWords = ['מה', 'זה', 'איך', 'למה', 'מתי', 'איפה', 'האם', 'של', 'את', 'על', 'עם', 'בו', 'לו', 'הוא', 'היא'];
    const filteredInputWords = inputWords.filter(w => !stopWords.includes(w));
    const filteredQWords = qWords.filter(w => !stopWords.includes(w));
    
    let matchScore = 0;
    let exactMatches = 0;
    
    for (const word of filteredInputWords) {
      // התאמה מדויקת
      if (filteredQWords.includes(word)) {
        matchScore += 3;
        exactMatches++;
      }
      // התאמה חלקית
      else if (filteredQWords.some(qw => qw.includes(word) && word.length > 3)) {
        matchScore += 1;
      }
    }
    
    // מחשבים יחס התאמה - צריך שלפחות 50% מהמילים יתאימו
    const matchRatio = filteredInputWords.length > 0 ? exactMatches / filteredInputWords.length : 0;
    
    if (matchScore > bestMatchScore && matchRatio >= 0.5) {
      bestMatchScore = matchScore;
      bestMatch = item;
      bestMatchTotalWords = filteredInputWords.length;
    }
  }
  
  // דרישת סף גבוהה יותר - לפחות 2 התאמות מדויקות או יחס גבוה
  if (bestMatch && bestMatchScore >= 4) {
    return addSourceLinksToAnswer(bestMatch.answer);
  }
  
  // חיפוש בהמלצות הפדגוגיות (PEDAGOGICAL_RECOMMENDATIONS) עם התאמה מדויקת יותר
  const recMatch = searchPedagogicalRecommendations(cleanLower);
  if (recMatch) {
    return recMatch;
  }
  
  // תשובת ברירת מחדל
  return `לא מצאתי תשובה ספציפית לשאלה שלך על "${cleanMessage}".\n\n**💡 הצעות:**\n• נסי לשאול בצורה יותר ספציפית, למשל: "מה זה כרטיס ניווט?"\n• בחרי קטגוריה למעלה לצפייה בשאלות מוכנות\n• בדקי בתוכנית הכיתתית את ההמלצות המלאות`;
}

// פונקציה לחיפוש בהמלצות הפדגוגיות
function searchPedagogicalRecommendations(searchText) {
  const searchWords = searchText.split(/[\s,?.!"'"]+/).filter(w => w.length > 2);
  const stopWords = ['מה', 'זה', 'איך', 'למה', 'מתי', 'איפה', 'האם', 'של', 'את', 'על', 'עם'];
  const filteredSearchWords = searchWords.filter(w => !stopWords.includes(w));
  
  let bestMatch = null;
  let bestScore = 0;
  
  const domainNames = {
    language: '📖 שפה ואוריינות',
    math: '🔢 מתמטיקה',
    english: '🔤 אנגלית',
    emotional: '💚 רגשי',
    behavioral: '🎭 התנהגותי',
    social: '🤝 חברתי',
    attention: '⚡ קשב וריכוז',
    motor: '🏃 תנועתי-חושי',
    motivation: '🎯 מוטיבציה'
  };
  
  // חיפוש ב-PEDAGOGICAL_RECOMMENDATIONS
  for (const [domainKey, domain] of Object.entries(PEDAGOGICAL_RECOMMENDATIONS)) {
    const allRecs = [...(domain.universal || []), ...(domain.targeted || []), ...(domain.intensive || [])];
    
    for (const rec of allRecs) {
      const titleWords = rec.title.toLowerCase().split(/[\s,?.!"'"]+/).filter(w => w.length > 2);
      
      let score = 0;
      let exactTitleMatches = 0;
      
      // בדיקת התאמה מדויקת לכותרת
      for (const word of filteredSearchWords) {
        if (titleWords.includes(word)) {
          score += 5;
          exactTitleMatches++;
        } else if (titleWords.some(tw => tw.includes(word) && word.length > 3)) {
          score += 2;
        }
      }
      
      // רק אם יש לפחות התאמה אחת מדויקת לכותרת
      if (score > bestScore && exactTitleMatches >= 1) {
        bestScore = score;
        bestMatch = { type: 'rec', rec, domain, domainKey, domainNames };
      }
    }
  }
  
  // חיפוש ב-ADDITIONAL_PRACTICES
  for (const [key, practice] of Object.entries(ADDITIONAL_PRACTICES)) {
    const titleWords = practice.title.toLowerCase().split(/[\s,?.!"'"]+/).filter(w => w.length > 2);
    
    let score = 0;
    let exactTitleMatches = 0;
    
    for (const word of filteredSearchWords) {
      if (titleWords.includes(word)) {
        score += 5;
        exactTitleMatches++;
      } else if (titleWords.some(tw => tw.includes(word) && word.length > 3)) {
        score += 2;
      }
    }
    
    if (score > bestScore && exactTitleMatches >= 1) {
      bestScore = score;
      bestMatch = { type: 'practice', practice };
    }
  }
  
  if (bestMatch && bestScore >= 5) {
    if (bestMatch.type === 'rec') {
      const { rec, domain, domainKey, domainNames } = bestMatch;
      let response = `**${rec.title}**\n\n`;
      response += `📝 **תיאור:** ${rec.description}\n\n`;
      response += `⏱️ **תדירות:** ${rec.frequency}\n`;
      response += `🎯 **עקרון UDL:** ${rec.udlPrinciple}\n`;
      
      if (rec.tools && rec.tools.length > 0) {
        response += `🛠️ **כלים:** ${rec.tools.join(', ')}\n`;
      }
      
      if (rec.source) {
        response += `📚 **מקור:** ${rec.source}\n`;
        // הוספת קישורים להורדה
        const sourceLinks = SOURCE_LINKS[rec.source];
        if (sourceLinks) {
          response += `\n📥 **הורדת הגליון:**\n`;
          response += `• [עברית](${sourceLinks.he})\n`;
          response += `• [ערבית](${sourceLinks.ar})\n`;
        }
      }
      
      response += `\n📂 **תחום:** ${domainNames[domainKey] || domain.name}`;
      
      return response;
    } else if (bestMatch.type === 'practice') {
      const { practice } = bestMatch;
      let response = `**${practice.title}**\n\n`;
      response += `📝 **תיאור:** ${practice.description}\n\n`;
      response += practice.details;
      response += `\n\n📂 **תחום:** ${practice.domain} | **${practice.tier}**`;
      
      return response;
    }
  }
  
  return null;
}

function attachEventListeners() {
  const fileInput = document.getElementById('fileInput');
  if (fileInput) {
    fileInput.addEventListener('change', handleFileUpload);
  }
}

async function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  const errorMsg = document.getElementById('errorMsg');
  const uploadBtn = document.getElementById('uploadBtn');
  
  try {
    uploadBtn.innerHTML = '<div class="loader mx-auto"></div><span class="mr-3">קורא את הקובץ...</span>';
    
    const fileName = file.name.toLowerCase();
    let rows;
    
    if (fileName.endsWith('.csv')) {
      const text = await file.text();
      rows = parseCSV(text);
    } else if (fileName.endsWith('.xls') || fileName.endsWith('.xlsx')) {
      const arrayBuffer = await file.arrayBuffer();
      rows = parseExcel(arrayBuffer);
    } else {
      throw new Error('פורמט לא נתמך. השתמשי ב-CSV, XLS או XLSX');
    }
    
    const students = processOgenData(rows);
    if (students && students.length > 0) {
      appState.students = students;
      render();
    } else {
      throw new Error('לא נמצאו תלמידים בקובץ. ודאי שזה קובץ מכלי העוגן.');
    }
  } catch (err) {
    errorMsg.querySelector('p').textContent = err.message;
    errorMsg.classList.remove('hidden');
    uploadBtn.innerHTML = '<span class="text-2xl">📁</span><span class="text-xl">טעינת קובץ (CSV / XLS / XLSX)</span>';
  }
}

function prepareContentForExport(content) {
  // Clone the content
  const clone = content.cloneNode(true);
  
  // Replace select/input with their values in resource cells
  clone.querySelectorAll('.resource-cell').forEach(cell => {
    const key = cell.dataset.key;
    const saved = appState.resourceInputs[key] || {};
    const provider = saved.provider === 'אחר' ? (saved.otherProvider || 'אחר') : (saved.provider || '');
    const hours = saved.hours || '';
    const display = provider ? provider + (hours ? ' - ' + hours + ' שעות' : '') : '-';
    
    // Replace entire cell content with just the display text
    cell.innerHTML = `<span class="resource-display">${display}</span>`;
  });
  
  // Replace students cells
  clone.querySelectorAll('.students-cell').forEach(cell => {
    const key = cell.dataset.key;
    const saved = appState.resourceInputs[key] || {};
    const studentsList = cell.querySelector('.students-list');
    const baseStudentsText = studentsList ? studentsList.textContent : '';
    const baseStudents = baseStudentsText.split(',').map(s => s.trim()).filter(s => s);
    
    // הסרת תלמידים
    const removedStudents = (saved.removedStudents || '').split(',').map(s => s.trim()).filter(s => s);
    const filteredStudents = baseStudents.filter(name => !removedStudents.includes(name));
    
    // הוספת תלמידים
    const additionalStudents = (saved.additionalStudents || '').split(',').map(s => s.trim()).filter(s => s);
    const finalStudents = [...filteredStudents, ...additionalStudents];
    
    const display = finalStudents.join(', ') || '-';
    
    // Replace entire cell content with just the display text
    cell.innerHTML = `<span class="students-display">${display}</span>`;
  });
  
  // Replace notes cells
  clone.querySelectorAll('.notes-cell').forEach(cell => {
    const key = cell.dataset.key;
    const saved = appState.resourceInputs[key] || {};
    const notes = saved.notes || '';
    
    // Replace entire cell content
    if (notes) {
      cell.innerHTML = `<div><strong>📝 הערות:</strong> ${notes}</div>`;
    } else {
      cell.innerHTML = `<span>-</span>`;
    }
  });
  
  return clone.innerHTML;
}

function exportToWord() {
  const content = document.getElementById('summaryTableContent');
  if (!content) return;
  
  const html = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="UTF-8"><style>
      body { direction: rtl; font-family: 'David', 'Segoe UI', sans-serif; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #000; padding: 5px; }
      th { background: #e5e7eb; }
    </style></head>
    <body>${prepareContentForExport(content)}</body>
    </html>
  `;
  
  const blob = new Blob(['\\ufeff', html], { type: 'application/msword' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'טבלת_מענים_מסכמת.doc';
  link.click();
}

function askQuestion(q) {
  // הוספת השאלה ישירות להודעות ושליחה
  appState.chatMessages.push({ role: 'user', content: q });
  
  // יצירת תשובה
  const lower = q.toLowerCase();
  let response = generateResponse(lower, q);
  
  appState.chatMessages.push({ role: 'assistant', content: response });
  render();
  
  setTimeout(() => {
    const chatDiv = document.getElementById('chatMessages');
    if (chatDiv) chatDiv.scrollTop = chatDiv.scrollHeight;
  }, 100);
}

function handleChatKey(e) {
  if (e.key === 'Enter') {
    sendChat();
  }
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const message = input ? input.value.trim() : '';
  if (!message) return;
  
  // ניקוי שדה הקלט
  if (input) input.value = '';
  
  appState.chatMessages.push({ role: 'user', content: message });
  
  // יצירת תשובה
  const lower = message.toLowerCase();
  let response = generateResponse(lower, message);
  
  appState.chatMessages.push({ role: 'assistant', content: response });
  render();
  
  // גלילה למטה
  setTimeout(() => {
    const chatDiv = document.getElementById('chatMessages');
    if (chatDiv) chatDiv.scrollTop = chatDiv.scrollHeight;
  }, 100);
}
