function renderRemoteByPopulation(students) {
  if (!students || students.length === 0) return '';
  
  const bp = REMOTE_LEARNING_RECOMMENDATIONS.byPopulation;
  
  // מיפוי תלמידים לאוכלוסיות
  const giftedStudents = students.filter(s => detectStudentRemoteProfile(s).includes('gifted'));
  const olimStudents = students.filter(s => detectStudentRemoteProfile(s).includes('olim'));
  const disabStudents = students.filter(s => {
    const p = detectStudentRemoteProfile(s);
    return p.some(k => ['physical','autism','hearingImpaired','learningDisabilities'].includes(k));
  });
  const attentionStudents = students.filter(s => detectStudentRemoteProfile(s).includes('attentionDifficulties'));
  const atRiskStudents = students.filter(s => detectStudentRemoteProfile(s).includes('atRisk'));
  
  const hasAny = giftedStudents.length || olimStudents.length || disabStudents.length || attentionStudents.length || atRiskStudents.length;
  if (!hasAny) return '';
  
  let rh = '<div class="mt-6 border-t border-sky-200 pt-4">';
  rh += '<h4 class="font-bold text-slate-700 mb-3">🎯 המלצות מרחוק לפי אוכלוסיות בכיתה</h4>';
  
  // מחוננים
  if (giftedStudents.length > 0) {
    const g = bp.gifted;
    rh += '<div class="mb-4 bg-violet-50 rounded-xl p-4 border border-violet-200">';
    rh += '<h5 class="font-bold text-violet-800 text-sm mb-2">🌟 מחוננים ומצטיינים — ' + giftedStudents.map(s=>s.name).join(', ') + '</h5>';
    rh += '<div class="grid md:grid-cols-2 gap-2">';
    g.universal.forEach(r => { rh += '<div class="bg-white rounded p-2 border border-violet-100 text-xs"><strong>' + r.title + '</strong> — ' + r.description.substring(0,120) + '...</div>'; });
    g.emotional.forEach(r => { rh += '<div class="bg-white rounded p-2 border border-violet-100 text-xs"><strong>💜 ' + r.title + '</strong> — ' + r.description.substring(0,120) + '...</div>'; });
    rh += '</div></div>';
  }
  
  // עולים
  if (olimStudents.length > 0) {
    const o = bp.olim;
    rh += '<div class="mb-4 bg-emerald-50 rounded-xl p-4 border border-emerald-200">';
    rh += '<h5 class="font-bold text-emerald-800 text-sm mb-2">🌍 עולים חדשים — ' + olimStudents.map(s=>s.name).join(', ') + '</h5>';
    rh += '<div class="grid md:grid-cols-2 gap-2">';
    o.universal.forEach(r => { rh += '<div class="bg-white rounded p-2 border border-emerald-100 text-xs"><strong>' + r.title + '</strong> — ' + r.description.substring(0,120) + '...</div>'; });
    o.social.forEach(r => { rh += '<div class="bg-white rounded p-2 border border-emerald-100 text-xs"><strong>🤝 ' + r.title + '</strong> — ' + r.description.substring(0,120) + '...</div>'; });
    rh += '</div></div>';
  }
  
  // קשב
  if (attentionStudents.length > 0) {
    rh += '<div class="mb-4 bg-amber-50 rounded-xl p-4 border border-amber-200">';
    rh += '<h5 class="font-bold text-amber-800 text-sm mb-2">⚡ קשב וריכוז — ' + attentionStudents.map(s=>s.name).join(', ') + '</h5>';
    rh += '<div class="grid md:grid-cols-2 gap-2">';
    REMOTE_ATTENTION_RECS.forEach(r => { rh += '<div class="bg-white rounded p-2 border border-amber-100 text-xs"><strong>' + r.title + '</strong> — ' + r.description.substring(0,120) + '...</div>'; });
    rh += '</div></div>';
  }
  
  // מוגבלויות
  if (disabStudents.length > 0) {
    rh += '<div class="mb-4 bg-blue-50 rounded-xl p-4 border border-blue-200">';
    rh += '<h5 class="font-bold text-blue-800 text-sm mb-2">♿ תלמידים עם מוגבלויות — ' + disabStudents.map(s=>s.name).join(', ') + '</h5>';
    disabStudents.forEach(student => {
      const profile = detectStudentRemoteProfile(student);
      const disabTypes = profile.filter(k => ['physical','autism','hearingImpaired','learningDisabilities'].includes(k));
      const typeNames = { physical: 'מוגבלות פיזית', autism: 'אוטיזם / ספקטרום', hearingImpaired: 'לקות שמיעה', learningDisabilities: 'לקות למידה' };
      disabTypes.forEach(dt => {
        const drecs = bp.disabilities[dt];
        if (!drecs) return;
        rh += '<div class="mb-2"><span class="text-xs font-bold text-blue-700 bg-blue-100 px-2 py-0.5 rounded">' + student.name + ' — ' + typeNames[dt] + '</span>';
        rh += '<div class="mt-1 grid md:grid-cols-2 gap-2">';
        drecs.forEach(r => { rh += '<div class="bg-white rounded p-2 border border-blue-100 text-xs"><strong>' + r.title + '</strong> — ' + r.description.substring(0,120) + '...</div>'; });
        rh += '</div></div>';
      });
    });
    rh += '</div>';
  }
  
  // בסיכון
  if (atRiskStudents.length > 0) {
    rh += '<div class="mb-4 bg-rose-50 rounded-xl p-4 border border-rose-200">';
    rh += '<h5 class="font-bold text-rose-800 text-sm mb-2">🆘 תלמידים בסיכון — ' + atRiskStudents.map(s=>s.name).join(', ') + '</h5>';
    rh += '<div class="grid md:grid-cols-2 gap-2">';
    REMOTE_AT_RISK_RECS.forEach(r => { rh += '<div class="bg-white rounded p-2 border border-rose-100 text-xs"><strong>' + r.title + '</strong> — ' + r.description.substring(0,120) + '...</div>'; });
    rh += '</div></div>';
  }
  
  rh += '</div>';
  return rh;
}


function collapseAllIndividual(studentId) {
  // סגירת הסקשנים הראשיים
  ['ind-ped-', 'ind-str-', 'ind-remote-'].forEach(prefix => {
    const id = prefix + studentId;
    const el = document.getElementById(id);
    const arrow = document.getElementById('arrow-' + id);
    if (el) { el.style.display = 'none'; }
    if (arrow) { arrow.textContent = '▶'; }
  });
  // אפוס expandedRecs של drill-downs לתלמיד זה
  Object.keys(appState.expandedRecs).forEach(key => {
    if (key.startsWith('ped-' + studentId + '-')) {
      appState.expandedRecs[key] = false;
    }
  });
  render();
}

function collapseAllSections() {
  ['sec-remote', 'sec-learning', 'sec-emotional', 'sec-gifted'].forEach(id => {
    const el = document.getElementById(id);
    const arrow = document.getElementById('arrow-' + id);
    if (el) { el.style.display = 'none'; }
    if (arrow) { arrow.textContent = '▶'; }
  });
}

function toggleSection(id) {
  // שמור מצב ב-appState כדי שלא יאבד בעת render()
  if (!appState.openSections) appState.openSections = {};
  appState.openSections[id] = !appState.openSections[id];
  
  // עדכן DOM ישירות (ללא render מלא)
  const el = document.getElementById(id);
  const arrow = document.getElementById('arrow-' + id);
  if (el) {
    el.style.display = appState.openSections[id] ? 'block' : 'none';
    if (arrow) arrow.textContent = appState.openSections[id] ? '▼' : '▶';
  }
}

function getSectionDisplay(id) {
  if (!appState.openSections) return 'none';
  return appState.openSections[id] ? 'block' : 'none';
}

function getSectionArrow(id) {
  if (!appState.openSections) return '▶';
  return appState.openSections[id] ? '▼' : '▶';
}

function renderSummaryTable(domains) {
  try {
    if (!appState.resourceInputs) appState.resourceInputs = {};
  const students = appState.students;
  const resourceOptions = ['מחנכת', 'מורת שילוב', 'מורת רוחב', 'שעות פרטניות', 'קלינאית תקשורת', 'פסיכולוגית', 'יועצת', 'מטפלת באומנות', 'אחר'];
  
  // תחומים לא-לימודיים לרובד אוניברסלי
  const nonAcademicDomains = domains.filter(d => d.type === 'emotional');
  
  // תחומים לימודיים
  const academicDomains = domains.filter(d => d.type === 'learning');
  
  // פונקציה לקבלת המלצות לפי תחום ורובד
  const getRecommendations = (domainKey, tier) => {
    const recs = PEDAGOGICAL_RECOMMENDATIONS[domainKey];
    if (!recs || !recs[tier]) return [];
    return recs[tier].slice(0, 3).map(r => r.title);
  };
  
  // פונקציה לקבלת קשיים ותלמידים בתחום - מחולק לפי רובד מהעוגן
  const getDifficultiesByTier = (domain) => {
    const result = {
      universal: { difficulties: [], students: [] },
      targeted: { difficulties: [], students: [] },
      intensive: { difficulties: [], students: [] }
    };
    
    const allDifficulties = new Set();
    
    students.forEach(s => {
      if (s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד') {
        // בדיקה לאיזה רובד התלמיד שייך לפי נתוני העוגן
        let tier = 'universal';
        if (s.interventions) {
          if (s.interventions[domain.intensiveKey]) {
            tier = 'intensive';
          } else if (s.interventions[domain.groupedKey]) {
            tier = 'targeted';
          }
        }
        
        // הוספת התלמיד לרובד המתאים
        if (!result[tier].students.includes(s.name)) {
          result[tier].students.push(s.name);
        }
        
        // הוספת הקשיים של התלמיד
        if (s.details && s.details[domain.scoreKey]) {
          s.details[domain.scoreKey].split('\\n').filter(d => d.trim()).forEach(detail => {
            const clean = detail.replace(/^-\\s*/, '').trim();
            if (clean) {
              allDifficulties.add(clean);
              if (!result[tier].difficulties.includes(clean)) {
                result[tier].difficulties.push(clean);
              }
            }
          });
        }
      }
    });
    
    return result;
  };
  
  // פונקציה ליצירת שורת משאבים עם ערכים מוצגים להדפסה
  const renderResourceCell = (key, existingResource = '') => {
    const saved = appState.resourceInputs[key] || { provider: '', hours: '', otherProvider: '', additionalStudents: '' };
    const displayProvider = saved.provider === 'אחר' ? saved.otherProvider : saved.provider;
    const displayHours = saved.hours;
    
    return `
      <div class="space-y-2 resource-cell" data-key="${key}">
        ${existingResource ? `<div class="text-xs text-slate-500 mb-1">מהעוגן: ${existingResource}</div>` : ''}
        <select onchange="updateResourceInput('${key}', 'provider', this.value); this.nextElementSibling.style.display = this.value === 'אחר' ? 'block' : 'none';" 
          class="resource-select w-full text-xs border border-slate-300 rounded px-2 py-1 bg-white">
          <option value="">בחרו גורם...</option>
          ${resourceOptions.map(opt => `<option value="${opt}" ${saved.provider === opt ? 'selected' : ''}>${opt}</option>`).join('')}
        </select>
        <input type="text" placeholder="פרטי גורם אחר" value="${saved.otherProvider || ''}"
          onchange="updateResourceInput('${key}', 'otherProvider', this.value)"
          class="resource-other w-full text-xs border border-slate-300 rounded px-2 py-1 ${saved.provider === 'אחר' ? '' : 'hidden'}" 
          style="${saved.provider === 'אחר' ? '' : 'display:none'}" />
        <input type="text" placeholder="שעות שבועיות" value="${saved.hours || ''}"
          onchange="updateResourceInput('${key}', 'hours', this.value)"
          class="resource-hours w-full text-xs border border-slate-300 rounded px-2 py-1" />
        <span class="resource-display hidden print-only text-xs">${displayProvider ? displayProvider + (displayHours ? ' - ' + displayHours + ' שעות' : '') : ''}</span>
      </div>
    `;
  };
  
  // פונקציה ליצירת תא תלמידים עם אפשרות להוספה והסרה
  const renderStudentsCell = (key, studentNames) => {
    const saved = appState.resourceInputs[key] || {};
    const additionalStudents = saved.additionalStudents || '';
    const removedStudents = saved.removedStudents || '';
    const removedList = removedStudents.split(',').map(s => s.trim()).filter(s => s);
    
    // סינון תלמידים שהוסרו
    const filteredStudents = studentNames.filter(name => !removedList.includes(name));
    
    // הוספת תלמידים נוספים
    const addedList = additionalStudents.split(',').map(s => s.trim()).filter(s => s);
    const finalStudents = [...filteredStudents, ...addedList];
    
    return `
      <div class="students-cell" data-key="${key}">
        <div class="students-list">${filteredStudents.join(', ')}</div>
        <div class="mt-1 space-y-1">
          <input type="text" placeholder="➕ הוסיפי תלמידים (מופרדים בפסיק)" value="${additionalStudents}"
            onchange="updateResourceInput('${key}', 'additionalStudents', this.value)"
            class="additional-students w-full text-xs border border-green-300 rounded px-2 py-1 bg-green-50" />
          <input type="text" placeholder="➖ הסירי תלמידים (מופרדים בפסיק)" value="${removedStudents}"
            onchange="updateResourceInput('${key}', 'removedStudents', this.value)"
            class="removed-students w-full text-xs border border-red-300 rounded px-2 py-1 bg-red-50" />
        </div>
        <span class="students-display hidden print-only text-xs">${finalStudents.join(', ')}</span>
      </div>
    `;
  };
  
  // פונקציה ליצירת שדה הערות
  const renderNotesField = (key) => {
    const saved = appState.resourceInputs[key] || {};
    const notes = saved.notes || '';
    return `
      <div class="notes-cell mt-4 p-3 bg-slate-50 rounded-lg border border-slate-200" data-key="${key}">
        <label class="text-sm font-medium text-slate-700 block mb-2">📝 הערות:</label>
        <textarea 
          placeholder="הערות נוספות..."
          onchange="updateResourceInput('${key}', 'notes', this.value)"
          class="notes-input w-full text-sm border border-slate-300 rounded px-3 py-2 min-h-[60px]">${notes}</textarea>
        <span class="notes-display hidden print-only text-sm">${notes}</span>
      </div>
    `;
  };
  
  // בניית טבלת תחום לימודי - מחולק לרבדים
  const renderAcademicDomainTable = (domain) => {
    // פונקציה לפיצול קשיים מטקסט
    const parseDifficulties = (text) => {
      if (!text) return [];
      // פיצול לפי שורות חדשות, מקפים או פסיקים
      return text
        .split(/[\n,]/)
        .flatMap(part => part.split(/\s*-\s*/))
        .map(d => d.trim())
        .filter(d => d.length > 0);
    };
    
    // איסוף כל הקשיים הייחודיים (ללא כפילויות) מתלמידים מתקשים
    const allDifficultiesSet = new Set();
    
    students.forEach(s => {
      if (s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד') {
        // איסוף קשיים
        if (s.details && s.details[domain.scoreKey]) {
          parseDifficulties(s.details[domain.scoreKey]).forEach(diff => {
            allDifficultiesSet.add(diff);
          });
        }
      }
    });
    
    // איסוף תלמידים לפי רובד - כמו בתוכנית הכיתתית (לא תלוי בציון)
    const targetedStudents = students.filter(s => 
      s.interventions && s.interventions[domain.groupedKey]
    );
    const intensiveStudents = students.filter(s => 
      s.interventions && s.interventions[domain.intensiveKey]
    );
    
    const allDifficulties = [...allDifficultiesSet];
    
    if (allDifficulties.length === 0 && targetedStudents.length === 0 && intensiveStudents.length === 0) {
      return `
        <div class="bg-emerald-50 rounded-lg p-4 text-center text-emerald-700">
          ✓ אין תלמידים מתקשים בתחום זה
        </div>
      `;
    }
    
    let html = '<div class="space-y-4">';
    
    // רובד אוניברסלי - כל הקשיים ביחד (ללא כפילויות)
    if (allDifficulties.length > 0) {
      const uniRecs = getRecommendations(domain.key, 'universal');
      const uniKey = `${domain.key}-universal`;
      // איסוף שמות התלמידים המתקשים בתחום - אלו שבגינם ניתן המענה האוניברסלי
      const strugglingInDomain = students.filter(s => 
        s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד'
      ).map(s => s.name);
      html += `
        <div class="bg-blue-50 rounded-lg p-4 border border-blue-200">
          <div class="flex items-center gap-2 mb-3">
            <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-medium">🌐 רובד אוניברסלי</span>
          </div>
          <table class="w-full border-collapse text-sm">
            <thead>
              <tr class="bg-blue-100">
                <th class="border border-blue-200 px-3 py-2 text-right font-bold">קשיים בתחום</th>
                <th class="border border-blue-200 px-3 py-2 text-right font-bold">תלמידים שבגינם ניתן המענה</th>
                <th class="border border-blue-200 px-3 py-2 text-right font-bold">המלצות פדגוגיות</th>
                <th class="border border-blue-200 px-3 py-2 text-right font-bold">משאבים</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="border border-blue-200 px-3 py-2 text-xs">${allDifficulties.join(', ')}</td>
                <td class="border border-blue-200 px-3 py-2">${strugglingInDomain.length > 0 ? renderStudentsCell(uniKey + '-students', strugglingInDomain) : '-'}</td>
                <td class="border border-blue-200 px-3 py-2 text-xs">${[...uniRecs, 'הוראה מפורשת וישירה'].join(', ')}</td>
                <td class="border border-blue-200 px-3 py-2">${renderResourceCell(uniKey)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }
    
    // רובד ממוקד - כל התלמידים ברובד זה
    if (targetedStudents.length > 0) {
      const tarRecs = getRecommendations(domain.key, 'targeted');
      
      // בתחום שפה - פיצול לקבוצות לפי נושא עבודה
      if (domain.key === 'language') {
        // קשיים הקשורים לקריאה
        const readingKeywords = ['קריאה', 'פענוח', 'שטף', 'קצב קריאה', 'דיוק בקריאה'];
        
        // חלוקת תלמידים וקשיים לקבוצות
        const readingGroup = { students: new Set(), difficulties: new Set() };
        const otherGroup = { students: new Set(), difficulties: new Set() };
        
        targetedStudents.forEach(s => {
          if (s.details && s.details[domain.scoreKey]) {
            const studentDiffs = parseDifficulties(s.details[domain.scoreKey]);
            let hasReading = false;
            let hasOther = false;
            
            studentDiffs.forEach(diff => {
              const isReading = readingKeywords.some(kw => diff.includes(kw));
              if (isReading) {
                readingGroup.difficulties.add(diff);
                hasReading = true;
              } else {
                otherGroup.difficulties.add(diff);
                hasOther = true;
              }
            });
            
            if (hasReading) readingGroup.students.add(s.name);
            if (hasOther) otherGroup.students.add(s.name);
            
            // אם אין קשיים ספציפיים, הוסף לקבוצת "אחר"
            if (!hasReading && !hasOther) {
              otherGroup.students.add(s.name);
            }
          } else {
            // תלמיד ללא פירוט קשיים - הוסף לקבוצת "אחר"
            otherGroup.students.add(s.name);
          }
        });
        
        html += `

                    ${rows.map(row => `

                    ${generalIntensive.length > 0 ? `

              ${renderNotesField('emotional-intensive-notes')}

            <div class="text-center mt-4 mb-2">
            </div>
          </div>
        </div>
        <div class="border-b border-slate-200">

          </div>

        <!-- רובד אוניברסלי — מחוננים ומצטיינים -->
        ${(() => {
          const giftedStudents = students.filter(s => {
            const pop = (s.specialPopulation || '').toLowerCase();
            return pop.includes('מחונן') || pop.includes('מצטיין') || pop.includes('מצוין');
          });
          if (giftedStudents.length === 0) return '';
          
          const giftedNames = giftedStudents.map(s => s.name);
          const giftedRecs = [

            'הכרת Overexcitabilities (דברובסקי)',
            'עידוד Growth Mindset',
            'ליווי רגשי ממוקד'

          return `
            <div class="p-6 border-b border-slate-200">
              <h3 class="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2">
                <span class="bg-violet-100 text-violet-700 px-3 py-1 rounded-full text-sm">🎓 מענים למחוננים ומצטיינים</span>
                <span>מענים לתלמידים מחוננים ומצטיינים</span>

              ${(() => {

                });
                let remH = '';
                
                // מחוננים - שורת מרחוק

                  bp.gifted.emotional.forEach(r => { remH += '<li>• 💜 <strong>' + r.title + '</strong> — ' + r.description.substring(0,150) + '...</li>'; });

                  remH += '<p class="text-xs text-slate-600 mb-1">תלמידים: ' + olimStudents.map(s=>s.name).join(', ') + '</p>';
                  remH += '<ul class="text-xs text-slate-700 space-y-1">';
                  bp.olim.universal.forEach(r => { remH += '<li>• <strong>' + r.title + '</strong> — ' + r.description.substring(0,150) + '...</li>'; });
                  bp.olim.social.forEach(r => { remH += '<li>• 🤝 <strong>' + r.title + '</strong> — ' + r.description.substring(0,150) + '...</li>'; });

function renderClassroomPlan() {
  const allPlanDomains = [
    { key: 'language', name: 'שפה ואוריינות', icon: '📖', scoreKey: 'שפה', type: 'learning', groupedKey: 'learningGroupedLanguage', intensiveKey: 'learningIntensiveLanguage' },
    { key: 'math', name: 'מתמטיקה', icon: '🔢', scoreKey: 'מתמטיקה', type: 'learning', groupedKey: 'learningGroupedMath', intensiveKey: 'learningIntensiveMath' },
    { key: 'english', name: 'אנגלית', icon: '🔤', scoreKey: 'אנגלית', type: 'learning', groupedKey: 'learningGroupedEnglish', intensiveKey: 'learningIntensiveEnglish' },
    { key: 'motivation', name: 'מוטיבציה והרגלי למידה', icon: '🎯', scoreKey: 'מוטיבציה', type: 'emotional' },
    { key: 'emotional', name: 'רגשי', icon: '💚', scoreKey: 'רגשי', type: 'emotional' },
    { key: 'behavioral', name: 'התנהגותי', icon: '🎭', scoreKey: 'התנהגותי', type: 'emotional' },
    { key: 'social', name: 'חברתי', icon: '🤝', scoreKey: 'חברתי', type: 'emotional' },
    { key: 'attention', name: 'קשב וריכוז', icon: '⚡', scoreKey: 'קשב', type: 'emotional' },
    { key: 'motor', name: 'תנועתי-חושי-מרחבי', icon: '🏃', scoreKey: 'תנועתי', type: 'emotional' }
  ];
  // סנן תנועתי לעל-יסודי
  const domains = appState.schoolType === 'יסודי' ? allPlanDomains : allPlanDomains.filter(d => d.key !== 'motor');

  // אם מוצגת טבלה מסכמת
  if (appState.showSummaryTable) {
    return renderSummaryTable(domains);
  }

  // אם לא נבחר תחום, הצג את כפתורי הבחירה
  if (!appState.selectedDomain) {
    return `
      <div class="animate-fadeIn space-y-6">
        <!-- כפתור טבלה מסכמת -->
        <div class="flex justify-center">
          <button onclick="toggleSummaryTable()" 
            class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition-all flex items-center gap-3">
            <span class="text-2xl">📊</span>
            <span>טבלת מענים מסכמת להדפסה</span>
          </button>
        </div>
        
        <div class="bg-white rounded-2xl shadow-lg p-8 border border-slate-100">
          <h3 class="text-2xl font-bold text-slate-900 mb-6">📋 בחרו תחום לצפייה בתוכנית</h3>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
            ${domains.map(domain => {
              const recs = PEDAGOGICAL_RECOMMENDATIONS[domain.key];
              if (!recs) return '';
              
              const studentsWithDifficulty = appState.students.filter(s => 
                s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד'
              );
              
              const hasDifficulties = studentsWithDifficulty.length > 0;
              
              return `
                <button onclick="selectDomain('${domain.key}')"
                  class="py-5 px-4 rounded-xl transition-all shadow-sm hover:shadow-lg border-2 text-center ${hasDifficulties ? 'bg-gradient-to-br from-amber-50 to-orange-50 border-amber-300 hover:border-amber-400' : 'bg-gradient-to-br from-slate-50 to-white border-slate-200 hover:border-blue-300'}">
                  <div class="text-3xl mb-2">${domain.icon}</div>
                  <div class="font-bold text-slate-900 text-sm">${domain.name}</div>
                  ${hasDifficulties ? `<div class="text-xs text-amber-700 mt-1">⚠️ ${studentsWithDifficulty.length} תלמידים מתקשים</div>` : '<div class="text-xs text-slate-400 mt-1">✓ תקין</div>'}
                </button>
              `;
            }).join('')}

            <div class="text-center mt-4 mb-2">
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // תחום נבחר - הצג את התוכנית לתחום זה
  const domain = domains.find(d => d.key === appState.selectedDomain);
  if (!domain) return '';
  
  const recs = PEDAGOGICAL_RECOMMENDATIONS[domain.key];
  if (!recs) return '';
  
  const studentsWithDifficulty = appState.students.filter(s => 
    s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד'
  );
  
  let studentsGrouped = [];
  let studentsIntensive = [];
  
  if (domain.type === 'learning') {
    studentsGrouped = appState.students.filter(s => 
      s.interventions && s.interventions[domain.groupedKey]
    );
    studentsIntensive = appState.students.filter(s => 
      s.interventions && s.interventions[domain.intensiveKey]
    );
  } else {
    studentsGrouped = appState.students.filter(s => 
      (s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד') &&
      s.interventions && s.interventions.emotionalGrouped
    );
    studentsIntensive = appState.students.filter(s => 
      (s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד') &&
      s.interventions && s.interventions.emotionalIntensive
    );
  }

  return `
    <div class="space-y-6 animate-fadeIn">
      <!-- כפתור חזרה ובחירת תחום אחר -->
      <div class="flex items-center gap-4 flex-wrap">
        <button onclick="selectDomain(null)" 
          class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition-all flex items-center gap-2">
          <span>→</span> חזרה לכל התחומים
        </button>
        <div class="flex gap-2 flex-wrap">
          ${domains.map(d => {
            const isSelected = d.key === appState.selectedDomain;
            const dRecs = PEDAGOGICAL_RECOMMENDATIONS[d.key];
            if (!dRecs) return '';
            return `
              <button onclick="selectDomain('${d.key}')"
                class="py-1 px-3 rounded-full text-sm transition-all ${isSelected ? 'bg-blue-600 text-white' : 'bg-white border border-slate-200 hover:border-blue-300 text-slate-600'}">
                ${d.icon} ${d.name.split(' ')[0]}
              </button>
            `;
          }).join('')}
        </div>
      </div>
      
      <!-- תוכנית התחום הנבחר -->
      <div class="bg-white rounded-2xl shadow-lg p-8 border border-slate-100">
        <h3 class="text-2xl font-black text-slate-900 mb-4">${domain.icon} ${domain.name}</h3>
        
        ${studentsWithDifficulty.length > 0 ? `
          <div class="bg-slate-50 rounded-xl p-4 mb-6">
            <p class="text-sm font-bold text-slate-700 mb-2">תלמידים מתקשים בתחום זה (${studentsWithDifficulty.length}):</p>
            <p class="text-slate-600">${studentsWithDifficulty.map(s => s.name).join(', ')}</p>
          </div>
        ` : ''}
        
        <!-- המלצות פדגוגיות לתחום -->
        <div class="bg-gradient-to-br from-slate-50 to-white rounded-xl p-5 mb-5 border border-slate-200">
          <div class="flex items-center gap-2 mb-4 pb-3 border-b border-slate-200">
            <span class="text-lg">📋</span>
            <h4 class="font-bold text-slate-700 text-base">המלצות פדגוגיות — הוראה בכיתה</h4>
          </div>
          ${renderTier('🌐 רובד אוניברסלי - לכלל הכיתה', 'universal', recs.universal, domain.key, [])}
          ${renderTier('👥 רובד ממוקד - קבוצות קטנות', 'targeted', recs.targeted, domain.key, studentsGrouped)}
          ${renderTier('👤 רובד אינטנסיבי - פרטני', 'intensive', recs.intensive, domain.key, studentsIntensive)}
        </div>
        
        <!-- למידה מרחוק -->
        <div class="bg-gradient-to-r from-sky-50 to-cyan-50 rounded-xl p-4 mb-4 border border-sky-200">
          <div class="flex items-center gap-2 mb-3 pb-2 border-b border-sky-200">
            <span class="text-lg">🖥️</span>
            <h4 class="font-bold text-sky-800 text-base">למידה מרחוק — המלצות לתחום זה</h4>
          </div>
          ${(() => {
            const d = REMOTE_LEARNING_RECOMMENDATIONS.byDomain[domain.key];
            if (!d) return '<p class="text-sm text-slate-500">אין המלצות ספציפיות לתחום זה</p>';
            
            const tiers = [
              { key: 'remote-' + domain.key + '-universal', data: d.universal, label: '🌐 אוניברסלי — לכלל הכיתה', hdr: 'bg-blue-50 border-blue-200 text-blue-800', border: 'border-blue-200', students: [] },
              { key: 'remote-' + domain.key + '-targeted',  data: d.targeted,  label: '👥 ממוקד — קבוצות קטנות',   hdr: 'bg-amber-50 border-amber-200 text-amber-800', border: 'border-amber-200', students: studentsGrouped },
              { key: 'remote-' + domain.key + '-intensive', data: d.intensive, label: '👤 אינטנסיבי — פרטני',        hdr: 'bg-red-50 border-red-200 text-red-800', border: 'border-red-200', students: studentsIntensive }
            ];
            
            let h = '<div class="space-y-2">';
            tiers.forEach(t => {
              if (!t.data) return;
              const list = Array.isArray(t.data) ? t.data : [{ title: '', desc: t.data }];
              const isOpen = appState.expandedRecs[t.key];
              const studs = t.students || [];
              h += '<div class="rounded-lg border ' + t.border + ' overflow-hidden">';
              h += '<button onclick="toggleRec(\'' + t.key + '\')" class="w-full flex items-center justify-between px-4 py-2.5 ' + t.hdr + ' hover:opacity-90 transition-opacity text-right">';
              h += '<div class="flex items-center gap-3">';
              h += '<span class="font-bold text-sm">' + t.label + '</span>';
              if (studs.length > 0) {
                h += '<span class="text-xs bg-white/70 px-2 py-0.5 rounded-full border border-current opacity-70">' + studs.length + ' תלמידים</span>';
              }
              h += '</div>';
              h += '<span id="rec-arrow-' + t.key + '" class="text-sm">' + (isOpen ? '▲' : '▼') + '</span>';
              h += '</button>';
              h += '<div id="rec-content-' + t.key + '" style="' + (isOpen ? 'display:block' : 'display:none') + '">';
              if (studs.length > 0) {
                h += '<div class="bg-white/60 mx-3 mt-3 p-3 rounded-lg border ' + t.border + '">';
                h += '<span class="text-xs font-bold text-slate-700">תלמידים ברובד זה: </span>';
                h += '<span class="text-xs text-slate-600">' + studs.map(s => s.name).join(', ') + '</span>';
                h += '</div>';
              }
              h += '<div class="p-3 space-y-2">';
              list.forEach(item => {
                h += '<div class="bg-white rounded-lg p-3 border ' + t.border + '">';
                if (item.title) h += '<span class="font-bold text-xs text-slate-800">' + item.title + '</span><br>';
                h += '<span class="text-xs text-slate-600">' + (item.desc || item) + '</span>';
                h += '</div>';
              });
              h += '</div></div>';
              h += '</div>';
            });
            h += '</div>';
            return h;
          })()}
        </div>
        ${renderSmallGroupPractices()}
        ${renderExplicitTeaching()}
      </div>
      
      <!-- לחצני ניווט תחתית — כפילות של הראש -->

          class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition-all flex items-center gap-2">
          <span>→</span> חזרה לכל התחומים
        </button>
        <div class="flex gap-2 flex-wrap">
          ${domains.map(d => {
            const isSelected = d.key === appState.selectedDomain;
            const dRecs = PEDAGOGICAL_RECOMMENDATIONS[d.key];
            if (!dRecs) return '';
            return `
              <button onclick="selectDomain('${d.key}')"
                class="py-1 px-3 rounded-full text-sm transition-all ${isSelected ? 'bg-blue-600 text-white' : 'bg-white border border-slate-200 hover:border-blue-300 text-slate-600'}">
                ${d.icon} ${d.name.split(' ')[0]}
              </button>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

// פונקציה ליצירת המלצות מותאמות אישית לתלמיד
function getPersonalizedRecommendations(student, domain, score, domainMap) {
  const recKey = domainMap[domain];
  const recs = recKey && PEDAGOGICAL_RECOMMENDATIONS[recKey];
  if (!recs) return '';
  
  // חילוץ הקשיים הספציפיים של התלמיד
  const studentDifficulties = student.details[domain] 
    ? student.details[domain].split('\n').map(d => d.replace(/^-\s*/, '').trim().toLowerCase()).filter(d => d)
    : [];
  
  // חילוץ החוזקות של התלמיד
  const studentStrengths = student.strengths 
    ? student.strengths.split('\n').map(s => s.replace(/^-\s*/, '').trim().toLowerCase()).filter(s => s)
    : [];
  
  // התאמת המלצות לקשיים הספציפיים
  const matchedRecs = [];
  if (recs.difficulties) {
    const availableDifficulties = Object.keys(recs.difficulties);
    
    availableDifficulties.forEach(diffKey => {
      const diffKeyLower = diffKey.toLowerCase();
      const isMatch = studentDifficulties.some(sd => {
        // התאמות ישירות
        if (sd.includes(diffKeyLower) || diffKeyLower.includes(sd)) return true;
        // התאמות ספציפיות
        if (sd.includes('קריאה') && diffKeyLower.includes('קריאה')) return true;
        if (sd.includes('הבנה') && diffKeyLower.includes('הבנה')) return true;
        if (sd.includes('כתיב') && diffKeyLower.includes('כתיב')) return true;
        if (sd.includes('איות') && diffKeyLower.includes('איות')) return true;
        if ((sd.includes('קצב') || sd.includes('שטף')) && diffKeyLower.includes('קצב')) return true;
        if (sd.includes('דיוק') && diffKeyLower.includes('דיוק')) return true;
        if (sd.includes('אוצר מילים') && diffKeyLower.includes('אוצר')) return true;
        if (sd.includes('חשבון') && diffKeyLower.includes('חשבון')) return true;
        if (sd.includes('פעולות') && diffKeyLower.includes('פעולות')) return true;
        if (sd.includes('בעיות מילוליות') && diffKeyLower.includes('מילולי')) return true;
        if (sd.includes('שברים') && diffKeyLower.includes('שברים')) return true;
        if (sd.includes('ריכוז') && diffKeyLower.includes('קשב')) return true;
        if (sd.includes('קשב') && diffKeyLower.includes('קשב')) return true;
        return false;
      });
      if (isMatch) {
        matchedRecs.push({ key: diffKey, tips: recs.difficulties[diffKey] });
      }
    });
  }
  
  // === התאמת המלצות לתלמידים מחוננים/מצטיינים ===
  if (student.specialPopulation && recs.difficulties) {
    const pop = student.specialPopulation.toLowerCase();
    if (pop.includes('מחונן') || pop.includes('מצטיין') || pop.includes('מצוין')) {
      Object.entries(recs.difficulties).forEach(([diffKey, tips]) => {
        const dk = diffKey.toLowerCase();
        if (dk.includes('מחונן') || dk.includes('מצטיין') || dk.includes('oe ') || dk.includes('פרפקציוניזם') || dk.includes('שעמום ותת')) {
          if (!matchedRecs.some(r => r.key === diffKey)) {
            matchedRecs.push({ key: diffKey, tips: tips });
          }
        }
      });
    }
  }

  // אם לא נמצאו התאמות, קח את 2 הראשונים
  const finalRecs = matchedRecs.length > 0 
    ? matchedRecs.slice(0, 3) 
    : (recs.difficulties ? Object.entries(recs.difficulties).slice(0, 2).map(([key, tips]) => ({ key, tips })) : []);
  
  // המלצות לפי רובד
  const tierName = score === 'מתקשה מאד' ? 'intensive' : 'targeted';
  const elementaryOnlyKW = ['איתי ולידי', 'צומחים מחדש', 'כיתה א', 'כיתות ב-ג', 'קול קורא', 'אותיות מגנטיות', 'קריאה מהנה'];
  const sType = appState.schoolType;
  const allTierRecs = (recs[tierName] && recs[tierName].length > 0) ? recs[tierName] : [];
  const tierRecs = allTierRecs.filter(r => {
    const ag = r.ageGroup;
    if (ag === 'יסודי' && sType !== 'יסודי') return false;
    if (ag === 'תיכון' && sType !== 'תיכון') return false;
    if (ag === 'חטיבת ביניים' && sType !== 'חטיבת ביניים') return false;
    if (ag === 'על-יסודי' && sType === 'יסודי') return false;
    if (sType !== 'יסודי' && !ag && elementaryOnlyKW.some(kw => r.title && r.title.includes(kw))) return false;
    return true;
  }).slice(0, 2);
  
  // המלצות לשילוב חוזקות - ספציפיות לתחום!
  let strengthsIntegration = '';
  if (studentStrengths.length > 0) {
    const strengthSuggestions = [];
    
    // המלצות לפי חוזקה וגם לפי תחום
    studentStrengths.forEach(strength => {
      // ספורט ותנועה
      if (strength.includes('ספורט') || strength.includes('תנועה') || strength.includes('גופני') || strength.includes('כדור')) {
        if (domain === 'שפה') {
          strengthSuggestions.push('קפיצות לפי הברות של מילים, זריקת כדור בזמן קריאה בקול');
        } else if (domain === 'מתמטיקה') {
          strengthSuggestions.push('קפיצות בין תרגילים, תחנות למידה עם מעבר פיזי, ספירה בתנועה');
        } else if (domain === 'אנגלית') {

  return html;

function formatBotResponse(text) {
  // המרת טקסט מודגש
  let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  // המרת קישורים בפורמט Markdown לקישורי HTML
  formatted = formatted.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="text-emerald-600 hover:text-emerald-700 underline font-medium">$1</a>');
  return formatted;
}

// פונקציה להוספת קישורים לתשובות שמזכירות גליונות כלים שלובים
function addSourceLinksToAnswer(answer) {
  // בדיקה אם התשובה כבר מכילה קישורים
  if (answer.includes('📥 **הורדת המסמך:**') || answer.includes('📥 **הורדת הגליון:**') || answer.includes('[עברית]')) {
    return answer;
  }
  
  // חיפוש גליון בתשובה
  const gilayonMatch = answer.match(/גליון (\d)/);
  if (gilayonMatch) {
    const gilayonNum = gilayonMatch[1];
    const sourceKey = `כלים שלובים - גליון ${gilayonNum}`;
    const links = SOURCE_LINKS[sourceKey];
    
    if (links) {
      answer += `\n\n📥 **הורדת המסמך:**\n• [עברית](${links.he})`;
      if (links.ar) answer += `\n• [ערבית](${links.ar})`;
    }
  }
  return answer;
}

      { question: "מה לעשות כשתלמיד צעיר (א'-ג') לא מצליח להיכנס מרחוק?", answer: "תלמידים צעירים: מוטיבציה גבוהה אך נגישות נמוכה — תלויים בהורים, קשיי תפעול טכני. פתרונות: (1) תפעול פשוט ככל האפשר (קישור ישיר, WhatsApp). (2) הדרכה להורים בסרטון פשוט. (3) חומרים מודפסים כגיבוי. (4) קשר יומי עם ההורים לתיאום שעה נוחה." },
      { question: "מה לעשות כשתלמיד מבוגר (ו'-ט') לא משתתף?", answer: "תלמידים מבוגרים: נגישות טכנית גבוהה אך מוטיבציה נמוכה יותר. פתרונות: (1) פנייה אישית ישירה לתלמיד — לא דרך ההורים. (2) שיחת וידאו אישית (אפקטיבית יותר מטלפון). (3) גמישות בזמן ובדרך הביצוע. (4) שמירה על מסגרת ורצינות — ציונים ממשיכים." },
      { question: "איך תומכים בתלמידים עם מוגבלויות בלמידה מרחוק?", answer: "אתגר כפול: הסתגלות לשינוי בשגרה + צרכים ייחודיים. עקרונות מפתח (משרד החינוך): (1) הוראה מפורשת — מטרות ברורות, פירוק למשימות קטנות, בדיקת הבנה אחרי כל שלב. (2) הנגשה טכנולוגית — Text-to-Speech, הגדלת גופן, תמלילים, AI, תמיכות חזותיות. (3) פרואקטיביות — זיהוי חסמים מראש, שיתוף הורים. (4) המשך תח\"י גם מרחוק. (5) אל תישארי לבד — התייעצי עם צוות פרא-רפואי ומתי\"א." },
      { question: "איך מנגישים שיעור לתלמיד עם לקות למידה בזום?", answer: "הנגשת ההוראה המקוונת: (1) שימו לב לחסמים פוטנציאליים — הכינו מראש. (2) גישה פרואקטיבית עם הורים. (3) כלי עזר: קצב מותאם, סביבה שקטה, הטרמה, הקראה, הסבר מפורט, פיצול משימה לחלקים. (4) שינוי בהתנהלות (חיסורים, ירידה בביצוע, סימני חרדה) = סימן אדום. (5) AI ובינה מלאכותית ככלי הנגשה." },
      { question: "איך תומכים בתלמידים עולים בלמידה מרחוק?", answer: "עולים — חסמי שפה + חסמי מסגרת: (1) הנגשת מידע בשפות הרלוונטיות (אתר, הנחיות). (2) הקלטות וידאו עם כתוביות. (3) קשר הדוק עם הורים — תיאום ערוצי תקשורת. (4) חונך דובר שפה — גיוס מהקהילה. (5) מיפוי: בדקו את תנאי הלמידה בבית ויכולת ההורים לסייע. (6) המשך שיעורי עברית/שפ\"ח גם מרחוק." },
      { question: "איך מתאימים למידה מרחוק לתלמידים מחוננים?", answer: "מחוננים בלמידה מרחוק: סכנת תת-אתגור + ניתוק. (1) משימות עומק: שאלת חקירה אחת מורכבת במקום 10 פשוטות. (2) פרויקטים עצמאיים ותוצרים מגוונים (סרטון, מצגת, כתיבה יצירתית). (3) גמישות בזמן ובמקום — א-סינכרוני מאפשר עבודה בקצב אישי. (4) המשך קשר עם מרכז מחוננים גם מרחוק. (5) למידת עמיתים מתקדמים — זוגות חקר, דיונים." },
      { question: "איך מנהל/ת מובילים למידה מרחוק איכותית?", answer: "ערכת המנהל (אגף חינוך יסודי): (1) שמרו על קשר יומי עם הצוות — שמירת הרקמה החברתית. (2) מיפוי שיטתי: בריאות, רגשות, משפחה, לימודים, טכנולוגיה. (3) הגדירו שגרות ברורות. (4) חלוקת מטלות מאוזנת בין מחנכות ומורות מקצועיות. (5) קיימו צוותי חרום לנושאים שונים. (6) דאגו לשלומות הצוות — מורה שדואגת לעצמה פנויה יותר לתלמידים." },
      { question: "מה מדדי ההצלחה בלמידה מרחוק?", answer: "7 מדדים (ערכת המנהל, אגף חינוך יסודי): (1) יציבות — לכל תלמיד מערכת שבועית ברורה. (2) נוכחות — השתתפות כמו בשגרה. (3) קשר אישי — כל תלמיד בקשר רציף עם איש צוות. (4) קשר חברתי — קשר מתמשך עם בני גיל. (5) למידה — כל תלמיד לומד ומתקדם. (6) מיומנויות — ניהול למידה עצמאית ואוריינות דיגיטלית. (7) חוסן — אין ילדים מנותקים, תלמיד במצוקה מאותר ומקבל מענה." },
      { question: "מה ה'כפר השלם' בלמידה מרחוק?", answer: "עיקרון 'כפר שלם' להצלחה (מסמך ההכלה, אגף חינוך יסודי): אין ילד אחד שמצליח לבד — נדרשת מעטפת שלמה. הכפר כולל: מחנכת, מורות מקצועיות, מורת שילוב, יועצת, פסיכולוגית, הורים, גורמי קהילה — כולם בסנכרון מלא דרך פלטפורמה משותפת לתיעוד ומעקב. בחירום — הכפר הזה הוא לעיתים ההתערבות החשובה ביותר." },
      { question: "איך עובדים עם ילדים בסיכון בלמידה מרחוק?", answer: "פדגוגיה טיפולית (תפיסת אגף בכיר, קורונה): הפדגוגיה היא הכלי הטיפולי המרכזי עבור תלמידים שחוו כישלון, אכזבה ופגיעות. 5 עקרונות: (1) שומרים על קשר — יצירת מרחב פוטנציאלי ויחס אישי. (2) צרכים בסיסיים כתנאי הכרחי — בטחון תזונתי, ציוד קצה. (3) גמישות ודינמיות — שגרה לימודית גמישה המותאמת ללמידה עצמאית-מוחזקת. (4) משוב והערכה — מערך מעקב ובקרה מובנה ומותאם ללמידה ולביקור סדיר. (5) שקיפות בסטטוס — מפה מעודכנת של כל תלמיד; כל פעולה במערכת מקנה תגמול בנקודות זכות." },
      { question: "איך מתמודדים עם פער דיגיטלי בלמידה מרחוק?", answer: "הלמידה בבית מגדילה אי-שוויון. פתרונות שכבתיים: (1) הכינו חוברת שבועית מודפסת — לכל תלמיד ללא אמצעי קצה. (2) אפליקציות מבוססות-טלפון — לילדים עם טלפון בלבד. (3) גיוס מחשב/טאבלט מהרשות המקומית או קהילה. (4) קביעת 'שיחת טלפון יומית' עם הורה לתלמיד ללא גישה. (5) למידת עמיתים — תלמיד בוגר חונך תלמיד צעיר גם בטלפון." },
      { question: "מה עושים עם תלמיד מחונן/מצטיין בלמידה מרחוק כדי שלא יתנתק?", answer: "אגף מחוננים ומצטיינים (2020): (1) שמירת המשכיות מרכז מחוננים — יום השליפה ממשיך להתקיים דיגיטלית. (2) בתכנון הוראה לשאול: האם הפעילות דורשת חשיבה יצירתית/ביקורתית? האם ניתן לחקור עצמאית? האם השיעור סובב שאלה פתוחה/מורכבת? (3) לאפשר בחירה בתוצרים — כתיבה יצירתית, חקר, סרטון, מצגת. (4) כלים שיתופיים טכנולוגיים לשיתוף מחשבות עם עמיתים. (5) מגוון תכנים ברמת מורכבות גבוהה — לא עוד תרגול של מה שכבר ידוע." },
      { question: "תלמיד מחונן מגלה 'עוררות יתר' — חרדה/זעם חריגים בלמידה מרחוק — מה עושים?", answer: "מאפיין Dabrowski: לחלק מהמחוננים יש עוררות יתר המשפיעה על תפיסת המציאות. בחירום/לחץ הם עלולים לחוות רגשות עמוקים יותר: דאגה, חרדה, חוסר אונים, דכדוך, כעס, חוסר שקט מוטורי קיצוני. פעולות: (1) פנו למרכז המחוננים ולהיוועץ עם יועצת המרכז. (2) מתן תשומת לב מיוחדת — שיחה אישית, הכרה ברגשות. (3) יצירת שגרה ויציבות. (4) הקפיצה לחשיבה עמוקה יכולה להסיח — פרויקטי חקר מאפשרים ערוץ לאנרגיה." },
      { question: "איך שומרים על המשכיות לימודית לתלמיד עולה חדש בלמידה מרחוק?", answer: "אגף קליטת עולים (2020): (1) שימור עוגני הזמן של שיעורי אולפן וכל התכניות התוספתיות באמצעים טכנולוגיים. (2) שיעורי תגבור (שע\"ל) בהלימה לחומר הכיתה — הכנה לקראת השתלבות. (3) מיפוי: תנאי למידה בבית, יכולת הורים לסייע, אמצעי קצה. (4) שיבוץ חונך דובר שפה. (5) תרגום מסמכים + מגשרים בית-ספריים. (6) שימוש בספר הדיגיטלי 'הכל חדש' (יסודי) ו'בשביל העברית' (חט\"ב). (7) שמירת קשר רציף עם משפחת העולה." },
      { question: "איך מנגישים למידה מרחוק לתלמיד עם לקות שמיעה?", answer: "הנגשת למידה מקוונת — כבדי שמיעה וחרשים (אגף חינוך מיוחד, תשפ\"ו): (1) בחרו תוכנה עם תמלול אוטומטי — Microsoft Teams מומלץ. (2) מצגות מפורטות בפונט 18+ עם תיאור כתוב לכל הנחיה. (3) מנו 'מתמלל' אנושי או הפעילו תמלול אוטומטי. (4) דברו רק כשהמיקרופונים האחרים מושתקים. (5) שלחו את כל חומרי השיעור לאחריו. (6) תלמידים עם מכשירי שמיעה — חיבור Bluetooth ישיר למחשב או סטרימר/FM. (7) תלמידים ללא מכשירים — אוזניות קשת המכסות אוזניים עם חיבור כבל." },
      { question: "איך מנגישים למידה מרחוק לתלמיד עם אוטיזם?", answer: "הנגשת למידה מקוונת — אוטיזם (אגף חינוך מיוחד, תשפ\"ו): (1) הטרמת סדר היום ותכני השיעור מדי יום לפני השיעור. (2) ארגון חומרי למידה במנות קבועות עם הנחיות כתובות. (3) רקע ללא גירויים — שמרו על סביבה זהה משיעור לשיעור. (4) השתקה מראש — המיקרופונים של התלמידים סגורים, נפתחים רק כשנדרש. (5) אפשרו כיבוי מצלמה לפי צורך התלמיד. (6) שלושה ערוצי תמיכה: טקסט + תמונה + קול. (7) ההורה/תומכת חינוך כמתווך — שיתוף בחומרים לפני השיעור, חדר נפרד לתמיכה." },
      { question: "איך מתכננים שיעור מרחוק שמתאים לכל הכיתה ההטרוגנית?", answer: "8 צעדים לשיעור אוניברסלי (הכלה למעשה — על קצה המזלג): (1) הגדירו מטרות לימודיות ורגשיות-חברתיות. (2) השענו על ניסיון קודם — מה עבד. (3) שערו חסמים אפשריים מראש. (4) הצביעו על פעולות שהניבו השתתפות גבוהה. (5) שוחחו עם תלמידים — מה יהפוך השיעור לנגיש יותר. (6) תכננו שיעור שמתאים לרבים מבלי לסמן תלמיד ספציפי. (7) ערכו משוב עם התלמידים לאחר השיעור. (8) השתמשו בכל הידע לשיפור השיעור הבא. הרעיון המרכזי: ההטרוגניות לא נעלמת בלמידה מרחוק — לעיתים היא מתרחבת." },
      { question: "אילו הזדמנויות ייחודיות מייצרת למידה מרחוק לתלמידים עם קשיים?", answer: "5 הזדמנויות (הכלה למעשה — על קצה המזלג): (1) פרסונליזציה — ניתן להתאים משימות לכל תלמיד בנפרד מבלי שיחוש שונה מהאחרים. (2) תיעוד — הקלטת השיעורים מאפשרת לתלמיד לחזור על החומר בקצב ובשעה שמתאימים לו. (3) הרחבת מעורבות — חלוקה לקבוצות קטנות קלה יותר מבכיתה הפיזית, ועוד תלמידים יכולים להשתתף. (4) היכרות עמוקה — המורה מכירה יותר לעומק את יכולות התלמיד, צרכיו ודרכי הלמידה שלו. (5) גמישות — שיעורים קצרים עם הפוגות, בחירת שעת למידה אישית (א-סינכרוני)." },
      { question: "אילו טכנולוגיות מסייעות מומלצות לתלמידים עם קשיי קריאה?", answer: "עלון טכנולוגיה מסייעת (הכלה למעשה 14, 2019): (1) גמבה — הוראה מתקנת בקריאה, מודולרי, מורה בוחרת שלב ותרגול, חינמי (דורש רישום). (2) שטף קריאה — ארבע רמות קושי, קריינות, מאיצי קריאה, הקלטה והשמעה, חינמי. (3) Spreeder — האצת קריאה, עברית, הצגת מילה אחר מילה, חינמי. (4) עלמה רידר — תוכנת הקראה בעברית, MP3, רקע נע מאחורי המילה המושמעת, שליטה על מהירות. (5) ספרייה מרכזית לעיוורים ולקויי קריאה — ספרי קריאה, ספרי לימוד, עיתונים בפורמט MP3 וברייל." },
      { question: "אילו כלים טכנולוגיים מסייעים לתלמידים עם קשיי כתיבה?", answer: "עלון טכנולוגיה מסייעת (הכלה למעשה 14, 2019): (1) אתר הכתבה — תרגול הכתבות בעברית ובאנגלית, חינמי. (2) אפליקציות speech-to-text — להמרת מלל לטקסט כתוב; מתאים ללקות גרפית (קשיי כתיבת יד) ואורתוגרפית (כתיב). (3) קלוז ב-Word — פקודת 'טפסים' לבניית תרגיל קלוז מותאם אישי. (4) ריבוד טקסט ב-Word — פקודת 'קריאה ברמות' לקריאה מהעיקר לטפל. (5) ספרים דיגיטליים — הפחתת עומס חזותי, שורות קצרות, מילון ממוחשב." },
      { question: "מהן ארבע רמות שילוב טכנולוגיה בהוראה?", answer: "מודל רובן פונטדורה (עלון 14, 2019): (1) החלפה — הטכנולוגיה מחליפה פעילות קיימת ללא שינוי תפקוד (הקלדה במקום כתיבה ידנית). (2) העצמה — מחליפה ומשפרת: בדיקת איות, ספירת מילים, הערות שוליים. (3) עיבוד — שינוי מהותי ומשמעותי של המשימה: מאמר עם סרטונים, קולות, קישורים — הטקסט הסטטי הופך דינמי. (4) הגדרה מחדש — יצירה של משימות שלא היו אפשריות בלי טכנולוגיה: כתיבה שיתופית ב-Google Docs בזמן אמת. >>>  כמדריכת הכלה — שאלי: באיזו רמה הכלי שנבחר פועל? האם אפשר לעלות רמה?" },
      { question: "איך אני כמדריכת הכלה מדריכה מורים לשימוש בטכנולוגיה מסייעת?", answer: "5 עקרונות הדרכה (עלון 14, 2019): (1) לצאת מהצרכים של המורה מול תלמידיה — לא מהכלי. (2) להתאים טכנולוגיה לסיטואציה ולמיומנויות הרצויות, לא להפך. (3) 3-5 כלים רלוונטיים בשנה — לא להציף. (4) לא רק לדבר על — להפעיל! לזהות חסמים אפשריים ביחד. (5) לסייע למורה לבנות שיעור עם הכלי ולנהל דיון על יתרונות וחסרונות. טיפ נוסף: בנו ביחד טבלת כלים מתפתחת לכל צוות ההוראה שאליה מוסיפים כלים לאורך השנה." }
    ]

// פונקציה שיוצרת שאלות מכל ההמלצות הפדגוגיות
function generateAllRecsQuestions() {
  const questions = [];
  
  const domainNames = {
    language: '📖 שפה ואוריינות',
    math: '🔢 מתמטיקה',
    english: '🔤 אנגלית',
    emotional: '💚 רגשי',
    behavioral: '🎭 התנהגותי',
    social: '🤝 חברתי',
    attention: '⚡ קשב וריכוז',
    motor: '🏃 תנועתי-חושי',
    motivation: '🎯 מוטיבציה'
  };
  
  const tierNames = {
    universal: 'רובד אוניברסלי',
    targeted: 'רובד ממוקד',
    intensive: 'רובד אינטנסיבי'
  };
  
  // הוספת המלצות מ-PEDAGOGICAL_RECOMMENDATIONS
  for (const [domainKey, domain] of Object.entries(PEDAGOGICAL_RECOMMENDATIONS)) {
    for (const tier of ['universal', 'targeted', 'intensive']) {
      const recs = domain[tier] || [];
      for (const rec of recs) {
        let answer = `**${rec.title}**\n\n`;
        answer += `📝 ${rec.description}\n\n`;
        answer += `⏱️ **תדירות:** ${rec.frequency}\n`;
        answer += `🎯 **עקרון UDL:** ${rec.udlPrinciple}\n`;
        
        if (rec.tools && rec.tools.length > 0) {
          answer += `🛠️ **כלים:** ${rec.tools.join(', ')}\n`;
        }
        
        if (rec.source) {
          answer += `📚 **מקור:** ${rec.source}\n`;
          // הוספת קישורים להורדה
          const sourceLinks = SOURCE_LINKS[rec.source];
          if (sourceLinks) {
            answer += `\n📥 **הורדת המסמך:**\n`;
            answer += `• [עברית](${sourceLinks.he})\n`;
            if (sourceLinks.ar) answer += `• [ערבית](${sourceLinks.ar})\n`;
          }
        }
        
        answer += `\n📂 **תחום:** ${domainNames[domainKey] || domain.name} | **${tierNames[tier]}**`;
        
        // יצירת שאלה ללא מרכאות כפולות
        questions.push({
          question: `מה זה ${rec.title.replace(/"/g, '')}`,
          answer: answer
        });
      }
    }
  }
  
  // הוספת פרקטיקות נוספות מ-ADDITIONAL_PRACTICES
  for (const [key, practice] of Object.entries(ADDITIONAL_PRACTICES)) {
    let answer = `**${practice.title}**\n\n`;
    answer += `📝 ${practice.description}\n\n`;
    answer += practice.details;
    answer += `\n\n📂 **תחום:** ${practice.domain} | **${practice.tier}**`;
    
    questions.push({
      question: `מה זה ${practice.title}`,
      answer: answer
    });
  }
  
  return questions;
}

function generateResponse(lower, originalMessage) {
  const allQ = getAllQuestions();
  const allQuestions = [...allQ.student, ...allQ.parents, ...allQ.team, ...allQ.terms, ...allQ.realtime, ...allQ.practices, ...allQ.allRecs, ...(allQ.remote || [])];
  
  // ניקוי השאלה מסימנים מיוחדים (כולל מרכאות מכל הסוגים)
  const cleanMessage = originalMessage.replace(/["""''`?!.,\\\-]/g, '').trim();
  const cleanLower = cleanMessage.toLowerCase();
  
  // חיפוש התאמה מדויקת לשאלה (אחרי ניקוי)
  for (const item of allQuestions) {
    const cleanQ = item.question.replace(/["""''`?!.,\\\-]/g, '').trim();
    if (cleanMessage === cleanQ) {
      return addSourceLinksToAnswer(item.answer);
    }
  }
  
  // חיפוש התאמה לשאלה המקורית
  for (const item of allQuestions) {
    if (originalMessage === item.question) {
      return addSourceLinksToAnswer(item.answer);
    }
  }
  
  // חיפוש לפי כותרת ההמלצה (למשל "מה זה כרטיס ניווט")
  const titleMatch = cleanLower.match(/מה זה (.+)/);
  if (titleMatch) {
    const searchTitle = titleMatch[1].trim();
    
    // חיפוש התאמה מדויקת לכותרת
    for (const item of allQuestions) {
      // מחלץ את הכותרת מהשאלה
      const itemClean = item.question.replace(/["""''`?!.,\\\-]/g, '').trim().toLowerCase();
      const itemTitleMatch = itemClean.match(/מה זה (.+)/);
      if (itemTitleMatch) {
        const itemTitle = itemTitleMatch[1].trim();
        if (itemTitle === searchTitle) {
          return addSourceLinksToAnswer(item.answer);
        }
      }
    }
  }
  
  // חיפוש לפי מילות מפתח - רק אם יש התאמה גבוהה
  let bestMatch = null;
  let bestMatchScore = 0;
  let bestMatchTotalWords = 0;
  
  for (const item of allQuestions) {
    const qWords = item.question.split(/[\s,?.!"'"]+/).filter(w => w.length > 2);
    const inputWords = cleanLower.split(/[\s,?.!"'"]+/).filter(w => w.length > 2);
    
    // מילים לפילטור - מילים כלליות מדי
    const stopWords = ['מה', 'זה', 'איך', 'למה', 'מתי', 'איפה', 'האם', 'של', 'את', 'על', 'עם', 'בו', 'לו', 'הוא', 'היא'];
    const filteredInputWords = inputWords.filter(w => !stopWords.includes(w));
    const filteredQWords = qWords.filter(w => !stopWords.includes(w));
    
    let matchScore = 0;
    let exactMatches = 0;
    
    for (const word of filteredInputWords) {
      // התאמה מדויקת
      if (filteredQWords.includes(word)) {
        matchScore += 3;
        exactMatches++;
      }
      // התאמה חלקית
      else if (filteredQWords.some(qw => qw.includes(word) && word.length > 3)) {
        matchScore += 1;
      }
    }
    
    // מחשבים יחס התאמה - צריך שלפחות 50% מהמילים יתאימו
    const matchRatio = filteredInputWords.length > 0 ? exactMatches / filteredInputWords.length : 0;
    
    if (matchScore > bestMatchScore && matchRatio >= 0.5) {
      bestMatchScore = matchScore;
      bestMatch = item;
      bestMatchTotalWords = filteredInputWords.length;
    }
  }
  
  // דרישת סף גבוהה יותר - לפחות 2 התאמות מדויקות או יחס גבוה
  if (bestMatch && bestMatchScore >= 4) {
    return addSourceLinksToAnswer(bestMatch.answer);
  }
  
  // חיפוש בהמלצות הפדגוגיות (PEDAGOGICAL_RECOMMENDATIONS) עם התאמה מדויקת יותר
  const recMatch = searchPedagogicalRecommendations(cleanLower);
  if (recMatch) {
    return recMatch;
  }
  
  // תשובת ברירת מחדל
  return `לא מצאתי תשובה ספציפית לשאלה שלכם על "${cleanMessage}".\n\n**💡 הצעות:**\n• נסו לשאול בצורה יותר ספציפית, למשל: "מה זה כרטיס ניווט?"\n• בחרו קטגוריה למעלה לצפייה בשאלות מוכנות\n• בדקו בתוכנית הכיתתית את ההמלצות המלאות`;
}

// פונקציה לחיפוש בהמלצות הפדגוגיות
function searchPedagogicalRecommendations(searchText) {
  const searchWords = searchText.split(/[\s,?.!"'"]+/).filter(w => w.length > 2);
  const stopWords = ['מה', 'זה', 'איך', 'למה', 'מתי', 'איפה', 'האם', 'של', 'את', 'על', 'עם'];
  const filteredSearchWords = searchWords.filter(w => !stopWords.includes(w));
  
  let bestMatch = null;
  let bestScore = 0;
  
  const domainNames = {
    language: '📖 שפה ואוריינות',
    math: '🔢 מתמטיקה',
    english: '🔤 אנגלית',
    emotional: '💚 רגשי',
    behavioral: '🎭 התנהגותי',
    social: '🤝 חברתי',
    attention: '⚡ קשב וריכוז',
    motor: '🏃 תנועתי-חושי',
    motivation: '🎯 מוטיבציה'
  };
  
  // חיפוש ב-PEDAGOGICAL_RECOMMENDATIONS
  for (const [domainKey, domain] of Object.entries(PEDAGOGICAL_RECOMMENDATIONS)) {
    const allRecs = [...(domain.universal || []), ...(domain.targeted || []), ...(domain.intensive || [])];
    
    for (const rec of allRecs) {
      const titleWords = rec.title.toLowerCase().split(/[\s,?.!"'"]+/).filter(w => w.length > 2);
      
      let score = 0;
      let exactTitleMatches = 0;
      
      // בדיקת התאמה מדויקת לכותרת
      for (const word of filteredSearchWords) {
        if (titleWords.includes(word)) {
          score += 5;
          exactTitleMatches++;
        } else if (titleWords.some(tw => tw.includes(word) && word.length > 3)) {
          score += 2;
        }
      }
      
      // רק אם יש לפחות התאמה אחת מדויקת לכותרת
      if (score > bestScore && exactTitleMatches >= 1) {
        bestScore = score;
        bestMatch = { type: 'rec', rec, domain, domainKey, domainNames };
      }
    }
  }
  
  // חיפוש ב-ADDITIONAL_PRACTICES
  for (const [key, practice] of Object.entries(ADDITIONAL_PRACTICES)) {
    const titleWords = practice.title.toLowerCase().split(/[\s,?.!"'"]+/).filter(w => w.length > 2);
    
    let score = 0;
    let exactTitleMatches = 0;
    
    for (const word of filteredSearchWords) {
      if (titleWords.includes(word)) {
        score += 5;
        exactTitleMatches++;
      } else if (titleWords.some(tw => tw.includes(word) && word.length > 3)) {
        score += 2;
      }
    }
    
    if (score > bestScore && exactTitleMatches >= 1) {
      bestScore = score;
      bestMatch = { type: 'practice', practice };
    }
  }
  
  // חיפוש ב-ADDITIONAL_PRACTICES_ENGLISH
  if (typeof ADDITIONAL_PRACTICES_ENGLISH !== 'undefined') {
    for (const [key, practice] of Object.entries(ADDITIONAL_PRACTICES_ENGLISH)) {
      const titleWords = (practice.title + ' ' + key).toLowerCase().split(/[\s,?.!"'"]+/).filter(w => w.length > 2);
      
      let score = 0;
      let exactTitleMatches = 0;
      
      for (const word of filteredSearchWords) {
        if (titleWords.includes(word)) {
          score += 5;
          exactTitleMatches++;
        } else if (titleWords.some(tw => tw.includes(word) && word.length > 3)) {
          score += 2;
        }
      }
      
      if (score > bestScore && exactTitleMatches >= 1) {
        bestScore = score;
        bestMatch = { type: 'practice', practice };
      }
    }
  }
  
  if (bestMatch && bestScore >= 5) {
    if (bestMatch.type === 'rec') {
      const { rec, domain, domainKey, domainNames } = bestMatch;
      let response = `**${rec.title}**\n\n`;
      response += `📝 **תיאור:** ${rec.description}\n\n`;
      response += `⏱️ **תדירות:** ${rec.frequency}\n`;
      response += `🎯 **עקרון UDL:** ${rec.udlPrinciple}\n`;
      
      if (rec.tools && rec.tools.length > 0) {
        response += `🛠️ **כלים:** ${rec.tools.join(', ')}\n`;
      }
      
      if (rec.source) {
        response += `📚 **מקור:** ${rec.source}\n`;
        // הוספת קישורים להורדה
        const sourceLinks = SOURCE_LINKS[rec.source];
        if (sourceLinks) {
          response += `\n📥 **הורדת המסמך:**\n`;
          response += `• [עברית](${sourceLinks.he})\n`;
          if (sourceLinks.ar) response += `• [ערבית](${sourceLinks.ar})\n`;
        }
      }
      
      response += `\n📂 **תחום:** ${domainNames[domainKey] || domain.name}`;
      
      return response;
    } else if (bestMatch.type === 'practice') {
      const { practice } = bestMatch;
      let response = `**${practice.title}**\n\n`;
      response += `📝 **תיאור:** ${practice.description}\n\n`;
      response += practice.details;
      response += `\n\n📂 **תחום:** ${practice.domain} | **${practice.tier}**`;
      
      return response;
    }
  }
  
  return null;
}

function attachEventListeners() {
  const fileInput = document.getElementById('fileInput');
  if (fileInput) {
    fileInput.addEventListener('change', handleFileUpload);
  }
}

async function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  const errorMsg = document.getElementById('errorMsg');
  const uploadBtn = document.getElementById('uploadBtn');
  
  try {
    uploadBtn.innerHTML = '<div class="loader mx-auto"></div><span class="mr-3">קורא את הקובץ...</span>';
    
    const fileName = file.name.toLowerCase();
    let rows;
    
    if (fileName.endsWith('.csv')) {
      const text = await file.text();
      rows = parseCSV(text);
    } else if (fileName.endsWith('.xls') || fileName.endsWith('.xlsx')) {
      const arrayBuffer = await file.arrayBuffer();
      rows = parseExcel(arrayBuffer);
    } else {
      throw new Error('פורמט לא נתמך. השתמשי ב-CSV, XLS או XLSX');
    }
    
    const students = processOgenData(rows);
    if (students && students.length > 0) {
      appState.students = students;
      render();
    } else {
      throw new Error('לא נמצאו תלמידים בקובץ. ודאי שזה קובץ מכלי העוגן.');
    }
  } catch (err) {
    errorMsg.querySelector('p').textContent = err.message;
    errorMsg.classList.remove('hidden');
    uploadBtn.innerHTML = '<span class="text-2xl">📁</span><span class="text-xl">טעינת קובץ (CSV / XLS / XLSX)</span>';
  }
}

function prepareContentForExport(content) {
  // Clone the content
  const clone = content.cloneNode(true);
  
  // Replace select/input with their values
  clone.querySelectorAll('.resource-cell').forEach(cell => {
    const key = cell.dataset.key;
    const saved = appState.resourceInputs[key] || {};
    const provider = saved.provider === 'אחר' ? (saved.otherProvider || 'אחר') : (saved.provider || '');
    const hours = saved.hours || '';
    const display = provider ? provider + (hours ? ' - ' + hours + ' שעות' : '') : '-';
    
    // Hide inputs and show display
    cell.querySelectorAll('select, input').forEach(el => el.style.display = 'none');
    const displayEl = cell.querySelector('.resource-display');
    if (displayEl) {
      displayEl.style.display = 'block';
      displayEl.textContent = display;
    } else {
      cell.innerHTML = `<span>${display}</span>`;
    }
  });
  
  // Replace students cells
  clone.querySelectorAll('.students-cell').forEach(cell => {
    const key = cell.dataset.key;
    const saved = appState.resourceInputs[key] || {};
    const studentsList = cell.querySelector('.students-list');
    const baseStudentsText = studentsList ? studentsList.textContent : '';
    const baseStudents = baseStudentsText.split(',').map(s => s.trim()).filter(s => s);
    
    // הסרת תלמידים
    const removedStudents = (saved.removedStudents || '').split(',').map(s => s.trim()).filter(s => s);
    const filteredStudents = baseStudents.filter(name => !removedStudents.includes(name));
    
    // הוספת תלמידים
    const additionalStudents = (saved.additionalStudents || '').split(',').map(s => s.trim()).filter(s => s);
    const finalStudents = [...filteredStudents, ...additionalStudents];
    
    const display = finalStudents.join(', ') || '-';
    
    cell.querySelectorAll('input').forEach(el => el.style.display = 'none');
    const displayEl = cell.querySelector('.students-display');
    if (displayEl) {
      displayEl.style.display = 'block';
      displayEl.textContent = display;
    } else {
      cell.innerHTML = `<span>${display}</span>`;
    }
  });
  
  // Replace notes cells
  clone.querySelectorAll('.notes-cell').forEach(cell => {
    const key = cell.dataset.key;
    const saved = appState.resourceInputs[key] || {};
    const notes = saved.notes || '';
    
    cell.querySelectorAll('textarea').forEach(el => el.style.display = 'none');
    const displayEl = cell.querySelector('.notes-display');
    if (displayEl) {
      displayEl.style.display = 'block';
      displayEl.textContent = notes || '-';
    } else if (notes) {
      const label = cell.querySelector('label');
      if (label) {
        cell.innerHTML = `<div><strong>📝 הערות:</strong> ${notes}</div>`;
      }
    }
  });
  
  return clone.innerHTML;
}

    printWindow.document.write(appEl.innerHTML);
    // החזר את המצב המקורי
    hiddenEls.forEach(el => el.style.display = 'none');
  }
  
  printWindow.document.write('</body></html>');
  printWindow.document.close();
  
  setTimeout(() => {
    printWindow.print();
  }, 500);
}

function toggleRec(key) {
  appState.expandedRecs[key] = !appState.expandedRecs[key];
  // עדכון DOM ישיר — ללא render() מלא כדי לשמור sections פתוחים
  const contentEl = document.getElementById('rec-content-' + key);
  const arrowEl = document.getElementById('rec-arrow-' + key);
  if (contentEl) {
    contentEl.style.display = appState.expandedRecs[key] ? 'block' : 'none';
    if (arrowEl) arrowEl.textContent = appState.expandedRecs[key] ? '▲' : '▼';
  } else {
    // fallback אם אין element — render רגיל (sections קיימים אחרים)
    render();
  }
}

function saveNote(studentId) {
  const textarea = document.getElementById('studentNotes');
  if (textarea) {
    appState.notes[studentId] = textarea.value;
  }
}

function askQuestion(q) {
  // הוספת השאלה ישירות להודעות ושליחה
  appState.chatMessages.push({ role: 'user', content: q });
  
  // יצירת תשובה
  const lower = q.toLowerCase();
  let response = generateResponse(lower, q);
  
  appState.chatMessages.push({ role: 'assistant', content: response });
  render();
  
  setTimeout(() => {
    const chatDiv = document.getElementById('chatMessages');
    if (chatDiv) chatDiv.scrollTop = chatDiv.scrollHeight;
  }, 100);
}

function handleChatKey(e) {
  if (e.key === 'Enter') {
    sendChat();
  }
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const message = input ? input.value.trim() : '';
  if (!message) return;
  
  // ניקוי שדה הקלט
  if (input) input.value = '';
  
  appState.chatMessages.push({ role: 'user', content: message });
  
  // יצירת תשובה
  const lower = message.toLowerCase();
  let response = generateResponse(lower, message);
  
  appState.chatMessages.push({ role: 'assistant', content: response });
  render();
  
  // גלילה למטה
  setTimeout(() => {
    const chatDiv = document.getElementById('chatMessages');
    if (chatDiv) chatDiv.scrollTop = chatDiv.scrollHeight;
  }, 100);
}

// ========================================
// פונקציית הדפסה
// ========================================

function printPage() {
  window.print();
}

// ========================================
// הפעלה ראשונית
// ========================================

render();
</script>
