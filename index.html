  "השתמשי ב'תומכי זיכרון' חיצוניים: דף ניווט, רשימת שלבים על השולחן או הקלטת הוראות.": "استخدمي 'دعائم الذاكرة' الخارجية: ورقة الملاحة، قائمة الخطوات على الطاولة أو تسجيل التعليمات.",
  "ספקי לו 'הטרמה מושגית' – תני לו את מפת המושגים של השיעור 5 דקות לפני שכולם מקבלים אותה.": "زوِّديه بـ'التمهيد المفاهيمي' – أعطيه خريطة مفاهيم الدرس قبل 5 دقائق من استلام الجميع لها.",
  "אפשרי לו 'לקרוא באוזניים' – השתמשי בטכנולוגיה מקריאה כדי שיגיע לתוכן למרות קושי הפיענוח.": "أتيحي له 'القراءة بالأذنين' – استخدمي تكنولوجيا القراءة ليصل للمحتوى رغم صعوبة فك التشفير.",
  "אפשרי בחירה בדרכי הבעה: הקלטה קולית, ציור מפה מושגית או מצגת במקום טקסט ארוך.": "أتيحي الاختيار في طرق التعبير: تسجيل صوتي، رسم خريطة مفاهيم أو عرض تقديمي بدلًا من نص طويل.",
  "למשל, מתן תבנית של 'בית מספרים' או טבלה מובנית שבה התלמיד רק צריך ליצוק את הנתونים.": "مثلًا، إعطاء قالب 'بيت الأرقام' أو جدول منظَّم حيث يحتاج الطالب فقط أن يضع البيانات.",
  "השתמשי ב'שעון חול' ויזואלי או בטבלת 'צ'ק ליסט' של המשימות הנדרשות עד סוף השיעור.": "استخدمي 'ساعة الرمل' البصرية أو جدول 'قائمة تحقق' للمهام المطلوبة حتى نهاية الدرس.",
  "הצגת ניסוי בו זמנית דרך סרטון (חזותי), הסבר קולי (שמיעתי) ומגע פיזי באביזרים (תחושתי).": "عرض تجربة في آنٍ واحد عبر فيديو (بصري)، شرح صوتي (سمعي) ولمس فيزيائي بالأدوات (حسي).",
  "זהי את 'נקודת השושנה' שלו (חוזקה) ובקשי ממנו להיות 'המומחה הכיתתי' בתחום זה.": "حدِّدي 'نقطة الوردة' لديه (نقطة قوة) واطلبي منه أن يكون 'خبير الصف' في هذا المجال.",
  "אפשרי לו להשתמש באוזניות חוסמות רעש או למקם אותו ב'פינת ריכוז' שקטה בכיתה.": "أتيحي له استخدام سماعات عازلة للضوضاء أو ضعيه في 'ركن التركيز' الهادئ في الفصل.",
  "בהוראה מפורשת – הדגימי בקול רם איך את מסמנת בעיגול את הפועל ומותחת קו תחת נושא השאלה.": "في التدريس المباشر – مثِّلي بصوت عالٍ كيف تضعين دائرة حول الفعل وتسحبين خطًا تحت موضوع السؤال.",
  "השתמשי ב'הטרמה לשינוי': בעוד 5 דקות אנחנו מסיימים עבודה עצמית ועוברים למליאה.": "استخدمي 'التمهيد للتغيير': بعد 5 دقائق ننتهي من العمل الذاتي وننتقل للجلسة العامة.",
  "פשטי את הטקסט – משפטים קצרים, שפה דבורה ושימוש במארגנים גרפיים.": "بسِّطي النص – جمل قصيرة، لغة محكية واستخدام المنظِّمات البيانية.",
  "'התחלה משותפת' – כתבי איתו את המשפט הראשון או תני לו 'משפטי פתיחה' מוכנים.": "'البداية المشتركة' – اكتبي معه الجملة الأولى أو أعطيه 'جمل افتتاحية' جاهزة.",
  "'תחנות למידה' – מעבר פיזי בין משימות שונות במרחב הכיתה.": "'محطات التعلم' – انتقال جسدي بين مهام مختلفة في مساحة الفصل.",
  "השתמשי ב'כרטיסי רמזור' על השולחן – התלמיד הופך לצבע צהוב כשהוא צריך עזרה שקטה.": "استخدمي 'بطاقات إشارة المرور' على الطاولة – يقلب الطالب للأصفر حين يحتاج مساعدة هادئة.",
  "'קריאה הדדית' – המורה קורא משפט, התלמיד קורא אחריו, ואז קוראים יחד.": "'القراءة المتبادلة' – المعلمة تقرأ جملة، الطالب يقرأ بعدها، ثم يقرآن معًا.",
  "דרך 'סכמת מילה' – הגדרה, מילה נרדפת, משפט מדגים וציור.": "عبر 'مخطط الكلمة' – تعريف، مرادف، جملة نموذجية ورسم.",
  "'כרטיס יציאה' – משפט אחד שהתלמיד כותב על מה שלמד היום לפני שהוא יוצא להפסקה.": "'بطاقة الخروج' – جملة واحدة يكتبها الطالب عما تعلمه اليوم قبل خروجه للاستراحة.",
  "תני לו 'שאלת עומק' אחת מורכבת במקום 10 שאלות פשוטות שמשעממות אותו.": "أعطيه 'سؤال عمق' واحد معقدًا بدلًا من 10 أسئلة بسيطة تُمِلُّه.",
  "הדפיסי את 'פרופיל התלמיד' – התחילי בשלוש חוזקות (שושנים) ורק אז הציגי את היעדים לשיפור.": "اطبعي 'ملف الطالب' – ابدأي بثلاث نقاط قوة (ورود) وبعدها فقط اعرضي الأهداف للتحسين.",
  "הסבירי שזאת 'הנגשה' ולא הנחה. ההתאמה היא כمو سلم يتيح للطالب الوصول للرف العالي.": "اشرحي أن هذا 'إتاحة' وليس تسهيلًا. التكييف كالسلم الذي يُتيح للطالب الوصول للرف العالي.",
  "השתמשי ב'תיאור אובייקטיבי' – במקום 'הוא מפריע', אמרי 'זיהיתי שהוא מתקשה בוויסות בזמני מעבר'.": "استخدمي 'الوصف الموضوعي' – بدلًا من 'إنه مُزعِج'، قولي 'لاحظت أنه يجد صعوبة في التنظيم أثناء فترات الانتقال'.",
  "שלחי להם משימה קצרה וממוקדת: נשמח אם תתרגלו קריאה של 5 דקות ביום.": "أرسلي لهم مهمة قصيرة ومُركَّزة: يسعدنا لو تدرَّبتم على القراءة 5 دقائق يوميًا.",
  "התמקדי בצעד אחד קטן: החודش אנחנו עובדים רק על נושא ההתארגנות בבוקר.": "ركِّزي على خطوة صغيرة واحدة: هذا الشهر نعمل فقط على موضوع التنظيم الصباحي.",
  "הציגי נתונים מול מצופה גיל: המיפוי מראה פער בין היכולת הוורבלית המצוינת שלו לבין קצב הקריאה.": "اعرضي بيانات مقابل المتوقع للعمر: الرسم البياني يُظهر فجوة بين قدرته اللفظية الممتازة وسرعة القراءة.",
  "הסבירי את מודל ה-MTSS: אנחנו בונים לו תמיכה כיתתית וקבוצתית שתקدم العستقلالية.": "اشرحي نموذج MTSS: نحن نبني له دعمًا صفيًّا وجماعيًّا يُعزِّز استقلاليته.",
  "'הקשבה אמפתית' – אני שומעת את התסכול שלך, בוא נחשוב יחד מה יכול לעزור لو داخل הכיתה.": "'الاستماع التعاطفي' – أسمع إحباطك، دعنا نفكر معًا ما يمكن أن يساعده داخل الفصل.",
  "שלחי 'טיפ ברגע' בוואטסאפ: היום התלמיד השתתף בצורה מדהימה בשיעור חשבון.": "أرسلي 'نصيحة لحظية' عبر الواتساب: اليوم شارك الطالب بشكل رائع في درس الحساب.",
  "שאלי אותם: מה הכוחות שאתם רואים בילד בבית שאנחנו יכולים להשתמש בהם בבית הספר?": "اسأليهم: ما نقاط القوة التي تلاحظونها في الطفل في المنزل والتي يمكننا استخدامها في المدرسة؟",
  "הציגי את החלקים שבהם הילד הצליח והסבירי איזה חסם מנע ממנו להצליח בשאר.": "اعرضي الأجزاء التي نجح فيها الطفل واشرحي أي عائق منعه من النجاح في البقية.",
  "קשרי זאת ללמידה: כשהילד פנוי רגשית ומצליח לווסת את עצמו, הוא מצליח גם ללמוד.": "اربطي ذلك بالتعلم: حين يكون الطفل متاحًا عاطفيًّا ويستطيع تنظيم نفسه، ينجح أيضًا في التعلم.",
  "התמקדי בהתקדמות האישית: יחסית לעצמו בתחילת השנה, הוא עשה קפיצה גדולה.": "ركِّزي على التقدم الشخصي: مقارنةً بنفسه في بداية العام، قفز قفزة كبيرة.",
  "סיכום פעולה: סיכמנו על שלוש פעולות שנעשה יחד, אני מאמינה שזה יוביל לשינוי.": "خلاصة العمل: اتفقنا على ثلاثة إجراءات سنقوم بها معًا، أؤمن أن هذا سيؤدي إلى تغيير.",
  "אנחנו בונים את השيעור כך שיתאים מראש לכולם, כדי שהילד שלכם לא ירגיש שونה.": "نحن نبني الدرس بحيث يناسب الجميع مسبقًا، حتى لا يشعر طفلكم بأنه مختلف.",
  "נסי להבין את החסם שלהם – אולי הם חוששים מסטיגמה? הציעי פגישת הסبر مع היועצת.": "حاولي فهم عائقهم – ربما يخشون الوصمة؟ اقترحي لقاء استيضاح مع المستشارة.",
  "השתמשי בגרף ההתקדמות של המערכת כדי להראות את המגמה החיובית.": "استخدمي رسم التقدم البياني للمنظومة لإظهار الاتجاه الإيجابي.",
  "הסבירי את הרציונל המקצועי מתוך תוכנית הלימודים וחוזרי מנכ״ל.": "اشرحي المبرر المهني من منهج الدراسة ومنشورات المدير العام.",
  "עדכני מיד את 'הסיפור הפרטני' במערכת עוגן כדי לדייק את המענים.": "حدِّثي فورًا 'القصة الشخصية' في منظومة عوغن لتدقيق الاستجابات.",
  "שקיפות וקביעת פגישות מעקב סדירות ('נקودות עצירה') כדי לבחון הצלחות.": "الشفافية وتحديد اجتماعات متابعة منتظمة ('نقاط توقف') لفحص النجاحات.",
  "שתפי אותה בחוזקה של התלמיד מתוך העוגן (למשל, חשיבה צורנית) והציעי לה להשתמש בה.": "شاركيها في نقطة قوة الطالب من عوغن (مثلًا، التفكير الشكلي) واقترحي عليها استخدامها.",
  "הפיצו 'דף קשר פדגוגי' קצר עם 3 אסטרטגיות שעובדות עبوره.": "وزِّعوا 'ورقة التواصل التربوي' القصيرة مع 3 استراتيجيات تنجح معه.",
  "הראי לو איך UDL (התאמה כיתתית) חוסכת זמן בניהול בעיות התנהגות.": "أريها كيف أن UDL (التكييف الصفي) يوفر وقتًا في إدارة مشكلات السلوك.",
  "כשהנתונים בעוגן מראים עצירה בהתקדמות למרות יישום תוכנית התערבות מרמה 2.": "حين تُظهر بيانات عوغن توقفًا في التقدم رغم تطبيق خطة تدخل من المستوى 2.",
  "היא יכולה לעבוד עם קבוצה קטנה (רמה 3) או להנחות את המורה בבחירת כلي למענה.": "يمكنها العمل مع مجموعة صغيرة (مستوى 3) أو إرشاد المعلمة في اختيار الأدوات للاستجابة.",
  "הציגי לו את המיפוי הכיתתי ובقشי עזרה בבחירת טקסטים ברמות קריאה שונות.": "اعرضي عليه رسم الصف وأطلبي مساعدة في اختيار نصوص بمستويات قراءة مختلفة.",
  "הסבירי שזה 'מעקף' לקושי בשליפה אוטומטית, שמאפשר לו להראות ידע.": "اشرحي أن هذا 'تحايل' على صعوبة الاسترجاع الآلي، يُتيح له إظهار المعرفة.",
  "היא יכולה להנחות 'שيעor כישורי חיים' ממוקד לקבוצת תלמידים שחווים דחייה.": "يمكنها إرشاد 'درس مهارات حياة' مُركَّز لمجموعة طلاب يختبرون الرفض.",
  "הוא יכול לחזק מיומנויות של ויסות עצמי ושיתוף פעולה דרך משחק.": "يمكنه تعزيز مهارات التنظيم الذاتي والتعاون عبر اللعب.",
  "קيימי איתו שיחת היוועצות קצרה – אולי הוא זקוק להדגמה?": "أجري معه محادثة استشارية قصيرة – ربما يحتاج نمذجة؟",
  "הזמיני אותן לתצפית ממוקדת כדי לקבל המלצות.": "ادعيهن لملاحظة مُركَّزة للحصول على توصيات.",
  "קיימו ישיבת מיפוי קצרה שבה כל מורה מוסيף 'נקודת מבט' על הכיתה מהתחום שלו.": "أجروا اجتماع رسم خرائط قصيرًا يُضيف فيه كل معلم 'زاوية نظر' حول الفصل من مجاله.",
  "'למידה מהצלחות' – בדקו מה המורה המצליח עושה (למשל, נותן בחירה) ונסו לשכפל זאת.": "'التعلم من النجاحات' – تحققوا مما يفعله المعلم الناجح (مثلًا، يُعطي اختيارًا) وحاولوا نسخه.",
  "הוא יכול לסייע בשילוב התלמיד בהפسqות פעילות או בוועדות כיתתיות.": "يمكنه المساعدة في دمج الطالب في الاستراحات النشطة أو اللجان الصفية.",
  "במתן כלים פדגוגיים, חשיפה למאגרי מידع ובניית תוכניות התערבות מبוססות נתונים.": "في تقديم الأدوات التربوية، التعرض لقواعد المعلومات وبناء خطط التدخل المبنية على البيانات.",
  "התלמיד יכול להביע את הידע ההיסטורי או הספרותי שלו דרך יצירה חזותית בשיעور אמנות.": "يمكن للطالب التعبير عن معرفته التاريخية أو الأدبية عبر إبداع بصري في درس الفنون.",
  "יצירת סדירויות (זמן לישيבות), תקצוב משאבים (גפ\"ן) והובלת חזון של 'בית לכולם'.": "إيجاد الانتظام (وقت للاجتماعات)، تخصيص الموارد وقيادة رؤية 'بيت للجميع'.",
  "יצירת 'אמנה כיתתית' שכل המורים חתומים עليה ומחויבים לאותם כللי تגובה.": "إيجاد 'ميثاق صفي' يوقعه جميع المعلمون ويلتزمون بنفس قواعد الاستجابة.",
  "במקרים של קשיים רגשיים עמוקים, מצبי סיכון או צורك באבחון פסיכו-דידקטי.": "في حالات الصعوبات العاطفية العميقة، حالات الخطر أو الحاجة لتشخيص سيكو-تعليمي.",
  "'שיקוף שבועי' – מורת השילוב מעדכנת מה נלמד, והמחנכת מיישמת את האסטרטגיה בשיעור הרגיל.": "'انعكاس أسبوعي' – معلمة الدمج تُحدِّث ما تعلَّم، والمعلمة المشرفة تُطبِّق الاستراتيجية في الدرس العادي.",
  "מערכת תמיכה רב-שכבתית: רמה 1 (כיתה שלמה), רמה 2 (קבוצה קטנה), רמה 3 (פرטני אינटנסיבי).": "منظومة دعم متعدد الطبقات: مستوى 1 (صف كامل)، مستوى 2 (مجموعة صغيرة)، مستوى 3 (فردي مكثف).",
  "שילוב מכניס את התלמיד למערכת הקיימת; הכלה משנה את המערכת כך שתתאים לכל התלמידים.": "الدمج يُدخل الطالب للمنظومة القائمة؛ الشمول يُغيِّر المنظومة لتناسب جميع الطلاب.",
  "הוראה שבה המורה מדגים באופן גלוי את תהליכי החשיבה והביצוע, שלב אחר שלב.": "تدريس تُظهر فيه المعلمة بشكل صريح عمليات التفكير والتنفيذ، خطوة خطوة.",
  "המפגש בין קושי של התלמיד לדרישה של המשימה. הסרת החסם מاfשרת לתלמיד להגיע לתוכן.": "التقاطع بين صعوبة الطالب ومتطلب المهمة. إزالة العائق تُتيح للطالب الوصول للمحتوى.",
  "כלים דיגיטליים (כמו הקראה, חיזוי מילים) שعوזרים לתלמיד עם מוגבלות לתפקד וללמוד.": "أدوات رقمية (كالقراءة الجهرية، توقع الكلمات) تساعد الطالب ذا الإعاقة على التعلم والأداء.",
  "היכולת של התלמיד לנהל את הקשב, הרגשות והפעولות שלו כדי להשיג מטרה לימודית.": "قدرة الطالب على إدارة انتباهه ومشاعره وأفعاله لتحقيق هدف تعليمي.",
  "חשיבה על חשיבה. למשל, לשאול את עצמי בסוף המשימה: איך הצלחתי לפתור את זה?": "التفكير في التفكير. مثلًا، أن أسأل نفسي في نهاية المهمة: كيف نجحت في حل هذا؟",
  "גישה לתכנון לימودים גמיש שמתאים למگوון לומדים דרך ייצוג, הבעה ומעורבות.": "نهج لتخطيط مناهج مرن يناسب تنوع المتعلمين عبر التمثيل والتعبير والانخراط.",
  "שימוש בשפה שמתמקדת ביכولת של התלמיד להשתפر ('עדיין לא הצלחת') במקום בכישלון קבוע.": "استخدام لغة تركز على قدرة الطالب على التحسن ('لم تنجح بعد') بدلًا من الفشل الثابت.",
  "מתן משימות ברמות מורכبות שונות לתלמידים שוним בתוך אותו שיعور.": "إعطاء مهام بمستويات تعقيد مختلفة لطلاب مختلفين ضمن نفس الدرس.",
  "תהלك מובנה של מעבר ממיפוי (נתונים) למטרות ולמעשים (תוכנית עבודה).": "عملية منظَّمة للانتقال من رسم الخرائط (البيانات) إلى الأهداف والإجراءات (خطة عمل).",
  "הוראה שמזהה חסמים מراש ומשתמשת בפרקטיקות עוקפות חסם כחلق מתכנון השיעור.": "تدريس يُحدِّد العوائق مسبقًا ويستخدم ممارسات تتجاوز العائق كجزء من تخطيط الدرس.",
  "תמונה הוליסטית של הכיתה שמשקללת נתונים לימודיים, חברתיים ורגשיים של כלל התלמידים.": "صورة شاملة للصف تُوازن بين البيانات الأكاديمية والاجتماعية والعاطفية لجميع الطلاب.",
  "הגישה המשלבת בין עולם הרגש והיחסים לבין עולם ההוראה והלמידה.": "النهج الذي يُدمج بين عالم المشاعر والعلاقات وعالم التدريس والتعلم.",
  "דמות חינוכית שהתלמיד מרגיש אليה שייך, בטוח ונתמך על ידה.": "شخصية تربوية يشعر الطالب تجاهها بالانتماء والأمان والدعم.",
  "תבנית מארגנת לידع, כمو מבנה קבוע לכתיבת טיעון או לתיאור ניסוי.": "قالب منظِّم للمعرفة، كبنية ثابتة لكتابة الحجة أو وصف التجربة.",
  "בدיקת ידע בדרכים שאינן מבחן סטנדרטי, כמو פרויקט, תלקיט (פורטפוליו) או הצגה בעל פה.": "فحص المعرفة بطرق غير الاختبار المعياري، كالمشروع أو ملف الأعمال (portfolio) أو العرض الشفهي.",
  "כלי דיגיטלי לזיהוי חوزqות וחסמים בתחומים שונים כבסיس לבניית תוכנית התערבות.": "أداة رقمية لتحديد نقاط القوة والعوائق في مجالات مختلفة كأساس لبناء خطة التدخل.",
  "'לחגוג את השونות' – לראות במגוון הכיתתי נכס ולא נטל.": "'الاحتفال بالاختلاف' – رؤية تنوع الصف كمَيزة لا عبء.",
  "לתת לכל תלמיד את מה שהוא צריך כדי להגיע לאותה הזדמנות להצלחה, לא לתת לכולם אותו דבר.": "إعطاء كل طالب ما يحتاجه للوصول لنفس فرصة النجاح، وليس إعطاء الجميع نفس الشيء.",
  "למדי אותו 'שיום רגשות' – 'אני רואה שאתה מתוסכל', ותני לו כלי לוויסות.": "علِّميه 'تسمية المشاعر' – 'أرى أنك محبَط'، وأعطيه أداة للتنظيم.",
  "'טqס פתיחה' קבוע – מוzikה שקטה, תרגיל נשימה או דקה של כתיבה חופשית.": "'طقس الافتتاح' الثابت – موسيقى هادئة، تمرين تنفس أو دقيقة كتابة حرة.",
  "אפשרי לו להתחיל לבד ורק בשלב האחרון להצטרף לדיון.": "أتيحي له البدء وحده وفي المرحلة الأخيرة فقط ينضم للنقاش.",
  "'ריווח פדגוגי' – אפשרי לו לצאת ל-2 דקות התאווררות.": "'التباعد التربوي' – أتيحي له الخروج لـ2 دقائق تهوية.",
  "אל תיכנסי למאבק כוח. 'אני שומעת שאתה כועס, נדבר על זה בסוף השיעור'.": "لا تدخلي في صراع قوة. 'أسمع أنك غاضب، سنتحدث عن هذا في نهاية الدرس'.",
  "השתמשי ב'כלים דיגיטליים אנונימיים' כמו Mentimeter או Padlet.": "استخدمي 'أدوات رقمية مجهولة الهوية' كـMentimeter أو Padlet.",
  "הקריני 'טיימר' על הלוח והגדירי מה התוצר המצופה.": "اعرضي 'مؤقتًا' على السبورة وحدِّدي المنتج المتوقع.",
  "'שיח רגשות כיתתי' – קיימו דיونים על קבלת השונה.": "'خطاب مشاعر صفي' – أجروا نقاشات حول قبول المختلف.",
  "בدqי חסמים – האם המשימה קשה מדי? האם הוא חווה קושי רגשי בבית?": "تحققي من العوائق – هل المهمة صعبة جدًا؟ هل يختبر صعوبة عاطفية في المنزل؟",
  "'קיר הצלחות' – מקום בכיתה שבו תלמידים כותבים מילה טובה זה לזה.": "'جدار النجاحات' – مكان في الفصل يكتب فيه الطلاب كلمة طيبة لبعضهم.",
  "'עוגן חزותי' – הדביקי לו על השולחן רשימת ציוד לכל מקצוע.": "'مرساة بصرية' – الصقي له على الطاولة قائمة أدوات لكل مادة.",
  "'מד רعש' חזותי על הלוח ותפקיד 'אחראי שקट' בכל קבוצה.": "'مقياس الضوضاء' البصري على السبورة ودور 'المسؤول عن الهدوء' في كل مجموعة.",
  "'משימות אתגר' מוכנות מראש בתיקייה מיוחדת.": "'مهام التحدي' جاهزة مسبقًا في مجلد خاص.",
  "ריqון העومס מהקירות, שימוש בתאורה רכה וסידור שולחנות שמאפשר קשר עין.": "إخلاء الجدران من الحمل الزائد، استخدام إضاءة ناعمة وترتيب طاولات يُتيح التواصل البصري.",
  "תני לו דף עם 'שאלות לדוגמה' לפני המבחן.": "أعطيه ورقة بـ'أسئلة نموذجية' قبل الاختبار.",
  "'נراות' – ליווי שקט החوצה או ליועצת, ומתן לגיטימציה לרגש.": "'الرؤية' – مرافقة هادئة للخروج أو للمستشارة، ومنح الشرعية للمشاعر.",
  "'5 דקות אישיות' – שיחה שבועית על נושא שלא קשור ללימودים (תחביבים, משחקים).": "'5 دقائق شخصية' – محادثة أسبوعية حول موضوع لا علاقة له بالدراسة (هوايات، ألعاب).",
  "שימוש ב'חפץ דיבור' – רק מי שמחזיק בו מדבר.": "استخدام 'غرض الكلام' – فقط من يحمله يتكلم.",
  "בדqי אם הוא חווה קושי חברתי. הצieעי לו 'תפקיד' בהפסקה.": "تحققي هل يختبر صعوبة اجتماعية. اقترحي عليه 'دورًا' في الاستراحة.",
  "'סבב חוזqות' – כל תלמיד אומר דبר אחד טוב שהוא עשה היום.": "'جولة نقاط القوة' – كل طالب يقول شيئًا واحدًا جيدًا فعله اليوم.",
  "**חיבור לידע קודם** (גליון 2 - כלים שלובים): בתחילת כל שיעור, הפעילי את הידע הקודם של התלמידים.": "**ربط بالمعرفة السابقة** (ورقة 2 - أدوات مدمجة): في بداية كل درس، فعِّلي المعرفة السابقة للطلاب.",
  "**תיאום ציפיות** (גליון 3 - כלים שלובים): יצירת 'הסכם קבוצתי' - ציפיות הדדיות ברורות וגלויות.": "**تنسيق التوقعات** (ورقة 3 - أدوات مدمجة): إنشاء 'اتفاق جماعي' - توقعات متبادلة واضحة وشفافة.",
  "**סכמות קוגניטיביות** (גליון 4 - כלים שלובים): מבנים מנטליים שעוזרים לארגן מידע. 6 סוגי סכמות.": "**المخططات المعرفية** (ورقة 4 - أدوات مدمجة): بنى ذهنية تساعد في تنظيم المعلومات. 6 أنواع من المخططات.",
  "**כרטיסי ניווט** (גליון 5 - כלים שלובים): כרטיס אישי עם השלבים של אסטרטגיה או משימה.": "**بطاقات الملاحة** (ورقة 5 - أدوات مدمجة): بطاقة شخصية بخطوات استراتيجية أو مهمة.",
  "**הוראה מפורשת של תהליכי חשיבה** (גליון 6 - כלים שלובים): הקניית מטה-קוגניציה והמллה - לעזור לתלמידים לחשוב בקול.": "**التدريس المباشر لعمليات التفكير** (ورقة 6 - أدوات مدمجة): اكتساب ما وراء المعرفة والتصريح - مساعدة الطلاب على التفكير بصوت عالٍ.",
  "**ויסות עצמי ללמידה** (גליון 6 - כלים שלובים): מעגל של הצבת מטרות-תכנון-פיקוח-הערכה. כלים: יומן, צ'ק ליסט.": "**التنظيم الذاتي للتعلم** (ورقة 6 - أدوات مدمجة): حلقة وضع الأهداف-التخطيط-الرقابة-التقييم. أدوات: يومية، قائمة تحقق.",
  "**משקפי משוב צבעוניים** (גליון 7 - כלים שלובים): כלי למתן משוב מגוון ומדויק. 6 צבעים: 🩷 **ורוד** - חיבור אישי, 💚 **ירוק** - חוזקות.": "**نظارات التغذية الراجعة الملونة** (ورقة 7 - أدوات مدمجة): أداة لتقديم تغذية راجعة متنوعة ودقيقة. 6 ألوان: 🩷 **وردي** - تواصل شخصي، 💚 **أخضر** - نقاط القوة.",
  "**משוב לתלמיד עם קשיי קשב** (גליון 7 - כלים שלובים): משוב מיידי, קצר וספציפי. כרטיסי משוב ויזואليים.": "**تغذية راجعة لطالب بصعوبات انتباه** (ورقة 7 - أدوات مدمجة): تغذية راجعة فورية وقصيرة ومحددة. بطاقات تغذية راجعة بصرية.",
  "**משוב לתלמיד חרד לדימוי עצמי** (גליון 4 - כלים שלובים): דגש על התקדמות אישית, שימוש בשפה חיובית.": "**تغذية راجعة لطالب قلق على صورته الذاتية** (ورقة 4 - أدوات مدمجة): التركيز على التقدم الشخصي، استخدام لغة إيجابية.",
  "**משוב לתלמיד הזקוق לאתגר** (גליון 4 - כלים שלובים): משוב שמעודד העמקה וחקירה. 'מצוין! עכשיו נסה...'": "**تغذية راجعة للطالب المحتاج للتحدي** (ورقة 4 - أدوات مدمجة): تغذية راجعة تشجع على التعمق والاستكشاف. 'ممتاز! الآن جرِّب...'",
  "**היכרות אישית - 10 דברים** (גליון 3 - כלים שלובים): פרקטיקה ליצירת היכרות רב-ממדית עם התלמיד.": "**التعارف الشخصي - 10 أشياء** (ورقة 3 - أدوات مدمجة): ممارسة لإنشاء تعارف متعدد الأبعاد مع الطالب.",
  "**כרטיסיות בירור אישי** (גליון 3 - כלים שלובים): כרטיסיות שהתלמיד ממלא לגבי עצמו. דוגמאות: 'מה עוזר לי ללמוד?'": "**بطاقات الاستفسار الشخصي** (ورقة 3 - أدوات مدمجة): بطاقات يملؤها الطالب عن نفسه. أمثلة: 'ما الذي يساعدني على التعلم؟'",
  "**שוק מושגים** (גליון 2 - כלים שלובים): פעילות להעשרת אוצר מילים וחיבור לידע קودם. התלמידים מסתובבים בכיתה.": "**سوق المفاهيم** (ورقة 2 - أدوات مدمجة): نشاط لإثراء المفردات والربط بالمعرفة السابقة. الطلاب يتجولون في الفصل.",
  "**כרטיס 'צריך רגע לעצמי'** (גליון 7 - כלים שלובים): כרטיס שהתלמיד יכול להשתמש בו כשצריך הפוגה רגשית.": "**بطاقة 'أحتاج لحظة لنفسي'** (ورقة 7 - أدوات مدمجة): بطاقة يمكن للطالب استخدامها حين يحتاج استراحة عاطفية.",
  "**משוב תהליכי vs תוצאה** (גליון 7 - כלים שלובים): משוב על תוצاה: 'קيבלת 80'. משוב תהליכי: 'שמתי לב שניסית שלוש אסטרטגיות'.": "**التغذية الراجعة على العملية مقابل النتيجة** (ورقة 7 - أدوات مدمجة): تغذية راجعة على النتيجة: 'حصلت على 80'. على العملية: 'لاحظت أنك جربت ثلاث استراتيجيات'.",
  "**שיטת הרמזור** (גליון 5 - כלים שלובים): אסטרטגיה לכתיבת תשובות השוואה. 🔴 **אדום** - עצור וסמן, 🟡 **צהוב** - תכנן, 🟢 **ירוק** - כתבי.": "**أسلوب إشارة المرور** (ورقة 5 - أدوات مدمجة): استراتيجية لكتابة إجابات المقارنة. 🔴 **أحمر** - توقف وحدِّد، 🟡 **أصفر** - خطط، 🟢 **أخضر** - اكتب.",
  "**מפת חומר** (גליון 6 - כלים שלובים): ייצוג ויזואלי של מסע הלמידה ביחידה. כוللת: מה כבר למדנו, מה נלמד, יעדים.": "**خريطة المحتوى** (ورقة 6 - أدوات مدمجة): تمثيل بصري لرحلة التعلم في الوحدة. تتضمن: ما تعلمناه، ما سنتعلم، الأهداف.",
  "**יומן קופסה שחורה** (גליון 6 - כלים שלובים): יומן חשיבה אישי - מטאפורה מעולם התعיפה. התלמיד מתעד את תהליך הלמידה.": "**يومية الصندوق الأسود** (ورقة 6 - أدوات مدمجة): يومية تفكير شخصية - استعارة من عالم الطيران. الطالب يُسجِّل عملية التعلم.",
  "**תיאום ציפיות יומי** (גליון 3 - כלים שלובים): בתחילת כل שיעור, 2-3 דקות. כتבי על הלוח: 1. מה נלמד 2. מה אצליח לעשות 3. איך נעבוד.": "**تنسيق التوقعات اليومي** (ورقة 3 - أدوات مدمجة): في بداية كل درس، 2-3 دقائق. اكتبي على السبورة: 1. ما نتعلم 2. ما سأستطيع فعله 3. كيف نعمل.",
  "לפי מעבדת ג'וינט-אשלים: בדקו את הסיבה קודם — טكנית (אין מחשב/אינטרנט) או מוטיבציונית.": "وفق مختبر جوينت-إيشليم: تحققوا من السبب أولًا — تقني (لا حاسوب/إنترنت) أو تحفيزي.",
  "שלוש מسלولי פעולה מקבילים: (1) טכני: מעקב שיטتי, חלוקת מחשבים, ווטסאפ כגיבוי. (2) קשר אישי. (3) פedaגוגי.": "ثلاثة مسارات عمل متوازية: (1) تقني: متابعة منهجية، توزيع حواسيب، واتساب كاحتياط. (2) تواصل شخصي. (3) تربوي.",

function render() {
  const app = document.getElementById('app');
  
  if (!appState.students) {
    app.innerHTML = renderWelcomeScreen();
  translateDOM();
  } else {
    app.innerHTML = renderMainApp();
  translateDOM();
  }
  
  attachEventListeners();
  
  // ציור גרפים אם צריך
  if (appState.students && appState.activeTab === 'status' && appState.chartData) {
    setTimeout(renderCharts, 100);
  }
}

function renderCharts() {
  const barCtx = document.getElementById('barChart');
  
  if (!barCtx || !appState.chartData) return;
  
  const { bar } = appState.chartData;
  
  // גרף עמודות
  const domains = Object.keys(bar);
  const domainLabels = domains.map(d => t(d));
  const advancedData = domains.map(d => bar[d]['מתקדם'] || 0);
  const typicalData = domains.map(d => bar[d]['תקין'] || 0);
  const strugglingData = domains.map(d => bar[d]['מתקשה'] || 0);
  const severeData = domains.map(d => bar[d]['מתקשה מאד'] || 0);
  
  // לוג לבדיקה
  console.log('Chart data:', { domains, advancedData, typicalData, strugglingData, severeData });
  console.log('Raw bar data:', bar);
  
  new Chart(barCtx, {
    type: 'bar',
    data: {
      labels: domainLabels,
      datasets: [
        { 
          label: t('מתקדם'), 
          data: advancedData, 
          backgroundColor: '#10b981',
          borderColor: '#059669',
          borderWidth: 1
        },
        { 
          label: t('תקין'), 
          data: typicalData, 
          backgroundColor: '#3b82f6',
          borderColor: '#2563eb',
          borderWidth: 1
        },
        { 
          label: t('מתקשה'), 
          data: strugglingData, 
          backgroundColor: '#f59e0b',
          borderColor: '#d97706',
          borderWidth: 1
        },
        { 
          label: t('מתקשה מאד'), 
          data: severeData, 
          backgroundColor: '#ef4444',
          borderColor: '#dc2626',
          borderWidth: 1
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: false
        },
        tooltip: {
          rtl: true,
          textDirection: 'rtl'
        }
      },
      scales: {
        x: {
          ticks: {
            font: { size: 11 },
            maxRotation: 45,
            minRotation: 45
          }
        },
        y: {
          beginAtZero: true,
          ticks: {
            stepSize: 1
          }
        }
      }
    }
  });
}

function renderClassroomStatus() {
  const students = appState.students;
  
  // תחומים לימודיים ורגשיים
  const academicDomains = ['שפה', 'מתמטיקה', 'אנגלית'];
  const emotionalDomains = ['רגשי', 'התנהגותי', 'חברתי'];
  const allDomains = appState.schoolType === 'יסודי' 
    ? ['שפה', 'מתמטיקה', 'אנגלית', 'מוטיבציה', 'רגשי', 'התנהגותי', 'חברתי', 'קשב', 'תנועתי']
    : ['שפה', 'מתמטיקה', 'אנגלית', 'מוטיבציה', 'רגשי', 'התנהגותי', 'חברתי', 'קשב'];
  
  // חישוב קטגוריות לגרף עוגה
  let advanced = 0;      // מתקדם בכל התחומים
  let typical = 0;       // תקין ב-6+ תחומים
  let academicOnly = 0;  // מתקשה רק בלימודי
  let emotionalOnly = 0; // מתקשה רק ברגשי-חברתי-התנהגותי
  let both = 0;          // מתקשה בשניהם
  
  students.forEach(s => {
    const scores = Object.entries(s.scores);
    const allAdvanced = scores.every(([d, sc]) => sc === 'מתקדם');
    const typicalCount = scores.filter(([d, sc]) => sc === 'תקין' || sc === 'מתקדם').length;
    
    const hasAcademicDifficulty = academicDomains.some(d => 
      s.scores[d] === 'מתקשה' || s.scores[d] === 'מתקשה מאד'
    );
    const hasEmotionalDifficulty = emotionalDomains.some(d => 
      s.scores[d] === 'מתקשה' || s.scores[d] === 'מתקשה מאד'
    );
    
    if (allAdvanced) {
      advanced++;
    } else if (hasAcademicDifficulty && hasEmotionalDifficulty) {
      both++;
    } else if (hasAcademicDifficulty) {
      academicOnly++;
    } else if (hasEmotionalDifficulty) {
      emotionalOnly++;
    } else if (typicalCount >= 6) {
      typical++;
    } else {
      typical++; // ברירת מחדל לתקינים
    }
  });
  
  // חישוב נתונים לגרף עמודות - פריסה לפי תחום
  const domainStats = {};
  allDomains.forEach(domain => {
    domainStats[domain] = { 'מתקדם': 0, 'תקין': 0, 'מתקשה': 0, 'מתקשה מאד': 0 };
  });
  
  students.forEach(s => {
    Object.entries(s.scores).forEach(([domain, score]) => {
      if (domainStats[domain] && domainStats[domain][score] !== undefined) {
        domainStats[domain][score]++;
      }
    });
  });
  
  // חישוב סטטיסטיקות אחרות
  const challenges = {};
  const strengths = {};
  const specialPops = [];
  
  students.forEach(s => {
    Object.entries(s.scores).forEach(([domain, score]) => {
      if (score === 'מתקשה' || score === 'מתקשה מאד') {
        if (!challenges[domain]) challenges[domain] = { count: 0, students: [], details: {} };
        challenges[domain].count++;
        challenges[domain].students.push(s.name);
        if (s.details[domain]) {
          s.details[domain].split('\n').filter(d => d.trim()).forEach(detail => {
            const clean = detail.replace(/^-\s*/, '').trim();
            if (clean) {
              if (!challenges[domain].details[clean]) {
                challenges[domain].details[clean] = { count: 0, students: [] };
              }
              challenges[domain].details[clean].count++;
              challenges[domain].details[clean].students.push(s.name);
            }
          });
        }
      }
    });
    
    if (s.strengths) {
      s.strengths.split('\n').filter(x => x.trim()).forEach(str => {
        const clean = str.replace(/^-\s*/, '').trim();
        if (clean) {
          if (!strengths[clean]) strengths[clean] = { count: 0, students: [] };
          strengths[clean].count++;
          strengths[clean].students.push(s.name);
        }
      });
    }
    
    if (s.specialPopulation) specialPops.push({ name: s.name, type: s.specialPopulation });
  });

  // יעדים מוצעים
  const goals = Object.entries(challenges)
    .sort((a, b) => b[1].count - a[1].count)
    .slice(0, 3)
    .map(([domain, data]) => {
      const topDetail = Object.entries(data.details).sort((a, b) => b[1].count - a[1].count)[0];
      return topDetail 
        ? `${t('חיזוק')} ${t(domain)}: ${t(topDetail[0])} (${data.count} ${t('תלמידים)')}` 
        : `${t('שיפור')} ${t(domain)} (${data.count} ${t('תלמידים)')}`;
    });

  // שמירת נתוני הגרפים בstate
  appState.chartData = {
    pie: { advanced, typical, academicOnly, emotionalOnly, both },
    bar: domainStats
  };
  
  // שמירת נתונים נוספים ל-state לתצוגה מאוחרת
  appState.statusData = { challenges, strengths, specialPops, goals };

  // בניית תוכן לפי הסעיף הנבחר
  let sectionContent = '';
  
  if (appState.selectedStatusSection === 'strengths') {
    sectionContent = `

      ${Object.keys(strengths).length > 0 ? `

          <div class="space-y-3">

    sectionContent = `

        <div class="space-y-4">

// פונקציה: זיהוי פרופיל אוכלוסייה של תלמיד ובניית המלצות מרחוק מותאמות
function detectStudentRemoteProfile(student) {
  const pop = (student.specialPopulation || '').toLowerCase();
  const scores = student.scores || {};
  const profile = [];
  
  // מחונן/מצטיין
  if (pop.includes('מחונן') || pop.includes('מצטיין') || pop.includes('מצוין')) profile.push('gifted');
  
  // עולה חדש
  if (pop.includes('עולה') || pop.includes('עולים') || pop.includes('תושב חוזר')) profile.push('olim');
  
  // מוגבלויות — לפי scores או population
  const hasPhysical = pop.includes('מוגבלות פיזית') || pop.includes('גופני') || pop.includes('CP') || pop.includes('שיתוק מוחין');
  const hasAutism = pop.includes('אוטיזם') || pop.includes('ASD') || pop.includes('ספקטרום');
  const hasHearing = pop.includes('כבד שמיעה') || pop.includes('חרש') || pop.includes('שמיעה');
  const hasLD = pop.includes('לקות למידה') || pop.includes('לקות ל') || pop.includes('דיסלקסיה') || pop.includes('דיסגרפיה') || pop.includes('דיסקלקוליה');
  const hasAttention = pop.includes('קשב') || pop.includes('adhd') || pop.includes('ADHD') || scores['קשב'] === 'מתקשה' || scores['קשב'] === 'מתקשה מאד';
  
  if (hasPhysical) profile.push('physical');
  if (hasAutism) profile.push('autism');
  if (hasHearing) profile.push('hearingImpaired');
  if (hasLD) profile.push('learningDisabilities');
  if (hasAttention && !hasLD) profile.push('attentionDifficulties');
  
  // בסיכון — רק לפי שדה האוכלוסייה הייחודית (לא לפי מספר קשיים)
  if (pop.includes('בסיכון') || pop.includes('סיכון') || pop.includes('at risk') || pop.includes('נשירה') || pop.includes('הזנחה') || pop.includes('אלימות')) profile.push('atRisk');
  
  return profile;
}

          return parts.join('<span style="color:#94a3b8">, </span>');
        })()}</div>
        <div class="mt-1 space-y-1">
          <input type="text" placeholder="➕ הוסיפי תלמידים (מופרדים בפסיק)" value="${additionalStudents}"
            onchange="updateResourceInput('${key}', 'additionalStudents', this.value)"
            class="additional-students w-full text-xs border border-green-300 rounded px-2 py-1 bg-green-50" />
          <input type="text" placeholder="➖ הסירי תלמידים (מופרדים בפסיק)" value="${removedStudents}"
            onchange="updateResourceInput('${key}', 'removedStudents', this.value)"
            class="removed-students w-full text-xs border border-red-300 rounded px-2 py-1 bg-red-50" />
          <div class="flex gap-1 items-center">
            <span class="text-xs text-slate-400 whitespace-nowrap">מ-</span>
            <input type="date" value="${savedDates.dateFrom || ''}"
              onchange="debouncedUpdate('${key}', 'dateFrom', this.value)"
              class="flex-1 text-xs border border-slate-200 rounded px-1 py-1" title="תאריך תחילת מענה" />
            <span class="text-xs text-slate-400 whitespace-nowrap">עד-</span>
            <input type="date" value="${savedDates.dateTo || ''}"
              onchange="debouncedUpdate('${key}', 'dateTo', this.value)"
              class="flex-1 text-xs border border-slate-200 rounded px-1 py-1" title="תאריך סיום מענה" />
          </div>
        </div>
        <div class="mt-1 flex items-center justify-between no-print">
          <span class="history-last-update text-xs text-slate-400">${(() => { const h = appState.interventionHistory && appState.interventionHistory[key]; return h && h.length > 0 ? 'עודכן: ' + h[0].date : ''; })()}</span>
          <button onclick="showHistoryModal('${key}', getKeyLabel('${key}'))" class="text-xs text-indigo-500 hover:text-indigo-700 underline">📋 היסטוריה</button>
        </div>
        <span class="students-display hidden print-only text-xs"></span>
      </div>
    `;
  };
  
  // פונקציה ליצירת שדה הערות
  const renderNotesField = (key) => {
    const saved = appState.resourceInputs[key] || {};
    const notes = saved.notes || '';
    return `
      <div class="notes-cell mt-4 p-3 bg-slate-50 rounded-lg border border-slate-200" data-key="${key}">
        <label class="text-sm font-medium text-slate-700 block mb-2">${t("📝 הערות:")}</label>
        <textarea 
          placeholder="הערות נוספות..."
          onchange="updateResourceInput('${key}', 'notes', this.value)"
          class="notes-input w-full text-sm border border-slate-300 rounded px-3 py-2 min-h-[60px]">${notes}</textarea>
        <span class="notes-display hidden print-only text-sm">${notes}</span>
      </div>
    `;
  };
  
  // בניית טבלת תחום לימודי - מחולק לרבדים
  const renderAcademicDomainTable = (domain) => {
    // פונקציה לפיצול קשיים מטקסט
    const parseDifficulties = (text) => {
      if (!text) return [];
      // פיצול לפי שורות חדשות, מקפים או פסיקים
      return text
        .split(/[\n,]/)
        .flatMap(part => part.split(/\s*-\s*/))
        .map(d => d.trim())
        .filter(d => d.length > 0);
    };
    
    // איסוף כל הקשיים הייחודיים (ללא כפילויות) מתלמידים מתקשים
    const allDifficultiesSet = new Set();
    
    students.forEach(s => {
      if (s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד') {
        // איסוף קשיים
        if (s.details && s.details[domain.scoreKey]) {
          parseDifficulties(s.details[domain.scoreKey]).forEach(diff => {
            allDifficultiesSet.add(diff);
          });
        }
      }
    });
    
    // איסוף תלמידים לפי רובד - כמו בתוכנית הכיתתית (לא תלוי בציון)
    const targetedStudents = students.filter(s => 
      s.interventions && s.interventions[domain.groupedKey]
    );
    const intensiveStudents = students.filter(s => 
      s.interventions && s.interventions[domain.intensiveKey]
    );
    
    const allDifficulties = [...allDifficultiesSet];
    
    if (allDifficulties.length === 0 && targetedStudents.length === 0 && intensiveStudents.length === 0) {
      return `
        <div class="bg-emerald-50 rounded-lg p-4 text-center text-emerald-700">
          ✓ אין תלמידים מתקשים בתחום זה
        </div>
      `;
    }
    
    let html = '<div class="space-y-4">';
    
    // רובד אוניברסלי - כל הקשיים ביחד (ללא כפילויות)
    if (allDifficulties.length > 0) {
      const uniRecs = getRecommendations(domain.key, 'universal');
      const uniKey = `${domain.key}-universal`;
      // איסוף שמות התלמידים המתקשים בתחום - אלו שבגינם ניתן המענה האוניברסלי
      const strugglingInDomain = students.filter(s => 
        s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד'
      ).map(s => s.name);
      html += `
        <div class="bg-blue-50 rounded-lg p-4 border border-blue-200">
          <div class="flex items-center gap-2 mb-3">
            <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-medium">${t("🌐 רובד אוניברסלי")}</span>
          </div>
          <table class="w-full border-collapse text-sm">
            <thead>
              <tr class="bg-blue-100">
                <th class="border border-blue-200 px-3 py-2 text-right font-bold">קשיים בתחום</th>
                <th class="border border-blue-200 px-3 py-2 text-right font-bold">תלמידים שבגינם ניתן המענה</th>
                <th class="border border-blue-200 px-3 py-2 text-right font-bold">${t("המלצות פדגוגיות")}</th>
                <th class="border border-blue-200 px-3 py-2 text-right font-bold">משאבים</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="border border-blue-200 px-3 py-2 text-xs">${allDifficulties.join(', ')}</td>
                <td class="border border-blue-200 px-3 py-2">${strugglingInDomain.length > 0 ? renderStudentsCell(uniKey + '-students', strugglingInDomain) : '-'}</td>
                <td class="border border-blue-200 px-3 py-2 text-xs">${[...uniRecs, 'הוראה מפורשת וישירה'].join(', ')}</td>
                <td class="border border-blue-200 px-3 py-2">${renderResourceCell(uniKey)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }
    
    // רובד ממוקד - כל התלמידים ברובד זה
    if (targetedStudents.length > 0) {
      const tarRecs = getRecommendations(domain.key, 'targeted');
      
      // בתחום שפה - פיצול לקבוצות לפי נושא עבודה
      if (domain.key === 'language') {
        // קשיים הקשורים לקריאה
        const readingKeywords = ['קריאה', 'פענוח', 'שטף', 'קצב קריאה', 'דיוק בקריאה'];
        
        // חלוקת תלמידים וקשיים לקבוצות
        const readingGroup = { students: new Set(), difficulties: new Set() };
        const otherGroup = { students: new Set(), difficulties: new Set() };
        
        targetedStudents.forEach(s => {
          if (s.details && s.details[domain.scoreKey]) {
            const studentDiffs = parseDifficulties(s.details[domain.scoreKey]);
            let hasReading = false;
            let hasOther = false;
            
            studentDiffs.forEach(diff => {
              const isReading = readingKeywords.some(kw => diff.includes(kw));
              if (isReading) {
                readingGroup.difficulties.add(diff);
                hasReading = true;
              } else {
                otherGroup.difficulties.add(diff);
                hasOther = true;
              }
            });
            
            if (hasReading) readingGroup.students.add(s.name);
            if (hasOther) otherGroup.students.add(s.name);
            
            // אם אין קשיים ספציפיים, הוסף לקבוצת "אחר"
            if (!hasReading && !hasOther) {
              otherGroup.students.add(s.name);
            }
          } else {
            // תלמיד ללא פירוט קשיים - הוסף לקבוצת "אחר"
            otherGroup.students.add(s.name);
          }
        });
        
        html += `
          <div class="bg-amber-50 rounded-lg p-4 border border-amber-200">
            <div class="flex items-center gap-2 mb-3">
              <span class="bg-amber-100 text-amber-700 px-2 py-1 rounded text-xs font-medium">${t("👥 רובד ממוקד")}</span>
            </div>
            <table class="w-full border-collapse text-sm">
              <thead>
                <tr class="bg-amber-100">
                  <th class="border border-amber-200 px-3 py-2 text-right font-bold">נושא עבודה</th>
                  <th class="border border-amber-200 px-3 py-2 text-right font-bold">קשיים</th>
                  <th class="border border-amber-200 px-3 py-2 text-right font-bold">תלמידים</th>
                  <th class="border border-amber-200 px-3 py-2 text-right font-bold">${t("המלצות פדגוגיות")}</th>
                  <th class="border border-amber-200 px-3 py-2 text-right font-bold">משאבים</th>
                </tr>
              </thead>
              <tbody>
                ${readingGroup.students.size > 0 ? `
                  <tr>
                    <td class="border border-amber-200 px-3 py-2 font-medium">📖 קריאה</td>
                    <td class="border border-amber-200 px-3 py-2 text-xs">${[...readingGroup.difficulties].join(', ') || '-'}</td>
                    <td class="border border-amber-200 px-3 py-2">${renderStudentsCell('language-targeted-reading', [...readingGroup.students])}</td>
                    <td class="border border-amber-200 px-3 py-2 text-xs">${tarRecs.join(', ') || '-'}</td>
                    <td class="border border-amber-200 px-3 py-2">${renderResourceCell('language-targeted-reading')}</td>
                  </tr>
                ` : ''}
                ${otherGroup.students.size > 0 ? `
                  <tr>
                    <td class="border border-amber-200 px-3 py-2 font-medium">✍️ כתיבה ושפה</td>
                    <td class="border border-amber-200 px-3 py-2 text-xs">${[...otherGroup.difficulties].join(', ') || '-'}</td>
                    <td class="border border-amber-200 px-3 py-2">${renderStudentsCell('language-targeted-writing', [...otherGroup.students])}</td>
                    <td class="border border-amber-200 px-3 py-2 text-xs">${tarRecs.join(', ') || '-'}</td>
                    <td class="border border-amber-200 px-3 py-2">${renderResourceCell('language-targeted-writing')}</td>
                  </tr>
                ` : ''}
              </tbody>
            </table>
          </div>
        `;
      } else {
        // תחומים אחרים - שורה אחת עם כל התלמידים
        const tarKey = `${domain.key}-targeted`;
        
        // איסוף קשיים ייחודיים של תלמידי הרובד הממוקד
        const targetedDifficultiesSet = new Set();
        targetedStudents.forEach(s => {
          if (s.details && s.details[domain.scoreKey]) {
            parseDifficulties(s.details[domain.scoreKey]).forEach(diff => {
              targetedDifficultiesSet.add(diff);
            });
          }
        });
        const targetedDifficulties = [...targetedDifficultiesSet];
        
        html += `
          <div class="bg-amber-50 rounded-lg p-4 border border-amber-200">
            <div class="flex items-center gap-2 mb-3">
              <span class="bg-amber-100 text-amber-700 px-2 py-1 rounded text-xs font-medium">${t("👥 רובד ממוקד")}</span>
            </div>
            <table class="w-full border-collapse text-sm">
              <thead>
                <tr class="bg-amber-100">
                  <th class="border border-amber-200 px-3 py-2 text-right font-bold">קשיים</th>
                  <th class="border border-amber-200 px-3 py-2 text-right font-bold">תלמידים</th>
                  <th class="border border-amber-200 px-3 py-2 text-right font-bold">${t("המלצות פדגוגיות")}</th>
                  <th class="border border-amber-200 px-3 py-2 text-right font-bold">משאבים</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="border border-amber-200 px-3 py-2 text-xs">${targetedDifficulties.join(', ') || '-'}</td>
                  <td class="border border-amber-200 px-3 py-2">${renderStudentsCell(tarKey, targetedStudents.map(s => s.name))}</td>
                  <td class="border border-amber-200 px-3 py-2 text-xs">${tarRecs.join(', ') || '-'}</td>
                  <td class="border border-amber-200 px-3 py-2">${renderResourceCell(tarKey)}</td>
                </tr>
              </tbody>
            </table>
          </div>
        `;
      }
    }
    
    // רובד אינטנסיבי - כל התלמידים ברובד זה
    if (intensiveStudents.length > 0) {
      const intRecs = getRecommendations(domain.key, 'intensive');
      const intKey = `${domain.key}-intensive`;
      
      // איסוף קשיים ייחודיים של תלמידי הרובד האינטנסיבי
      const intensiveDifficultiesSet = new Set();
      intensiveStudents.forEach(s => {
        if (s.details && s.details[domain.scoreKey]) {
          parseDifficulties(s.details[domain.scoreKey]).forEach(diff => {
            intensiveDifficultiesSet.add(diff);
          });
        }
      });
      const intensiveDifficulties = [...intensiveDifficultiesSet];
      
      html += `
        <div class="bg-red-50 rounded-lg p-4 border border-red-200">
          <div class="flex items-center gap-2 mb-3">
            <span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-medium">${t("👤 רובד אינטנסיבי")}</span>
          </div>
          <table class="w-full border-collapse text-sm">
            <thead>
              <tr class="bg-red-100">
                <th class="border border-red-200 px-3 py-2 text-right font-bold">קשיים</th>
                <th class="border border-red-200 px-3 py-2 text-right font-bold">תלמידים</th>
                <th class="border border-red-200 px-3 py-2 text-right font-bold">${t("המלצות פדגוגיות")}</th>
                <th class="border border-red-200 px-3 py-2 text-right font-bold">משאבים</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="border border-red-200 px-3 py-2 text-xs">${intensiveDifficulties.join(', ') || '-'}</td>
                <td class="border border-red-200 px-3 py-2">${renderStudentsCell(intKey, intensiveStudents.map(s => s.name))}</td>
                <td class="border border-red-200 px-3 py-2 text-xs">${intRecs.join(', ') || '-'}</td>
                <td class="border border-red-200 px-3 py-2">${renderResourceCell(intKey)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }
    
    // שדה הערות לתחום
    html += renderNotesField(`${domain.key}-notes`);
    
    html += '</div>';
    return html;
  };
  
  // בניית טבלת תחום רגשי/התנהגותי
  const renderEmotionalDomainTable = (domain) => {
    const studentsWithDifficulty = students.filter(s => 
      s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד'
    );
    
    if (studentsWithDifficulty.length === 0) {
      return `
        <div class="bg-emerald-50 rounded-lg p-4 text-center text-emerald-700">
          ✓ אין תלמידים מתקשים בתחום זה
        </div>
      `;
    }
    
    // חלוקה לרבדים
    const grouped = studentsWithDifficulty.filter(s => s.interventions && s.interventions.emotionalGrouped);
    const intensive = studentsWithDifficulty.filter(s => s.interventions && s.interventions.emotionalIntensive);
    
    const rows = [];
    if (grouped.length > 0) {
      rows.push({ tier: 'ממוקד', students: grouped, tierKey: 'targeted', colorClass: 'amber' });
    }
    if (intensive.length > 0) {
      rows.push({ tier: 'אינטנסיבי', students: intensive, tierKey: 'intensive', colorClass: 'red' });
    }
    
    if (rows.length === 0) return '';
    
    return `
      <div class="space-y-4">
        <div class="overflow-x-auto">
          <table class="w-full border-collapse text-sm">
            <thead>
              <tr class="bg-slate-100">
                <th class="border border-slate-300 px-3 py-2 text-right font-bold">רובד</th>
                <th class="border border-slate-300 px-3 py-2 text-right font-bold">תלמידים</th>
                <th class="border border-slate-300 px-3 py-2 text-right font-bold">${t("המלצות פדגוגיות")}</th>
                <th class="border border-slate-300 px-3 py-2 text-right font-bold">משאבים</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(row => {
                const recs = getRecommendations(domain.key, row.tierKey);
                const key = `${domain.key}-${row.tier}`;
                return `
                  <tr class="hover:bg-slate-50">
                    <td class="border border-slate-300 px-3 py-2">
                      <span class="px-2 py-1 rounded text-xs font-medium bg-${row.colorClass}-100 text-${row.colorClass}-700">
                        ${row.tier}
                      </span>
                    </td>
                    <td class="border border-slate-300 px-3 py-2">${renderStudentsCell(key, row.students.map(s => s.name))}</td>
                    <td class="border border-slate-300 px-3 py-2 text-xs">${recs.join(', ') || '-'}</td>
                    <td class="border border-slate-300 px-3 py-2">${renderResourceCell(key)}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
        ${renderNotesField(`${domain.key}-notes`)}
      </div>
    `;
  };

  return `
    <div class="animate-fadeIn space-y-6">
      <!-- כפתורי פעולה -->
      <div class="flex flex-wrap gap-3 justify-between items-center no-print">
        <button onclick="toggleSummaryTable()" 
          class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition-all flex items-center gap-2">
          <span>→</span> חזרה לתוכנית הכיתתית
        </button>
        <div class="flex gap-2">
          <button onclick="printSummaryTable()" 
            class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-all flex items-center gap-2">
            🖨️ הדפסה בפורמט טבלה
          </button>
          <button onclick="exportToWord()" 
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-all flex items-center gap-2">
            📄 Word
          </button>
        </div>
      </div>
      
      <!-- תוכן הטבלה להדפסה -->
      <div id="summaryTableContent" class="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
        <!-- כותרת -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-6">
          <h2 class="text-2xl font-bold text-center">📊 טבלת מענים מסכמת</h2>
          <p class="text-center text-indigo-100 mt-2">תוכנית התערבות כיתתית לפי מודל MTSS</p>
        </div>

        <div class="p-3 px-6 bg-slate-50 border-b border-slate-200 flex justify-end">
          <button onclick="collapseAllSections()" class="text-xs text-slate-500 hover:text-slate-700 bg-white border border-slate-200 rounded-lg px-3 py-1.5 hover:bg-slate-50 transition-colors flex items-center gap-1">
            ▶ סגור את כל הלשוניות
          </button>
        </div>
        

        <div class="border-b border-slate-200 bg-gradient-to-r from-sky-50 to-cyan-50">
          <div onclick="toggleSection('sec-remote')" class="p-4 px-6 cursor-pointer hover:bg-slate-100/50 flex items-center justify-between transition-colors">
            <h3 class="text-lg font-bold text-slate-800">🖥️ למידה מרחוק — סינכרוני וא-סינכרוני</h3>
            <span id="arrow-sec-remote" class="text-slate-400 text-xl">${appState.openSections && appState.openSections["sec-remote"] ? "▼" : "▶"}</span>
          </div>
          ${(() => { const _secOpen = appState.openSections && appState.openSections["sec-remote"]; return `<div id="sec-remote" style="display:${_secOpen ? "block" : "none"}">` })()}
            ${renderRemoteLearningSection(students)}

            <div class="text-center mt-4 mb-2">
              <button onclick="toggleSection('sec-remote')" class="text-xs text-slate-400 hover:text-slate-600 border border-slate-200 rounded-lg px-4 py-1.5 hover:bg-white transition-colors">▲ סגור לשונית</button>
            </div>
          </div>
        </div>

        <div class="border-b border-slate-200 ">
          <div onclick="toggleSection('sec-learning')" class="p-4 px-6 cursor-pointer hover:bg-slate-100/50 flex items-center justify-between transition-colors">
            <h3 class="text-lg font-bold text-slate-800">📚 מענים לימודיים</h3>
            <span id="arrow-sec-learning" class="text-slate-400 text-xl">${appState.openSections && appState.openSections["sec-learning"] ? "▼" : "▶"}</span>
          </div>
          ${(() => { const _secOpen = appState.openSections && appState.openSections["sec-learning"]; return `<div id="sec-learning" style="display:${_secOpen ? "block" : "none"}">` })()}
        <!-- רובד אוניברסלי לימודי - כלל הכיתה -->
        ${(() => {
          // איסוף תלמידים עם מענים אוניברסליים לימודיים
          const learningUniversalInterventions = [
            { key: 'evaluationAdaptations', name: 'התאמות כלליות בדרכי הערכה', rec: 'התאמת מבחנים, הארכת זמן, הקראה' },

    { key: 'motivation', name: 'מוטיבציה והרגלי למידה', icon: '🎯', scoreKey: 'מוטיבציה', type: 'emotional' },
    { key: 'emotional', name: 'רגשי', icon: '💚', scoreKey: 'רגשי', type: 'emotional' },
    { key: 'behavioral', name: 'התנהגותי', icon: '🎭', scoreKey: 'התנהגותי', type: 'emotional' },
    { key: 'social', name: 'חברתי', icon: '🤝', scoreKey: 'חברתי', type: 'emotional' },
    { key: 'attention', name: 'קשב וריכוז', icon: '⚡', scoreKey: 'קשב', type: 'emotional' },
    { key: 'motor', name: 'תנועתי-חושי-מרחבי', icon: '🏃', scoreKey: 'תנועתי', type: 'emotional' }
  ];
  // סנן תנועתי לעל-יסודי
  const domains = appState.schoolType === 'יסודי' ? allPlanDomains : allPlanDomains.filter(d => d.key !== 'motor');

  // אם מוצגת טבלה מסכמת
  if (appState.showSummaryTable) {
    return renderSummaryTable(domains);
  }

  // אם לא נבחר תחום, הצג את כפתורי הבחירה
  if (!appState.selectedDomain) {
    return `
      <div class="animate-fadeIn space-y-6">
        <!-- כפתור טבלה מסכמת -->
        <div class="flex justify-center">
          <button onclick="toggleSummaryTable()" 
            class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition-all flex items-center gap-3">
            <span class="text-2xl">📊</span>
            <span>טבלת מענים מסכמת להדפסה</span>
          </button>
        </div>
        
        <div class="bg-white rounded-2xl shadow-lg p-8 border border-slate-100">
          <h3 class="text-2xl font-bold text-slate-900 mb-6">${t("📋 בחרו תחום לצפייה בתוכנית")}</h3>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
            ${domains.map(domain => {
              const recs = PEDAGOGICAL_RECOMMENDATIONS[domain.key];
              if (!recs) return '';
              
              const studentsWithDifficulty = appState.students.filter(s => 
                s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד'
              );
              
              const hasDifficulties = studentsWithDifficulty.length > 0;
              
              return `
                <button onclick="selectDomain('${domain.key}')"
                  class="py-5 px-4 rounded-xl transition-all shadow-sm hover:shadow-lg border-2 text-center ${hasDifficulties ? 'bg-gradient-to-br from-amber-50 to-orange-50 border-amber-300 hover:border-amber-400' : 'bg-gradient-to-br from-slate-50 to-white border-slate-200 hover:border-blue-300'}">
                  <div class="text-3xl mb-2">${domain.icon}</div>
                  <div class="font-bold text-slate-900 text-sm">${domain.name}</div>
                  ${hasDifficulties ? `<div class="text-xs text-amber-700 mt-1">⚠️ ${studentsWithDifficulty.length} תלמידים מתקשים</div>` : '<div class="text-xs text-slate-400 mt-1">${t("✓ תקין")}</div>'}
                </button>
              `;
            }).join('')}

            <div class="text-center mt-4 mb-2">
              <button onclick="toggleSection('sec-gifted')" class="text-xs text-slate-400 hover:text-slate-600 border border-slate-200 rounded-lg px-4 py-1.5 hover:bg-white transition-colors">▲ סגור לשונית</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // תחום נבחר - הצג את התוכנית לתחום זה
  const domain = domains.find(d => d.key === appState.selectedDomain);
  if (!domain) return '';
  
  const recs = PEDAGOGICAL_RECOMMENDATIONS[domain.key];
  if (!recs) return '';
  
  const studentsWithDifficulty = appState.students.filter(s => 
    s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד'
  );
  
  let studentsGrouped = [];
  let studentsIntensive = [];
  
  if (domain.type === 'learning') {
    studentsGrouped = appState.students.filter(s => 
      s.interventions && s.interventions[domain.groupedKey]
    );
    studentsIntensive = appState.students.filter(s => 
      s.interventions && s.interventions[domain.intensiveKey]
    );
  } else {
    studentsGrouped = appState.students.filter(s => 
      (s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד') &&
      s.interventions && s.interventions.emotionalGrouped
    );
    studentsIntensive = appState.students.filter(s => 
      (s.scores[domain.scoreKey] === 'מתקשה' || s.scores[domain.scoreKey] === 'מתקשה מאד') &&
      s.interventions && s.interventions.emotionalIntensive
    );
  }

  return `
    <div class="space-y-6 animate-fadeIn">
      <!-- כפתור חזרה ובחירת תחום אחר -->
      <div class="flex items-center gap-4 flex-wrap">
        <button onclick="selectDomain(null)" 
          class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition-all flex items-center gap-2">
          <span>→</span> חזרה לכל התחומים
        </button>
        <div class="flex gap-2 flex-wrap">
          ${domains.map(d => {
            const isSelected = d.key === appState.selectedDomain;
            const dRecs = PEDAGOGICAL_RECOMMENDATIONS[d.key];
            if (!dRecs) return '';
            return `
              <button onclick="selectDomain('${d.key}')"
                class="py-1 px-3 rounded-full text-sm transition-all ${isSelected ? 'bg-blue-600 text-white' : 'bg-white border border-slate-200 hover:border-blue-300 text-slate-600'}">
                ${d.icon} ${d.name.split(' ')[0]}
              </button>
            `;
          }).join('')}
        </div>
      </div>
      
      <!-- תוכנית התחום הנבחר -->
      <div class="bg-white rounded-2xl shadow-lg p-8 border border-slate-100">
        <h3 class="text-2xl font-black text-slate-900 mb-4">${domain.icon} ${domain.name}</h3>
        
        ${studentsWithDifficulty.length > 0 ? `
          <div class="bg-slate-50 rounded-xl p-4 mb-6">
            <p class="text-sm font-bold text-slate-700 mb-2">תלמידים מתקשים בתחום זה (${studentsWithDifficulty.length}):</p>
            <p class="text-slate-600">${studentsWithDifficulty.map(s => s.name).join(', ')}</p>
          </div>
        ` : ''}
        
        <!-- המלצות פדגוגיות לתחום -->
        <div class="bg-gradient-to-br from-slate-50 to-white rounded-xl p-5 mb-5 border border-slate-200">
          <div class="flex items-center gap-2 mb-4 pb-3 border-b border-slate-200">
            <span class="text-lg">📋</span>
            <h4 class="font-bold text-slate-700 text-base">${t("המלצות פדגוגיות — הוראה בכיתה")}</h4>
          </div>
          ${renderTier('🌐 רובד אוניברסלי - לכלל הכיתה', 'universal', recs.universal, domain.key, [])}
          ${renderTier('👥 רובד ממוקד - קבוצות קטנות', 'targeted', recs.targeted, domain.key, studentsGrouped)}
          ${renderTier('👤 רובד אינטנסיבי - פרטני', 'intensive', recs.intensive, domain.key, studentsIntensive)}
        </div>
        
        <!-- למידה מרחוק -->
        <div class="bg-gradient-to-r from-sky-50 to-cyan-50 rounded-xl p-4 mb-4 border border-sky-200">
          <div class="flex items-center gap-2 mb-3 pb-2 border-b border-sky-200">
            <span class="text-lg">🖥️</span>
            <h4 class="font-bold text-sky-800 text-base">למידה מרחוק — המלצות לתחום זה</h4>
          </div>
          ${(() => {
            const d = REMOTE_LEARNING_RECOMMENDATIONS.byDomain[domain.key];
            if (!d) return '<p class="text-sm text-slate-500">אין המלצות ספציפיות לתחום זה</p>';
            
            // שילוב המלצות כלליות + ייחודיות לרמת גיל
            const schoolTypeKey = appState.schoolType === 'תיכון' ? 'high' : appState.schoolType === 'חטיבת ביניים' ? 'middle' : null;
            const dExtra = schoolTypeKey && REMOTE_LEARNING_RECOMMENDATIONS.bySchoolType && REMOTE_LEARNING_RECOMMENDATIONS.bySchoolType[schoolTypeKey] ? REMOTE_LEARNING_RECOMMENDATIONS.bySchoolType[schoolTypeKey][domain.key] : null;
            const mergeItems = (base, extra) => {
              if (!extra) return base || [];
              const baseArr = Array.isArray(base) ? base : (base ? [{ title: '', desc: base }] : []);
              const extraArr = Array.isArray(extra) ? extra : [{ title: '', desc: extra }];
              return [...baseArr, ...extraArr];
            };
            const tiers = [
              { key: 'remote-' + domain.key + '-universal', data: mergeItems(d.universal, dExtra && dExtra.universal), label: '🌐 אוניברסלי — לכלל הכיתה', hdr: 'bg-blue-50 border-blue-200 text-blue-800', border: 'border-blue-200', students: [] },
              { key: 'remote-' + domain.key + '-targeted',  data: mergeItems(d.targeted,  dExtra && dExtra.targeted),  label: '👥 ממוקד — קבוצות קטנות',   hdr: 'bg-amber-50 border-amber-200 text-amber-800', border: 'border-amber-200', students: studentsGrouped },
              { key: 'remote-' + domain.key + '-intensive', data: mergeItems(d.intensive, dExtra && dExtra.intensive), label: '👤 אינטנסיבי — פרטני',        hdr: 'bg-red-50 border-red-200 text-red-800', border: 'border-red-200', students: studentsIntensive }
            ];
            
            let h = '<div class="space-y-2">';
            tiers.forEach(tier => {
              if (!tier.data) return;
              const list = Array.isArray(tier.data) ? tier.data : [{ title: "", desc: tier.data }];
              const isOpen = appState.expandedRecs[tier.key];
              const studs = tier.students || [];
              h += '<div class="rounded-lg border ' + tier.border + ' overflow-hidden">';
              h += '<button onclick="toggleRec(\'' + tier.key + '\')" class="w-full flex items-center justify-between px-4 py-2.5 ' + tier.hdr + ' hover:opacity-90 transition-opacity text-right">';
              h += '<div class="flex items-center gap-3">';
              h += '<span class="font-bold text-sm">' + tier.label + '</span>';
              if (studs.length > 0) {
                h += '<span class="text-xs bg-white/70 px-2 py-0.5 rounded-full border border-current opacity-70">' + studs.length + ' תלמידים</span>';
              }
              h += '</div>';
              h += '<span id="rec-arrow-' + tier.key + '" class="text-sm">' + (isOpen ? '▲' : '▼') + '</span>';
              h += '</button>';
              h += '<div id="rec-content-' + tier.key + '" style="' + (isOpen ? 'display:block' : 'display:none') + '">';
              if (studs.length > 0) {
                h += '<div class="bg-white/60 mx-3 mt-3 p-3 rounded-lg border ' + tier.border + '">';
                h += '<span class="text-xs font-bold text-slate-700">תלמידים ברובד זה: </span>';
                h += '<span class="text-xs text-slate-600">' + studs.map(s => s.name).join(', ') + '</span>';
                h += '</div>';
              }
              h += '<div class="p-3 space-y-2">';
              list.forEach(item => {
                h += '<div class="bg-white rounded-lg p-3 border ' + tier.border + '">';
                if (item.title) h += '<span class="font-bold text-xs text-slate-800">' + (t(item.title)) + '</span><br>';
                h += '<span class="text-xs text-slate-600">' + (t(item.desc || item)) + '</span>';
                h += '</div>';
              });
              h += '</div></div>';
              h += '</div>';
            });
            h += '</div>';
            return h;
          })()}
        </div>
        ${renderSmallGroupPractices()}
        ${renderExplicitTeaching()}
      </div>
      
      <!-- לחצני ניווט תחתית — כפילות של הראש -->
      <div class="flex items-center gap-4 flex-wrap pt-2">
        <button onclick="selectDomain(null)" 
          class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg transition-all flex items-center gap-2">
          <span>→</span> חזרה לכל התחומים
        </button>
        <div class="flex gap-2 flex-wrap">
          ${domains.map(d => {
            const isSelected = d.key === appState.selectedDomain;
            const dRecs = PEDAGOGICAL_RECOMMENDATIONS[d.key];
            if (!dRecs) return '';
            return `
              <button onclick="selectDomain('${d.key}')"
                class="py-1 px-3 rounded-full text-sm transition-all ${isSelected ? 'bg-blue-600 text-white' : 'bg-white border border-slate-200 hover:border-blue-300 text-slate-600'}">
                ${d.icon} ${d.name.split(' ')[0]}
              </button>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderTier(title, tier, recommendations, domainKey, studentsInTier) {
  if (!recommendations || recommendations.length === 0) return '';
  
  // === סינון המלצות לפי סוג בית ספר ===
  const elementaryOnlyKeywords = ['איתי ולידי', 'צומחים מחדש', 'כיתה א', 'כיתות ב-ג', 'קול קורא', 'אותיות מגנטיות', 'קריאה מהנה', 'ספרי ילדים ונוער'];
  const schoolType = appState.schoolType;
  const filteredRecs = recommendations.filter(rec => {
    const ag = rec.ageGroup;
    // סינון לפי ageGroup מדויק
    if (ag === 'יסודי' && schoolType !== 'יסודי') return false;
    if (ag === 'תיכון' && schoolType !== 'תיכון') return false;
    if (ag === 'חטיבת ביניים' && schoolType !== 'חטיבת ביניים') return false;
    // על-יסודי = חט"ב + תיכון
    if (ag === 'על-יסודי' && schoolType === 'יסודי') return false;
    // סינון לפי מילות מפתח (backwards compatibility)
    if (schoolType !== 'יסודי' && !ag && elementaryOnlyKeywords.some(kw => rec.title && rec.title.includes(kw))) return false;
    return true;
  });
  
  if (filteredRecs.length === 0) return '';
  
  const tierConfig = {
    universal: { hdr: 'bg-teal-50 border-teal-300 text-teal-800',   body: 'from-teal-50 to-green-50 border-teal-300' },
    targeted:  { hdr: 'bg-amber-50 border-amber-200 text-amber-800', body: 'from-amber-50 to-yellow-50 border-amber-200' },
    intensive: { hdr: 'bg-rose-50 border-rose-200 text-rose-800',    body: 'from-rose-50 to-red-50 border-rose-200' }
  };
  const cfg = tierConfig[tier] || tierConfig.universal;

  // מפתח לפתיחה/סגירה של כל ה-tier
  const tierKey = domainKey + '-tier-' + tier;
  const tierOpen = appState.expandedRecs[tierKey];

  return `
    <div class="rounded-xl mb-3 border overflow-hidden bg-gradient-to-br ${cfg.body}">
      <!-- כותרת tier — לחיצה פותחת/סוגרת -->
      <button onclick="toggleRec('${tierKey}')"
        class="w-full flex items-center justify-between p-4 ${cfg.hdr} hover:opacity-90 transition-opacity text-right">
        <div class="flex items-center gap-3">
          <h4 class="text-base font-bold text-slate-900">${title}</h4>
          ${studentsInTier && studentsInTier.length > 0 ? `
            <span class="text-xs bg-white/70 text-slate-600 px-2 py-0.5 rounded-full border border-slate-200">
              ${studentsInTier.length} תלמידים
            </span>` : ''}
        </div>
        <span id="rec-arrow-${tierKey}" class="text-lg text-slate-500">${tierOpen ? '▲' : '▼'}</span>
      </button>

      <!-- תוכן tier — סגור כברירת מחדל -->
      <div id="rec-content-${tierKey}" style="${tierOpen ? 'display:block' : 'display:none'}">
        ${studentsInTier && studentsInTier.length > 0 ? `
          <div class="bg-white/60 rounded-lg mx-4 mt-3 p-3 border border-slate-200">
            <p class="text-sm font-medium text-slate-700">
              <span class="font-bold">${t("תלמידים ברובד זה:")}</span>
              <span class="text-slate-600 mr-2">${studentsInTier.map(s => s.name).join(', ')}</span>
            </p>
          </div>
        ` : ''}

        <div class="p-4 space-y-2">
          ${filteredRecs.map((rec, idx) => {
            const key = `${domainKey}-${tier}-${idx}`;
            const isExpanded = appState.expandedRecs[key];
            const sourceLinks = rec.source && SOURCE_LINKS[rec.source] ? SOURCE_LINKS[rec.source] : null;
            return `
              <div class="bg-white/70 rounded-xl border border-slate-200 overflow-hidden">
                <button onclick="toggleRec('${key}')" class="w-full p-3 flex items-center justify-between hover:bg-slate-50 text-right">
                  <div class="flex items-center gap-2">
                    <span>💡</span>
                    <span class="font-bold text-sm text-slate-900">${t(rec.title)}</span>
                  </div>
                  <span id="rec-arrow-${key}" class="text-slate-400 text-sm">${isExpanded ? '▲' : '▼'}</span>
                </button>
                <div id="rec-content-${key}" style="${isExpanded ? 'display:block' : 'display:none'}">
                  <div class="px-4 pb-4 space-y-3">
                    <p class="text-slate-700 text-sm">${t(rec.description)}</p>
                    <div class="flex flex-wrap gap-2">
                      <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-xs font-medium">${t(rec.frequency)}</span>
                      <span class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-xs font-medium">${t(rec.udlPrinciple)}</span>
                      ${rec.source ? `<span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-xs font-medium">📚 ${t(rec.source)}</span>` : ''}
                    </div>
                    ${rec.tools && rec.tools.length > 0 ? `
                      <div class="bg-slate-50 rounded-lg p-3">
                        <p class="text-xs font-bold text-slate-600 mb-2">${t("כלים:")}</p>
                        <div class="flex flex-wrap gap-2">
                          ${rec.tools.map(tool => `<span class="bg-white text-slate-700 px-2 py-1 rounded text-xs border">${t(tool)}</span>`).join('')}
                        </div>
                      </div>
                    ` : ''}
                    ${sourceLinks ? `
                      <div class="bg-emerald-50 rounded-lg p-3 border border-emerald-200">
                        <p class="text-xs font-bold text-emerald-700 mb-2">📥 הורדת המסמך:</p>
                        <div class="flex flex-wrap gap-2">
                          <a href="${sourceLinks.he}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-xs font-medium transition-colors inline-flex items-center gap-1">
                            ${_currentLang === 'ar' ? (t('עברי')) : (sourceLinks.ar ? 'עברית' : 'צפייה במסמך')}
                          </a>
                          ${sourceLinks.ar ? `<a href="${sourceLinks.ar}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-xs font-medium transition-colors inline-flex items-center gap-1">
                            ערבית
                          </a>` : ''}
                        </div>
                      </div>
                    ` : ''}
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderSmallGroupPractices() {
  const smallGroupKeys = [
    'מודל איתי לידי במרחב',
    'ארגון קבוצות הטרוגניות וממוקדות',
    'ניהול שיח קבוצתי ותפקידים',
    'הערכה קבוצתית ומחוון'
  ];

  const practices = smallGroupKeys
    .map(key => ADDITIONAL_PRACTICES[key])
    .filter(Boolean);

  if (practices.length === 0) return '';

  let html = '<div class="bg-gradient-to-br from-sky-50 to-blue-50 rounded-xl p-5 mb-4 border border-sky-200">';
  html += '<h4 class="text-lg font-bold text-slate-900 mb-3">' + t("🤝 פרקטיקות למידה בקבוצות קטנות") + '</h4>';
  html += '<p class="text-sm text-slate-600 mb-4">' + t("כלים לארגון וניהול קבוצות קטנות בכיתה — רלוונטיים לכלל התחומים") + '</p>';
  html += '<div class="space-y-2">';

  practices.forEach((practice, idx) => {
    const key = 'small-group-' + idx;
    const isExpanded = appState.expandedRecs[key];
    const formattedDetails = practice.details
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n\n/g, '<br><br>')
      .replace(/\n/g, '<br>');

    html += '<div class="bg-white/70 rounded-xl border border-sky-200 overflow-hidden">';
    html += '<button onclick="toggleRec(\'' + key + '\')" class="w-full p-4 flex items-center justify-between hover:bg-sky-50 text-right">';
    html += '<div class="flex items-center gap-3">';
    html += '<span>🛠️</span>';
    html += '<span class="font-bold text-slate-900">' + (t(practice.title)) + '</span>';
    html += '<span class="bg-sky-100 text-sky-700 px-2 py-0.5 rounded text-xs font-medium">' + (t('קבוצות קטנות')) + '</span>';
    html += '</div>';
    html += '<span>' + (isExpanded ? '▲' : '▼') + '</span>';
    html += '</button>';
    if (isExpanded) {
      html += '<div class="px-4 pb-4 space-y-3">';
      html += '<p class="text-slate-700">' + (t(practice.description)) + '</p>';
      html += '<div class="flex flex-wrap gap-2">';
      html += '<span class="bg-sky-100 text-sky-800 px-3 py-1 rounded-full text-xs font-medium">📂 ' + practice.domain + '</span>';
      html += '<span class="bg-sky-200 text-sky-900 px-3 py-1 rounded-full text-xs font-medium">🎯 ' + practice.tier + '</span>';
      html += '</div>';
      html += '<div class="bg-slate-50 rounded-lg p-4 text-sm text-slate-700 leading-relaxed">' + formattedDetails + '</div>';
      html += '</div>';
    }
    html += '</div>';
  });

  html += '</div></div>';
  return html;
}
